# Keep — hub de alertas del clúster.
#
# Ingesta: Alertmanager POSTea in-cluster a keep-backend:8080/alerts/event/prometheus
# con basic auth (user=api_key). Al vivir en el mismo namespace que
# vmalertmanager, el camino crítico de notificación es una llamada de Service
# a Service: sin ingress, sin salto externo, sin hostAliases.
#
# Auth: IngressRoute + middleware keycloak/sso-chain (oauth2-proxy compartido, ya
# restringido a /edani-admins + /edani-operators). Keep lee la identidad de los
# headers X-Auth-Request-*; ver manifests/ingressroutes.yaml.
#
# Base de datos: postgres-shared (CNPG en ns databases). Rol, Database CR y
# credenciales viven en k8s-infra-pocharlies/databases/postgres-shared.

global:
  # Rutas gestionadas a mano en manifests/ingressroutes.yaml: el template de
  # Traefik del chart hardcodea `ingressClassName: traefik`, y aquí las clases
  # son traefik-lan / traefik-edge. Además la convención del repo para UIs de
  # observabilidad es IngressRoute + sso-chain, no Ingress.
  ingress:
    enabled: false

# Postgres del chart desactivada: usamos el CNPG compartido, que ya tiene
# backup a MinIO y 2 instancias.
database:
  enabled: false

# Soketi desactivado: evita un tercer host y un componente más en el camino.
# La UI hace polling en vez de push (PUSHER_DISABLED en backend y frontend).
websocket:
  enabled: false

backend:
  enabled: true
  # UNA réplica, y es un cambio de criterio consciente.
  #
  # Aquí ponía 2 con el razonamiento "Keep es el único notificador: una réplica
  # en un nodo no es aceptable". Ese razonamiento sólo se sostiene si las dos
  # réplicas caen en nodos DISTINTOS. Al consolidar Keep en `sauvage`
  # (nodeSelector abajo), las dos vivirían en el mismo nodo: sobrevivirían a la
  # muerte de un pod, pero no a la del nodo — que es el fallo del que protegía la
  # segunda réplica. Mantener 2 seria pagar el doble por una HA que ya no existe.
  #
  # Lo que SÍ sigue cubriendo el fallo de nodo es la lane directa de Telegram de
  # Alertmanager (`backstop-telegram` en manifests/alertmanager-config.yaml), que
  # no pasa por Keep: si sauvage cae, KeepBackendAbsent sale por ahí.
  replicaCount: 1

  # La DB es externa y ya está sana; el init container de espera asume MySQL local.
  waitForDatabase:
    enabled: false

  databaseConnectionStringFromSecret:
    enabled: true
    secretName: keepsvc-database
    secretKey: dsn

  provision:
    # Los providers NO van aquí: el chart los renderiza a un Secret desde values,
    # lo que dejaría el bot_token de Telegram en git. Llegan por KEEP_PROVIDERS
    # desde el ExternalSecret keepsvc-provisioning (manifests/keep-secrets.yaml).
    providers: {}

    # El chart monta esto como ConfigMap en /workflows y fija
    # KEEP_WORKFLOWS_DIRECTORY solo. Un fichero por `id`.
    #
    # -------------------------------------------------------------------
    # QUÉ NOTIFICA Y QUÉ NO — el criterio, en un sitio
    #
    # Registrar todo e ignorar el ruido son cosas distintas. Alertmanager
    # entrega el 100% de las series a Keep (visibilidad, auditoría), pero
    # notificar el 100% sería un downgrade: hoy 15 de 47 instancias activas
    # producen mensaje; notificar por alerta daría 45. x3 de ruido.
    #
    # Por eso la notificación se dispara con `type: incident`, no `type: alert`:
    #
    #   alerta ingerida      -> siempre: registro auditable en Keep
    #   regla de correlación -> convierte un patrón de alertas en 1 incidente
    #   incidente creado     -> Telegram + Aurora
    #
    # Consecuencia buscada: una alerta que no encaja en ninguna regla queda
    # REGISTRADA Y CALLADA. Las 116 series que hoy caen al blackhole entran así
    # por defecto, y se promueven a notificables una a una añadiéndolas a una
    # regla — no al revés. La red de seguridad es la regla `critical-safety-net`
    # (keep/rules/correlation-rules.yaml): cualquier critical se convierte en
    # incidente por sí sola, así que ninguna crítica puede quedarse muda.
    #
    # La clave es `events`, NO `on`. Verificado en el código de la v0.52.1:
    # `WorkflowManager.insert_incident` filtra con
    # `trigger.get("events", [])` (workflowmanager.py:147-154) y el parser pasa
    # los triggers TAL CUAL, sin traducir nada
    # (`get_triggers_from_workflow_dict` → `workflow.get("triggers", [])`).
    # Un trigger con `on:` deja esa lista vacía y el workflow se descarta
    # SIEMPRE, en silencio. Con `on: [create]` estos tres workflows estuvieron
    # registrados y con 0 ejecuciones desde el cutover: ninguna notificación de
    # Keep llegó a salir. Sólo sobrevivió el backstop directo a Telegram del
    # Alertmanager, que cubre 6 alertnames de "hub caído".
    #
    # Y el valor es `created` en pasado, no `create`: es la cadena literal que
    # despacha el motor de reglas (`send_workflow_event(..., "created")`);
    # las otras son `updated` y `deleted`.
    #
    # `[created]` y no `[created, updated]` a propósito: Alertmanager reenvía
    # cada minuto (pass-through), y notificar en update convertiría eso en un
    # mensaje por minuto. El coste es que una escalada de severidad dentro de un
    # incidente ya abierto no vuelve a avisar.
    #
    # La severidad de los CEL de aquí es la NORMALIZADA por Keep. El manejo de
    # `page` y `warn` (que Keep ingiere como `info`) está en las reglas de
    # correlación, que es donde se decide la cobertura:
    # keep/rules/correlation-rules.yaml.
    # -------------------------------------------------------------------
    workflows:
      # ---------------------------------------------------------------------
      # EL RESUMEN LLM VIVE EN SU PROPIO WORKFLOW (`incident-summary`), y no es
      # una preferencia de estilo: en Keep 0.52.1 NO EXISTE ninguna forma de que
      # un `step` que falla deje correr las acciones.
      #
      # `incident.generated_summary` no se puede llenar en la versión OSS: el
      # generador vivía en ee/experimental/generative_utils.py, borrado del repo
      # público en el commit bdc8e52d (2024-11-25), y la tarea que lo invocaba
      # (`process_summary_generation`) no tiene worker ni pool ARQ. Ni
      # EE_ENABLED=true lo resucita. Además, los incidentes que crea el motor de
      # correlación nunca pasan por ahí: create_incident_for_grouping_rule sólo
      # escribe user_generated_name. Por eso el resumen lo generamos nosotros.
      #
      # CORRECCIÓN 2026-08-05 — aquí ponía que `continue_on_error: true` protegía
      # el envío, "verificado en workflow.py:97 / step.py:49". Es FALSO, y costó
      # 62 avisos perdidos en 7 días. Los hechos, leídos en el 0.52.1 que corre
      # en producción y reproducidos contra ese mismo código:
      #
      #   1. `continue_on_error` NO EXISTE en Keep 0.52.1. Un grep del paquete
      #      entero no lo encuentra. Step.__init__ (step.py:45-48) sólo lee
      #      `on-failure.retry` y `continue`; cualquier otra clave cae en
      #      self.config y no la mira nadie. Era decorativa desde que se puso.
      #   2. Step.run() (step.py:78-88) envuelve CUALQUIER excepción en
      #      ActionError. Pero run_steps() (workflow.py:96) y Workflow.run()
      #      (workflow.py:174) sólo capturan StepError, y ActionError NO hereda
      #      de StepError — issubclass(ActionError, StepError) es False. O sea
      #      que la excepción ni siquiera "se relanza": se escapa de todos los
      #      manejadores y desenrolla por encima de run_actions()
      #      (workflow.py:182), que nunca llega a ejecutarse.
      #
      # Consecuencia: un step que falla = CERO notificaciones, para TODOS los
      # incidentes, críticos incluidos, y justo cuando el clúster va mal. Medido
      # el 2026-08-05 sobre 7 días: 78 ejecuciones de notificación en error de
      # 656 (12%), de las cuales 62 eran este step de LLM (34 de conexión a
      # LiteLLM + 28 de 400 por rotación de alias del backend-sync).
      #
      # Por eso los dos workflows de aviso de aquí abajo NO TIENEN `steps:`. Un
      # workflow sin steps no puede abortar antes de notificar: run_steps()
      # itera sobre una lista vacía y cae directo en run_actions(). Las acciones
      # sí están aisladas entre sí — run_action() (workflow.py:129) captura
      # Exception, la registra y run_actions() continúa con la siguiente.
      #
      # NO vuelvas a meter aquí un `step:` "que no falla nunca". No existe tal
      # cosa en 0.52.1.
      # ---------------------------------------------------------------------
      - id: notify-incident-critical
        name: Telegram — incidentes críticos
        description: >-
          Aviso urgente al chat principal, con resumen del LLM local. Reemplaza
          la lane emergency-telegram del VMAlertmanagerConfig.
        triggers:
          - type: incident
            events: [created]
            cel: severity == "critical"
        actions:
          - name: telegram-critical
            # Ver el comentario del trigger: `cel` no filtra en incidentes, `if` si.
            if: "'{{ incident.severity }}' == 'critical'"
            # REINTENTO ANTE EL RATE LIMIT DE TELEGRAM (fallo del 2026-08-05,
            # incidente GPT-1372): la API contestó "Flood control exceeded.
            # Retry in 10 seconds" y el mensaje se descartó sin más. El provider
            # de Telegram de Keep no reintenta nada — _notify llama a
            # send_message y deja subir la excepción (telegram_provider.py). El
            # reintento lo pone Keep a nivel de step/acción: step.py:337-371
            # hace range(count+1) intentos durmiendo `interval` entre ellos, o
            # sea 4 envíos como mucho. 15 s cubre de sobra los "Retry in 10".
            on-failure:
              retry:
                count: 3
                interval: 15
            provider:
              type: telegram
              config: "{{ providers.telegram_ops }}"
              with:
                chat_id: "-1003785136626"
                parse_mode: html
                message: |
                  🔴 <b>{{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}</b>
                  {{ incident.alerts_count }} alertas · {{ incident.services }}
                  https://keep.lan.e-dani.com/incidents/{{ incident.id }}

      - id: notify-incident
        name: Telegram — incidentes al tema alertas
        description: >-
          Resto de incidentes al tema 34494 del grupo Synapse, donde publicaba
          el ops-explainer. Un mensaje por incidente, no por alerta.
        triggers:
          - type: incident
            events: [created]
            cel: severity != "critical"
        actions:
          - name: telegram-incident
            # Complementario del anterior: sin esto ambos workflows notifican todo.
            if: "'{{ incident.severity }}' != 'critical'"
            # Mismo reintento que en la lane crítica; ver allí el porqué.
            on-failure:
              retry:
                count: 3
                interval: 15
            provider:
              type: telegram
              config: "{{ providers.telegram_ops }}"
              with:
                chat_id: "-1003785136626"
                # `topic_id`, NO `message_thread_id`. Esto estuvo mal desde el
                # cutover: el _notify del provider de telegram declara `topic_id`
                # (telegram_provider.py:55-64) y cualquier otro nombre cae en
                # **kwargs y se DESCARTA sin error. Consecuencia medida el
                # 2026-08-05 leyendo el grupo: los mensajes de incidente salían
                # con topicId=null, o sea al grupo general, no al tema 34494 donde
                # publicaba el ops-explainer. Se detectó al comparar contra el
                # workflow aurora-report-back, que sí usa topic_id y sí aparece
                # dentro del tema.
                topic_id: 34494
                parse_mode: html
                message: |
                  ⚠️ <b>{{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}</b>
                  {{ incident.alerts_count }} alertas · {{ incident.services }}
                  https://keep.lan.e-dani.com/incidents/{{ incident.id }}

      # ---------------------------------------------------------------------
      # EL RESUMEN, AISLADO. Este workflow SÍ puede abortar — ése es justamente
      # el sentido de haberlo separado. Si LiteLLM está caído o rota de alias,
      # `llm-summary` revienta, esta ejecución queda en `error` y no sale el
      # segundo mensaje; el aviso del incidente ya salió por su cuenta, porque
      # su workflow no tiene steps que puedan tumbarlo. El fallo sigue siendo
      # visible en el panel de Grafana `keep-hub`, que grafica ejecuciones por
      # estado, así que no se pierde en silencio.
      #
      # Sin `cel` en el trigger a propósito: cubre críticos y no críticos, y son
      # las dos acciones las que enrutan por severidad, igual que arriba. Las
      # acciones están aisladas entre sí, así que un fallo de una no impide la
      # otra (que de todas formas no aplicaría por el `if`).
      #
      # SIN parse_mode, A PROPÓSITO. El cuerpo lo escribe un LLM y con
      # `parse_mode: html` Telegram devuelve 400 ante cualquier `<`, `>` o `&`
      # suelto: el provider no escapa nada y la plantilla mustache tampoco. Ésa
      # es la razón de que aurora-report-back escape en SQL, truco que aquí no
      # sirve porque el texto no sale de una consulta. En texto plano no hay
      # nada que parsear y el 400 no puede ocurrir. Telegram autoenlaza la URL
      # igualmente.
      #
      # `model: tooling-ha` y no `router`: tooling-ha lleva cadena de fallback
      # (tooling → dense → qwen3-coder) por el hook `litellm_strip_params` del
      # repo k8s-litellm-pocharlies, así que sobrevive a las rotaciones del
      # backend-sync que provocaron los 34 errores de conexión. OJO: tooling-ha
      # NO aparece en /v1/models y aun así responde 200 — comprobado el
      # 2026-08-05 desde este mismo pod con la key del provider `llm`. No lo
      # quites porque "no está en la lista".
      # ---------------------------------------------------------------------
      - id: incident-summary
        name: Telegram — resumen LLM del incidente
        description: >-
          Segundo mensaje con el resumen del LLM local. Va aparte del aviso a
          propósito: si el LLM falla se pierde el resumen, nunca el aviso.
        triggers:
          - type: incident
            events: [created]
        steps:
          - name: llm-summary
            # Los 400 por alias rotado no los arregla un reintento inmediato,
            # pero los de conexión (los más numerosos) sí caen dentro de una
            # ventana corta. Dos reintentos y a otra cosa: este workflow puede
            # fallar sin consecuencias, no merece bloquear un hilo más tiempo.
            on-failure:
              retry:
                count: 2
                interval: 10
            provider:
              type: litellm
              config: "{{ providers.llm }}"
              with:
                model: tooling-ha
                temperature: 0.1
                max_tokens: 400
                prompt: |
                  Eres un SRE veterano. En 2-3 frases y en español, di qué está
                  pasando y qué mirar primero. No inventes causas: si los datos
                  no bastan, dilo y señala qué haría falta.

                  Incidente: {{ incident.user_generated_name }}
                  Severidad: {{ incident.severity }}
                  Alertas: {{ incident.alerts_count }}
                  Servicios: {{ incident.services }}
                  Regla de correlación: {{ incident.rule_name }}
        actions:
          - name: summary-critical
            if: "'{{ incident.severity }}' == 'critical'"
            on-failure:
              retry:
                count: 3
                interval: 15
            provider:
              type: telegram
              config: "{{ providers.telegram_ops }}"
              with:
                chat_id: "-1003785136626"
                message: |
                  🧠 Resumen — {{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}

                  {{ steps.llm-summary.results.response }}

                  https://keep.lan.e-dani.com/incidents/{{ incident.id }}

          - name: summary-incident
            if: "'{{ incident.severity }}' != 'critical'"
            on-failure:
              retry:
                count: 3
                interval: 15
            provider:
              type: telegram
              config: "{{ providers.telegram_ops }}"
              with:
                chat_id: "-1003785136626"
                # `topic_id`, NO `message_thread_id`. Ver el comentario de
                # telegram-incident: cualquier otro nombre cae en **kwargs y se
                # descarta sin error, y el mensaje acaba en el grupo general.
                topic_id: 34494
                message: |
                  🧠 Resumen — {{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}

                  {{ steps.llm-summary.results.response }}

                  https://keep.lan.e-dani.com/incidents/{{ incident.id }}

      # ---------------------------------------------------------------------
      # LA VUELTA DEL BUCLE: el análisis de Aurora regresa al grupo.
      #
      # Hasta ahora la cadena era de ida solamente — Keep notificaba y despachaba
      # a Aurora, y el RCA se quedaba en la UI de Aurora, donde nadie lo miraba.
      #
      # POR QUÉ SQL Y NO LA API DE AURORA. Su API exige DOS cabeceras:
      # `X-Internal-Secret` (main_compute.py:254) y `X-User-ID`
      # (stateless_auth.py:108, que se confía verbatim). El provider `webhook` de
      # Keep sólo admite `url` en authentication; las cabeceras se pasan en el
      # `with:`, o sea en ESTE fichero, o sea en git. No se mete ahí el secreto
      # interno de Aurora. Por SQL las credenciales viven en el ExternalSecret.
      #
      # POR QUÉ EL set_config. Las tablas de Aurora tienen RLS *forzada*
      # (relforcerowsecurity=true, así que ni el owner se la salta) con la política
      # `select_by_org`, que compara org_id contra current_setting('myapp.current_org_id').
      # Sin fijarlo, un SELECT devuelve CERO filas sin error ninguno — silencio, no
      # fallo. Se fija con una subconsulta a `organizations`, que NO tiene RLS, para
      # no hardcodear ningún id aquí. Van las dos sentencias en un solo `query`
      # porque psycopg2 las ejecuta ambas y `fetchall()` devuelve el último
      # resultado, que es el SELECT.
      #
      # POR QUÉ EL ESCAPADO VA EN SQL. parse_mode HTML hace que Telegram rechace
      # con 400 cualquier mensaje con `<`, `>` o `&` sueltos, y el resumen lo
      # escribe un LLM: antes o después mete uno. Escapar en SQL es la única capa
      # que lo garantiza — el provider no escapa nada y la plantilla mustache
      # tampoco.
      #
      # IDEMPOTENCIA POR MARCA, no por ventana temporal (corregido 2026-08-05).
      #
      # Antes esto filtraba por `analyzed_at > now() - 6 minutes` con intervalo de
      # 5. Funcionaba mientras los RCA duraban ~45 s. En cuanto Aurora empezó a
      # investigar de verdad —el kubectl-agent pasó de 0 comandos a 79 en una
      # hora— un RCA pasó a tardar 1634 s, o sea 27 minutos: MUCHO fuera de la
      # ventana. Esos análisis se perdían en silencio, que es el peor fallo
      # posible aquí porque no deja rastro. Ensanchar la ventana no vale: para
      # cubrir 27 min habría que ponerla en ~30, y entonces cada pasada de 5 min
      # reenviaría el mismo análisis seis veces.
      #
      # La marca vive en `keep_bridge.reported`, un esquema APARTE dentro de la
      # BBDD de Aurora. Aparte a propósito: Aurora es de un tercero y sus
      # migraciones no deben chocar con esto. Y dentro de SU base de datos, no de
      # la de Keep, porque sólo así el join cabe en una consulta — son dos bases
      # distintas del mismo clúster y no hay dblink.
      #
      # El reclamo es ATÓMICO: el CTE hace INSERT ... ON CONFLICT DO NOTHING
      # RETURNING, así que sólo salen las filas que ESTA pasada ha conseguido
      # marcar. Dos ejecuciones simultáneas no pueden publicar el mismo análisis.
      #
      # Contrapartida asumida: es at-most-once. Si Telegram falla DESPUÉS del
      # reclamo, ese análisis no se reintenta. Se acepta porque el fallo queda
      # registrado como ejecución errónea del workflow —visible en el panel de
      # Grafana `keep-hub`, que grafica ejecuciones por estado— mientras que un
      # duplicado no avisa de nada. La ventana de 24 h del reclamo es el margen
      # para RCA lentos, no un filtro de frescura.
      # ---------------------------------------------------------------------
      - id: aurora-report-back
        name: Aurora — análisis de vuelta al grupo
        description: >-
          Cada 5 minutos busca RCA que Aurora haya terminado y publica su análisis
          en el grupo, citando el incidente de Keep que lo originó.
        triggers:
          - type: interval
            value: 300
        steps:
          - name: finished-rcas
            provider:
              type: postgres
              config: "{{ providers.aurora_db }}"
              with:
                query: >-
                  SELECT set_config('myapp.current_org_id',
                                    (SELECT id::text FROM organizations
                                      ORDER BY created_at LIMIT 1), false);
                  WITH reclamados AS (
                    INSERT INTO keep_bridge.reported (fingerprint)
                    SELECT alert_metadata->>'fingerprint'
                      FROM incidents
                     WHERE aurora_status = 'complete'
                       AND aurora_summary IS NOT NULL
                       AND alert_metadata->>'fingerprint' IS NOT NULL
                       AND analyzed_at > now() - interval '24 hours'
                    ON CONFLICT (fingerprint) DO NOTHING
                    RETURNING fingerprint
                  )
                  SELECT r.fingerprint,
                         replace(replace(replace(coalesce(i.alert_title,'sin título'),
                                 '&','&amp;'),'<','&lt;'),'>','&gt;'),
                         left(replace(replace(replace(i.aurora_summary,
                                 '&','&amp;'),'<','&lt;'),'>','&gt;'), 2800),
                         i.severity
                    FROM reclamados r
                    JOIN incidents i
                      ON i.alert_metadata->>'fingerprint' = r.fingerprint
                   ORDER BY i.analyzed_at
        actions:
          - name: telegram-rca
            # `foreach` sólo entiende rutas con puntos (step.py:110-111), y el
            # elemento actual es una TUPLA de psycopg2 — el provider usa
            # conn.cursor() plano, no RealDictCursor. Se indexa con
            # {{ foreach.value.N }}: la notación con corchetes devuelve cadena
            # vacía en silencio, comprobado contra el IOHandler real.
            foreach: "{{ steps.finished-rcas.results }}"
            provider:
              type: telegram
              config: "{{ providers.telegram_ops }}"
              with:
                chat_id: "-1003785136626"
                # `topic_id`, NO `message_thread_id`: el _notify del provider
                # declara topic_id, y cualquier otro nombre cae en **kwargs y se
                # descarta sin avisar.
                topic_id: 34494
                parse_mode: html
                message: |
                  🔍 <b>Aurora — análisis de {{ foreach.value.1 }}</b>

                  {{ foreach.value.2 }}

                  Severidad: {{ foreach.value.3 }}
                  Incidente en Keep: https://keep.lan.e-dani.com/incidents/{{ foreach.value.0 }}

      # Aurora investiga INCIDENTES, no alertas: mandarle cada alerta haría que
      # investigase 3 veces la misma causa. El payload va con forma de
      # Alertmanager porque su endpoint la consume nativamente
      # (grafana_routes.py:99 lee alerts[], status, commonLabels).
      #
      # El user_id sale de un ExternalSecret (aurorasvc-user-id) y no está
      # hardcodeado: no existe hasta que se registra el primer usuario en la UI
      # de Aurora. Hasta entonces este workflow falla, y es el fallo correcto —
      # ruidoso y localizado, no un silencio.
      - id: aurora-investigate
        name: Investigación en Aurora
        description: >-
          Manda cada incidente nuevo a Aurora, que lanza agentes read-only sobre
          el clúster y produce un RCA.
        triggers:
          - type: incident
            events: [created]
        actions:
          - name: dispatch-rca
            provider:
              type: webhook
              config: "{{ providers.aurora }}"
              with:
                body:
                  status: firing
                  title: "{{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}"
                  ruleName: "{{ incident.rule_name }}"
                  commonLabels:
                    severity: "{{ incident.severity }}"
                    incident_id: "{{ incident.id }}"
                  commonAnnotations:
                    summary: "{{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}"
                    keep_url: "https://keep.lan.e-dani.com/incidents/{{ incident.id }}"
                  # SIN este array Aurora guarda la alerta y NO abre incidente:
                  # tasks.py:227 hace `if not payload.get("alerts"): return` — un
                  # descarte deliberado, porque las notificaciones de prueba de
                  # Grafana llegan con `alerts: []`. El log lo dice tal cual:
                  # "No alerts array in payload ... skipping incident creation".
                  #
                  # No se puede volcar `incident.alerts` directamente: las
                  # plantillas de Keep no tienen filtros (`| tojson` no existe) y
                  # renderizarían el repr de Python. Se construye un elemento con
                  # los campos que Aurora lee de cada alerta (tasks.py:231-243):
                  # `fingerprint`, que es su clave para casar el resolved con el
                  # firing, y `startsAt`, con el que mide el MTTD por incidente.
                  #
                  # Para incidentes SYNF el detalle (last_error, instance_id)
                  # viaja por el ledger SRE de synapse, no por aquí: Keep no
                  # puede serializar incident.alerts en sus plantillas.
                  # Comprobado en vivo contra Keep 0.52.1: no existe un campo
                  # agregado `incident.alerts_description` — `alerts` es una
                  # property que devuelve List[AlertDto] vía query a DB
                  # (api/models/incident.py:139) y chevron la renderiza como
                  # repr de Python, igual que arriba.
                  alerts:
                    - status: firing
                      fingerprint: "{{ incident.id }}"
                      startsAt: "{{ incident.start_time }}"
                      labels:
                        alertname: "{{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}"
                        severity: "{{ incident.severity }}"
                        incident_id: "{{ incident.id }}"
                      annotations:
                        summary: "{{#fn.na}}{{ incident.user_generated_name }}{{/fn.na}}"
                        description: "{{ incident.alerts_count }} alertas correlacionadas por la regla {{ incident.rule_name }}"
                        keep_url: "https://keep.lan.e-dani.com/incidents/{{ incident.id }}"

      # Guardián de invariante: hace que una severidad fuera del vocabulario
      # canónico sea CONSULTABLE en vez de invisible. Enriquece y punto — no
      # notifica, porque con el reenvío cada minuto un aviso por alerta sería
      # spam. Se revisa filtrando por `severity_drift` en la UI, o regenerando
      # docs/alert-routing-matrix.md.
      - id: severity-drift-guard
        name: Guardián — severidad no canónica
        description: >-
          Marca las alertas cuya severidad Keep no sabe mapear (y que por tanto
          ha ingerido como `info`). Sin esta marca, una VMRule nueva con
          `severity: warn` volvería a colarse en silencio.
        triggers:
          - type: alert
            only_on_change: [status]
            cel: >-
              labels.severity != "" &&
              !(labels.severity in ["critical", "warning", "info", "high", "low", "error", "medium"])
        actions:
          - name: mark-drift
            provider:
              type: mock
              with:
                enrich_alert:
                  - key: severity_drift
                    value: "{{ alert.labels.severity }}"

  env:
    # URL pública del backend, la que el navegador usa. Con el ingress del chart
    # desactivado hay que fijarla: los helpers caerían a /backend.
    - name: KEEP_API_URL
      value: https://keep-api.lan.e-dani.com
    - name: PORT
      value: "8080"
    # Los secretos de providers se guardan como Secrets de k8s en este namespace
    # (el chart crea Role + RoleBinding). Evita depender de Vault en runtime.
    - name: SECRET_MANAGER_TYPE
      value: k8s
    - name: PUSHER_DISABLED
      value: "true"
    - name: PROMETHEUS_MULTIPROC_DIR
      value: /tmp/prometheus

    # --- IA nativa de Keep contra el router local ---
    # El SDK de OpenAI se construye desnudo en el código de Keep
    # (ai_suggestion_bl.py: `OpenAI()`), así que coge base_url y api_key del
    # entorno. La propia doc de Keep documenta OPENAI_BASE_URL como "useful for
    # LiteLLM proxy". El `/v1` es la ruta canónica.
    #
    # Esto NO llena incident.generated_summary (es EE y su código fue borrado del
    # repo público): enciende el chat de incidente y el informe, que hoy estaban
    # muertos. El resumen de las notificaciones lo hace el step `llm-summary`.
    - name: OPENAI_BASE_URL
      value: http://litellm.litellm.svc.cluster.local:4000/v1
    - name: OPENAI_MODEL_NAME
      value: router

    # --- Identidad: headers del oauth2-proxy compartido ---
    # OJO: si el header de roles llega vacío, Keep devuelve 401 en TODA petición
    # (oauth2proxy_authverifier.py). sso-chain lo puebla porque el cliente
    # Keycloak emite el claim `groups` y el proxy tiene set_xauthrequest = true.
    - name: AUTH_TYPE
      value: OAUTH2PROXY
    - name: KEEP_OAUTH2_PROXY_USER_HEADER
      value: x-auth-request-email
    - name: KEEP_OAUTH2_PROXY_ROLE_HEADER
      value: x-auth-request-groups
    - name: KEEP_OAUTH2_PROXY_AUTO_CREATE_USER
      value: "true"
    - name: KEEP_OAUTH2_PROXY_ADMIN_ROLES
      value: "/edani-admins"
    - name: KEEP_OAUTH2_PROXY_NOC_ROLES
      value: "/edani-operators"

    # --- Pool de Postgres ---
    # Incidente de saturación del 28-07-2026: postgres-shared llegó a 367/400
    # conexiones y keep era el segundo consumidor con 64 (2 pods), de las que 21
    # estaban `idle in transaction`, la más antigua de 17h18m.
    #
    # Dos problemas distintos:
    #
    # 1) Techo del pool. El backend arranca 5 procesos por pod (4 workers de
    #    gunicorn + server_jobs_bg.py) y cada uno crea su propio engine con los
    #    defaults de db_utils.py — pool_size 5 + max_overflow 10 = 15. Son 75
    #    conexiones por pod y 150 en total para una carga que rara vez tiene una
    #    query activa. Con 2 + 3 el techo baja a 25/pod y 50 en el rolling.
    #
    # 2) Fuga de transacciones. En keep/api/core/db.py::enrich_alert el upstream
    #    hace `session.refresh(enrichment)` DESPUÉS de `session.commit()`: el
    #    refresh abre una transacción nueva para releer la fila y la función
    #    retorna sin commit ni rollback. La sesión la inyecta el llamante, así
    #    que la conexión se queda idle in transaction para siempre y su xmin
    #    bloquea el vacuum de la base `keep`. Es un bug del chart 0.1.96, no
    #    nuestro; el corte está en el servidor, vía
    #    `ALTER ROLE keep SET idle_in_transaction_session_timeout='5min'`
    #    (k8s-infra-pocharlies/databases/postgres-shared/role-settings.yaml).
    #
    # pre-ping es obligatorio para (2): sin él, la primera reutilización de una
    # conexión que el servidor ya cortó explota en la aplicación en vez de
    # reponerse de forma transparente. Cuesta un SELECT 1 por checkout.
    - name: DATABASE_POOL_SIZE
      value: "2"
    - name: DATABASE_MAX_OVERFLOW
      value: "3"
    - name: KEEP_DB_PRE_PING_ENABLED
      value: "true"

  # KEEP_DEFAULT_API_KEYS (la que usa Alertmanager) y KEEP_PROVIDERS.
  envFromSecrets:
    - name: keepsvc-provisioning

  image:
    repository: us-central1-docker.pkg.dev/keephq/keep/keep-api
    pullPolicy: IfNotPresent

  # Consolidado en sauvage. El taint del nodo es `role=edge:NoSchedule`, así que
  # el nodeSelector SOLO no basta: sin el toleration el pod se queda Pending.
  nodeSelector:
    kubernetes.io/hostname: sauvage
  tolerations:
    - key: role
      operator: Equal
      value: edge
      effect: NoSchedule

  # startupProbe, y sin ella el traslado a sauvage NO funciona.
  #
  # Los defaults del chart para liveness son initialDelaySeconds 60 +
  # failureThreshold 5 × periodSeconds 10 = el contenedor muere a los ~110s si
  # no responde /healthcheck. En los nodos ks5 arrancaba justo por debajo; en
  # sauvage no. Medido en el pod real durante el traslado:
  #
  #   12:08:31  Starting background server jobs / Building providers cache
  #   12:10:04  Providers cache built successfully      <- 93s SOLO en esto
  #             ...y el API aún tenía que levantar
  #
  # Resultado: liveness mataba el contenedor antes de que la API existiera,
  # reinicio, y vuelta a empezar — 6 reinicios en bucle, Keep caído. No es
  # lentitud anómala de sauvage: son 158 pods y disco más lento, y Keep importa
  # el catálogo entero de providers al arrancar.
  #
  # La primitiva correcta es startupProbe, no subir el initialDelay de liveness:
  # mientras startupProbe no pase, liveness y readiness quedan DESACTIVADAS, y
  # en cuanto pasa, liveness recupera su sensibilidad normal. Subir el
  # initialDelay habría hecho al pod insensible a cuelgues para siempre.
  #
  # 10 minutos de margen (60 × 10s) con la vista puesta en el caso peor: nodo
  # frío, imagen recién bajada y CPU disputada.
  #
  # La plantilla hace `toYaml` del mapa `probes` entero
  # (templates/backend.yaml:166), así que acepta esta clave aunque el chart no
  # la documente; readinessProbe y livenessProbe siguen viniendo de sus defaults.
  healthCheck:
    probes:
      startupProbe:
        httpGet:
          path: /healthcheck
          port: 8080
        periodSeconds: 10
        failureThreshold: 60
        successThreshold: 1

  # Ya NO hay topologySpreadConstraints, y conviene saber por qué estuvo aquí.
  #
  # Existía para repartir 2 réplicas entre los 3 nodos del pool ks5-nvme, después
  # de que las dos alternativas fallaran de formas distintas:
  #   - `required` anti-affinity: el rollout entraba en DEADLOCK. Sólo 3 nodos
  #     llevaban node-pool=ks5-nvme, uno sin CPU libre, y con maxUnavailable=0 (el
  #     default de k8s para 2 réplicas) el pod de surge no tenía hueco y no se
  #     retiraba ninguno viejo. Estuvo 3h parado.
  #   - `preferred` anti-affinity: desbloquea, pero durante la transición apiló
  #     las 2 réplicas en el MISMO nodo y ahí se quedaron.
  #
  # Con 1 réplica fijada a un único nodo, repartir no significa nada: la
  # restricción quedaba inerte (ScheduleAnyway nunca bloquea, pero tampoco hace
  # nada). Se retira para que el fichero no describa una topología que ya no
  # existe. Si algún día vuelven las 2 réplicas a varios nodos, esto se restaura
  # tal cual — es la primitiva correcta, no un parche.

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

frontend:
  enabled: true
  replicaCount: 1

  env:
    # Los helpers del chart respetan estos valores si están puestos aquí.
    - name: API_URL
      value: http://keep-backend:8080          # server-side, in-cluster
    - name: API_URL_CLIENT
      value: https://keep-api.lan.e-dani.com   # el que resuelve el navegador
    - name: NEXTAUTH_URL
      value: https://keep.lan.e-dani.com
    - name: AUTH_TYPE
      value: OAUTH2PROXY
    - name: KEEP_OAUTH2_PROXY_USER_HEADER
      value: x-auth-request-email
    - name: KEEP_OAUTH2_PROXY_ROLE_HEADER
      value: x-auth-request-groups
    - name: PUSHER_DISABLED
      value: "true"
    # Los defaults del chart son de desarrollo.
    - name: ENV
      value: production
    - name: NODE_ENV
      value: production
    - name: VERCEL
      value: "1"
    - name: HOSTNAME
      value: 0.0.0.0
    - name: FRIGADE_DISABLED
      value: "true"
    # Mismo razonamiento que en el backend. La key va por envFromSecrets con LAS
    # DOS grafías (OPENAI_API_KEY y OPEN_AI_API_KEY): copilotkit lee la del guion
    # bajo, los gates de UI la otra.
    - name: OPENAI_BASE_URL
      value: http://litellm.litellm.svc.cluster.local:4000/v1
    - name: OPENAI_MODEL_NAME
      value: router

  # NEXTAUTH_SECRET: frontend.env sólo admite valores literales (el template no
  # soporta secretKeyRef), así que entra por aquí.
  envFromSecrets:
    - name: keepsvc-frontend-auth

  image:
    repository: us-central1-docker.pkg.dev/keephq/keep/keep-ui
    pullPolicy: IfNotPresent

  # Junto al backend, en sauvage. Mismo taint, mismo toleration.
  nodeSelector:
    kubernetes.io/hostname: sauvage
  tolerations:
    - key: role
      operator: Equal
      value: edge
      effect: NoSchedule

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
