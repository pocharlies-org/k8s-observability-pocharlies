# Reglas de correlación de Keep: alertas -> incidentes.
#
# ESTE FICHERO ES EL CRITERIO DE NOTIFICACIÓN DEL CLÚSTER.
#
# Los workflows notifican sobre incidentes, no sobre alertas (keep/values.yaml).
# Una alerta que no encaje en ninguna regla queda registrada en Keep y CALLADA.
# Es el sentido inverso al árbol de rutas anterior, donde el default era descartar
# y había que acordarse de listar lo que querías ver: aquí el default es registrar,
# y una regla es lo que convierte un patrón en algo que suena.
#
# Dos capas:
#
#   con regla  -> regla de dominio -> incidente -> Request (ops-watch)
#   sin regla  -> sólo registro auditable en Keep
#
# No hay capa «crónica» (INFRA-882, 16-10): una alerta que suena siempre es algo
# roto (su incidente queda acknowledged con el ticket que lo arregla) o una regla
# mala (se corrige o se borra). La lista `chronic` tapaba alertas reales: el
# 16-10 el gmail de Synapse estuvo 3 h sin consumidor con su alerta disparada.
#
# ---------------------------------------------------------------------------
# INVARIANTE 1 — la exclusión del safety-net delega, no silencia
#
# `critical-safety-net` recoge cualquier crítica que NO caiga en una regla de
# dominio, para que ninguna pueda quedarse muda. Su lista de exclusión existe
# para evitar incidentes duplicados, así que:
#
#     todo prefijo o nombre excluido del safety-net TIENE que tener su
#     propia regla más abajo.
#
# Si excluyes algo sin darle regla, lo has silenciado. Si le das regla y olvidas
# excluirlo, se notifica dos veces — molesto, no peligroso: ése es el lado
# correcto por el que fallar. Keep no tiene prioridades entre reglas.
#
# Verificar tras cada cambio:
#     scripts/verify-notification-coverage.py
# falla si alguna serie que notifica hoy se quedaría muda.
# ---------------------------------------------------------------------------
#
# Las reglas no se pueden provisionar con el chart (sólo providers, workflows,
# dashboards y mapping rules), así que las aplica keep/rules/apply-job.yaml
# contra POST/PUT /rules. El motor evalúa `celQuery` con celpy
# (rulesengine.py:97); `sqlQuery` se almacena pero no se usa para hacer match —
# la UI lo regenera al editar, por eso aquí va una traducción mínima.
#
# CEL disponible: name, severity (el normalizado por Keep), labels.<etiqueta>
# (el valor crudo de Prometheus), annotations.<x>, source.
#
# OJO con severity: Keep manda a `info` toda severidad fuera de su
# SEVERITIES_MAP, así que `page` y `warn` llegan como info. Por eso la cobertura
# la da el NOMBRE y no la severidad — y por eso las 9 alertas `page`, que hoy no
# llegan a Telegram, empiezan a hacerlo.

rules:
  # ---------------------------------------------------------------------------
  # COBERTURA DE HUÉRFANAS (2026-08-04)
  #
  # Estas 16 familias llegaban a Keep, se ingerían bien y no casaban con NINGUNA
  # regla: 0 incidentes, 0 Telegram, 0 Aurora. Medido sobre 9 días de tráfico
  # real con un LEFT JOIN de alert contra lastalerttoincident. La más sangrante
  # era KubePodCrashLooping con 158 eventos — un pod en crashloop no avisaba a
  # nadie — y LitellmNotReady, que es la pasarela de la que dependen los resúmenes
  # de Keep y los RCA de Aurora.
  #
  # No se tocan las que deben seguir calladas: InfoInhibitor (4073) y Watchdog son
  # fontanería de Alertmanager, y CPUThrottlingHigh (1181, info) es ruido crónico.
  # ---------------------------------------------------------------------------
  - ruleName: workload-degraded
    incidentPrefix: WORK
    celQuery: |
      name in ["KubePodCrashLooping", "KubeDeploymentRolloutStuck",
               "KubeDaemonSetRolloutStuck", "KubernetesDaemonSetUnavailable",
               "KubePersistentVolumeFillingUp"]
    sqlQuery: {"sql": "((name in (:name_1, :name_2, :name_3, :name_4, :name_5)))", "params": {"name_1": "KubePodCrashLooping", "name_2": "KubeDeploymentRolloutStuck", "name_3": "KubeDaemonSetRolloutStuck", "name_4": "KubernetesDaemonSetUnavailable", "name_5": "KubePersistentVolumeFillingUp"}}
    groupingCriteria: [namespace]
    createOn: any
    resolveOn: all_resolved
    timeframeInSeconds: 900
    timeUnit: minutes
    incidentNameTemplate: "Workloads degradados en {{ namespace }}"
    groupDescription: >-
      Pods en crashloop, rollouts atascados y volúmenes llenándose. Se agrupa por
      namespace porque un nodo o un despliegue malo tumba varios a la vez y son
      el mismo incidente, no cinco.

  - ruleName: llm-plane
    incidentPrefix: LLM
    celQuery: |
      name in ["LitellmNotReady", "GpuArbiterStateObservationUnavailable"]
    sqlQuery: {"sql": "((name in (:name_1, :name_2)))", "params": {"name_1": "LitellmNotReady", "name_2": "GpuArbiterStateObservationUnavailable"}}
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    timeframeInSeconds: 900
    timeUnit: minutes
    incidentNameTemplate: "Plano LLM degradado"
    groupDescription: >-
      La pasarela LiteLLM y el arbitraje de GPU. Es infraestructura de la que
      dependen los resúmenes de Keep y los RCA de Aurora: si cae, las
      alertas siguen llegando pero llegan sin contexto.

  - ruleName: imagestudio-degraded
    incidentPrefix: IMG
    celQuery: |
      name in ["ImageStudioWorkerDown", "ImageStudioErrorRateHigh",
               "Krea2TrainerWorkerDown"]
    sqlQuery: {"sql": "((name in (:name_1, :name_2, :name_3)))", "params": {"name_1": "ImageStudioWorkerDown", "name_2": "ImageStudioErrorRateHigh", "name_3": "Krea2TrainerWorkerDown"}}
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    timeframeInSeconds: 900
    timeUnit: minutes
    incidentNameTemplate: "Image Studio degradado"
    groupDescription: >-
      Workers y tasa de error del dominio de generación de imagen, incluido el
      entrenador de Krea. Van juntos porque comparten cola y GPU.

  - ruleName: datastore-shared
    incidentPrefix: PGSH
    celQuery: name in ["PostgresSharedBackendsWaiting"]
    sqlQuery: {"sql": "((name in (:name_1)))", "params": {"name_1": "PostgresSharedBackendsWaiting"}}
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    timeframeInSeconds: 900
    timeUnit: minutes
    incidentNameTemplate: "Postgres compartido saturado"
    groupDescription: >-
      Backends esperando en el CNPG compartido. Lo usan Synapse, Keep, Aurora y
      la tienda: la saturación aquí se manifiesta como lentitud en todo lo demás.

  - ruleName: k8s-control-plane
    incidentPrefix: K8S
    celQuery: name in ["KubeAggregatedAPIDown", "ReconcileErrors", "RecordingRulesError"]
    sqlQuery: {"sql": "((name in (:name_1, :name_2, :name_3)))", "params": {"name_1": "KubeAggregatedAPIDown", "name_2": "ReconcileErrors", "name_3": "RecordingRulesError"}}
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    timeframeInSeconds: 900
    timeUnit: minutes
    incidentNameTemplate: "Plano de control de Kubernetes degradado"
    groupDescription: >-
      API agregada caída, errores de reconciliación y reglas de grabación
      fallando. OJO: `RecordingRulesError` NO estaba en monitoring-degraded, que
      lista `RecordingRulesNoData` — otro nombre. Se cubre aquí.

  - ruleName: openclaw-degraded
    incidentPrefix: OCLW
    celQuery: name.startsWith("OpenClaw")
    sqlQuery: {"sql": "((name like :name_1))", "params": {"name_1": "OpenClaw%"}}
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    timeframeInSeconds: 900
    timeUnit: minutes
    incidentNameTemplate: "OpenClaw degradado"
    groupDescription: >-
      Router de Telegram de OpenClaw pausado y demás alertas del dominio.

  # =========================================================================
  # RED DE SEGURIDAD
  # =========================================================================
  # LitellmNotReady esta excluida de la red (ultimo nombre de la lista) porque SI
  # tiene regla de dominio: llm-plane — INVARIANTE 1. Mientras vivio en las dos,
  # cada alerta de litellm montaba ADEMAS un meta-incidente inatribuible: su expr
  # agrega (min by / sum by) y suelta el label namespace, asi que el
  # groupingCriteria [namespace] de la red caia en N/A y salia «Critico en N/A»
  # sin servicio ni payload propio — CRIT-7501/7507/7509/7528/7536/7539 eran todos
  # el mismo LitellmNotReady duplicando su «Plano LLM degradado» de llm-plane.
  # La cobertura la sigue dando llm-plane (ver verify-notification-coverage.py).
  # INFRA-1031: ScrapePathGap y VmagentRemoteWriteFailing tienen regla propia
  # (camino-de-scrape, más abajo) y se excluyen aquí para no abrir dos incidentes.
  - ruleName: critical-safety-net
    celQuery: >-
      (severity == "critical" || labels.severity == "page") && !(
        name.startsWith("LibrePlay") || name.startsWith("TrackingIngestion") ||
        name == "TrackingPage404Spike" || name.startsWith("Labels") ||
        name.startsWith("LabelGeneration") || name.startsWith("MCP") ||
        name.startsWith("OVHPVCHub") || name.startsWith("Sii") ||
        name.startsWith("Synapse") ||
        name.startsWith("Rabbitmq") || name.startsWith("Keep") ||
        name.startsWith("Alertmanager") || name.startsWith("SharedValkey") ||
        name.startsWith("SharedDatastore") || name.startsWith("KubeNode") ||
        name.startsWith("Node") ||
        name in ["KubernetesDeploymentUnavailable", "KubeDeploymentReplicasMismatch",
                 "KubePodNotReady", "KubeContainerWaiting",
                 "KubeStatefulSetReplicasMismatch", "KubernetesStatefulSetUnavailable",
                 "KubeletInstanceUnreachable", "TargetDown", "BlackboxProbeDown",
                 "ScrapePoolHasNoTargets", "TooManyScrapeErrors", "AlertingRulesError",
                 "TooManyLogs", "LitellmNotReady", "AtlassianMcpToolDown",
                 "ScrapePathGap", "VmagentRemoteWriteFailing"]
      )
    sqlQuery:
      sql: "((severity = :severity_1))"
      params:
        severity_1: critical
    timeframeInSeconds: 600
    timeUnit: minutes
    groupingCriteria: [namespace]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: CRIT
    incidentNameTemplate: "Crítico en {{ namespace }} · {{ name }}"
    groupDescription: >-
      Cualquier crítica sin regla de dominio propia: UPS, AffiliateApp,
      Conversation*, WeightResolver, LlmResident, DiskRuns, SeriesLimit… Existe
      para que añadir una alerta nueva al clúster no obligue a acordarse de nada.

  # =========================================================================
  # KUBERNETES / INFRA
  # =========================================================================
  # El patrón que está pasando ahora mismo: control-nexus, comfyui y ltx tienen a
  # la vez KubernetesDeploymentUnavailable (critical), KubeDeploymentReplicas-
  # Mismatch, KubePodNotReady y KubeContainerWaiting. 4 síntomas de un deployment
  # que no levanta: 1 incidente por namespace, no 4 mensajes.
  - ruleName: deployment-degraded
    celQuery: >-
      name in ["KubernetesDeploymentUnavailable", "KubeDeploymentReplicasMismatch",
               "KubePodNotReady", "KubeContainerWaiting",
               "KubeStatefulSetReplicasMismatch", "KubernetesStatefulSetUnavailable",
               "KubePdbNotEnoughHealthyPods"]
    sqlQuery:
      sql: "((name in (:name_1, :name_2, :name_3, :name_4)))"
      params:
        name_1: KubernetesDeploymentUnavailable
        name_2: KubeDeploymentReplicasMismatch
        name_3: KubePodNotReady
        name_4: KubeContainerWaiting
    timeframeInSeconds: 900
    timeUnit: minutes
    groupingCriteria: [namespace]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: DEPL
    incidentNameTemplate: "Deployment degradado en {{ namespace }}"
    groupDescription: Síntomas de workload que no arranca, por namespace.

  # SIN agrupar por nodo, y no por gusto: estas alertas no traen etiqueta `node`.
  # Sólo hay `instance` (IP:puerto del pod de node-exporter) y `pod`, y las dos
  # cambian al recrearse el pod — agrupar por ellas crearía un incidente nuevo en
  # cada reinicio del exporter. El incidente sigue listando las alertas
  # afectadas: no se pierde información, sólo no cabe en el título. Para agrupar
  # por nodo de verdad hay que añadir una etiqueta `node` en el relabeling de
  # vmagent para el job node-exporter.
  - ruleName: node-degraded
    celQuery: >-
      name.startsWith("KubeNode") || name.startsWith("Node") ||
      name == "KubeletInstanceUnreachable"
    sqlQuery:
      sql: "((name like :name_1) or (name like :name_2))"
      params:
        name_1: KubeNode%
        name_2: Node%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: NODE
    incidentNameTemplate: "Nodos degradados"
    groupDescription: Presión de recursos y disponibilidad de kubelet.

  - ruleName: monitoring-degraded
    celQuery: >-
      name in ["TargetDown", "BlackboxProbeDown", "ScrapePoolHasNoTargets",
               "TooManyScrapeErrors", "AlertingRulesError", "TooManyLogs",
               "RecordingRulesNoData", "SeriesLimitHourReached",
               "SeriesLimitDayReached", "RemoteWriteDroppingData",
               "PersistentQueueIsDroppingData"]
    sqlQuery:
      sql: "((name in (:name_1, :name_2, :name_3)))"
      params:
        name_1: TargetDown
        name_2: BlackboxProbeDown
        name_3: ScrapePoolHasNoTargets
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: MON
    incidentNameTemplate: "Monitorización degradada"
    groupDescription: >-
      Scrape, probes, reglas y remote-write. Se trata aparte porque invalida la
      confianza en todo lo demás.

  # Salud del propio hub. Aparte de monitoring-degraded porque la respuesta es
  # distinta: si esto salta, el resto de Keep no es de fiar. No hay lane directa
  # que contrastar: INFRA-912 retiró backstop-telegram junto con las alertas
  # por Telegram, así que este dominio es la única vía de aviso del hub.
  - ruleName: keep-hub-degraded
    celQuery: 'name.startsWith("Keep") || name.startsWith("Alertmanager")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: Keep%
    timeframeInSeconds: 600
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: HUB
    incidentNameTemplate: "Hub de alertas degradado"
    groupDescription: Keep o Alertmanager en mal estado.

  # 29-09-2026: ArgoCD Notifications (k8s-gitops-pocharlies, argocd/values.yaml)
  # POSTea on-sync-failed / on-health-degraded a /alerts/event como alertas
  # `ArgoCD…` de severidad warning. Sin esta regla quedarían registradas y
  # calladas: con ella son incidente, Aurora las investiga y el RCA llega al
  # perfil sre-devops de Hermes (aurora-report-back). Una app = un incidente.
  - ruleName: argocd-app-degraded
    celQuery: 'name.startsWith("ArgoCD")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: ArgoCD%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: [app]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: ARGO
    incidentNameTemplate: "ArgoCD: {{ app }} con sync fallido o Degraded"
    groupDescription: >-
      Sync fallido o app Degraded en ArgoCD, por app.

  # =========================================================================
  # X86 — host fuera del clúster, empujado por ops-watch (INFRA-405 / P2)
  # =========================================================================
  # Mismo canal de ingesta directo que ArgoCD (POST /alerts/event, sin pasar
  # por Alertmanager ni por ninguna VMRule): el sensor vive en el x86 porque
  # necesita el host (`systemctl --user`, `gh`, attempts.jsonl). Las emite
  # `empujar_a_keep()` en libexec/ops-watch.py (x86-host-runtime-pocharlies),
  # con severidad `warning` y las claves de causa en la raíz y en `labels`,
  # como el formato ArgoCD.
  #
  # Severidad warning a propósito: `critical-safety-net` sólo captura
  # critical/page, así que no solapa ni hay que excluirlas de su lista
  # (INVARIANTE 1 respetada: no excluimos lo que no duplicamos), y el carril
  # de Aurora acepta warning (docs/keep-aurora-contract.md §6).
  #
  # El `incidentNameTemplate` es parte de la clave de causa de P4
  # (`keep-causa:<rule_name>:<sha1(nombre)>` en ops-watch): tiene que ser
  # estable y sin números volátiles — sólo la etiqueta de agrupación. Un
  # nombre que cambiase entre dos alertas de la misma causa abriría dos
  # Requests.
  #
  # Agrupadas SIEMPRE por su clave de causa y no vacías: con `on: [created]`
  # una alerta nueva que llegase a un incidente ya abierto entraría muda (la
  # píldora envenenada del encabezado). Una etiqueta de agrupación por
  # incidente hace que cada causa nueva abra el suyo.

  # Unit de systemd (usuario o sistema) en failed. `unit` es el nombre de la
  # unit (`hermes-gateway.service`); `scope` (usuario|sistema) viaja en la
  # alerta pero NO agrupa: la misma unit en el mismo scope es la misma causa
  # pase lo que pase. Una causa de host común (varias units de un mismo
  # servicio caído) da varios incidentes X86U y varias Requests; P4 las
  # colapsa por nombre si coinciden. Aceptado por el plan del architect.
  - ruleName: x86-unit-failed
    celQuery: 'name == "X86UnitFailed"'
    sqlQuery:
      sql: "((name = :name_1))"
      params:
        name_1: X86UnitFailed
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: [unit]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: X86U
    incidentNameTemplate: "x86: {{ unit }} fallida"
    groupDescription: >-
      Units de systemd del x86 en failed, por unit. El sensor es ops-watch
      (fuente `unidades`); el `resolved` lo emite la pasada que deja de verla.

  # INFRA-550 (P4 de INFRA-400): cola y runners de CI atascados. Las 5 alertas
  # de manifests/arc-rules.yaml (VMRule pocharlies-arc-ci) llegan como
  # `warning`/area=infra y SIN esta regla no creaban incidente: Keep solo
  # notifica incidentes (cabecera de este fichero), así que nunca habrían
  # llegado al topic Infra 1248. Por nombre y no por severity, como el resto.
  # Prefijo `CIQ` (tests/test_infra550_ci_queue_correlation.py evalúa cada
  # alerta contra TODAS las reglas).
  #
  # Agrupada por alertname, como cron-job-failed (INFRA-378): cada familia de
  # alerta abre su propio incidente ⇒ `created` ⇒ aviso. Con `on: [create]` una
  # alerta que se une a un incidente ya abierto no avisa, así que sin alertname
  # en los criterios un CIPoolSaturated disparado dejaría muda a una
  # CIQueueLabelWithoutPool posterior.
  - ruleName: ci-queue-degraded
    celQuery: >-
      name.startsWith("CIQueue") || name.startsWith("CIRunner") ||
      name == "CIPoolSaturated"
    sqlQuery:
      sql: "((name like :name_1) or (name like :name_2) or (name = :name_3))"
      params:
        name_1: CIQueue%
        name_2: CIRunner%
        name_3: CIPoolSaturated
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: [alertname]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: CIQ
    incidentNameTemplate: "Cola de CI: {{ alertname }}"
    groupDescription: >-
      Jobs de CI esperando más de 20 min, jobs con label sin pool de runners,
      runners ARC sin arrancar, pool saturado y el exporter de cola ciego
      (manifests/arc-rules.yaml). Fuente: gha_* del listener ARC y el exporter
      ci-queue-exporter (API de GitHub).

  # INFRA-712 (P2b de INFRA-701): vigilancia de casa. Las alertas de
  # manifests/frigate-rules.yaml (VMRule pocharlies-frigate: Frigate caído,
  # detector lento/en CPU, cámara sin frames, disco de frigate-media) llegan como
  # `warning` y SIN esta regla no creaban incidente: Keep solo notifica
  # incidentes (cabecera de este fichero), así que nunca habrían llegado al
  # topic Infra 1248. Por prefijo de nombre (`Frigate*`): una alerta nueva del
  # mismo VMRule queda cubierta sola, y el test la lee del VMRule real.
  # Agrupa por alertname, como ci-queue-degraded: con groupingCriteria [] una
  # alerta abierta (FrigateCaido) dejaría muda a la siguiente
  # (FrigateAlmacenamientoLleno) porque, con on: [create], la que se une a un
  # incidente abierto no avisa. Todas son `warning`: critical-safety-net no las
  # recoge y no hay que excluirlas de su lista (INVARIANTE 1).
  - ruleName: frigate-vigilancia
    celQuery: 'name.startsWith("Frigate")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: Frigate%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: [alertname]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: FRG
    incidentNameTemplate: "Vigilancia: {{ alertname }}"
    groupDescription: >-
      Frigate caído (o inalcanzable para el vmagent), detector lento o caído a
      CPU, cámara real sin frames y volumen de grabaciones casi lleno
      (manifests/frigate-rules.yaml). Fuente: frigate_* de /api/metrics y
      kubelet_volume_stats_* del PVC frigate-media.

  # Schedule muerto (fuente `schedules` de ops-watch, SC-2459): un workflow programado
  # crítico sin ningún run en su margen (p. ej. GitHub lo desactivó tras 3 fallos). El CI
  # en rojo no entra en Keep (INFRA-882); un CI MUERTO sí, porque nadie más lo ve. Agrupa
  # por `repo` Y `workflow` (dos schedules muertos del mismo repo son dos causas).
  - ruleName: trunk-ci-stale
    celQuery: 'name == "TrunkCIStale"'
    sqlQuery:
      sql: "((name = :name_1))"
      params:
        name_1: TrunkCIStale
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: [repo, workflow]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: STALE
    incidentNameTemplate: "Schedule muerto: {{ repo }}/{{ workflow }}"
    groupDescription: >-
      Workflows programados críticos sin runs en su margen esperado. El sensor es
      ops-watch (fuente `schedules`); el `resolved` lo emite la pasada que vuelve a
      ver un run.

  # Sonda de extremo a extremo de la cadena Alertmanager -> Keep -> Aurora ->
  # Hermes sre-devops. Solo la dispara quien prueba la cadena a mano (amtool con
  # alertname=SreDevopsChainProbe, severity=warning); no hay regla de
  # Prometheus que la emita.
  - ruleName: sre-chain-probe
    celQuery: 'name == "SreDevopsChainProbe"'
    sqlQuery:
      sql: "((name = :name_1))"
      params:
        name_1: SreDevopsChainProbe
    timeframeInSeconds: 600
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: PROBE
    incidentNameTemplate: "Sonda de la cadena de alertas"
    groupDescription: Prueba manual de la cadena de alertas hasta el agente sre-devops.

  # Cobertura del RCA de Aurora (INFRA-230, criterio C3 de INFRA-217). Mismo
  # patrón que monitoring-degraded: no avisa de que algo del clúster esté roto,
  # sino de que la HERRAMIENTA que investiga los fallos no está cumpliendo —
  # Aurora arriba y devolviendo cero RCA es el mes de 403 (26-08..21-09: 159
  # despachos sin análisis completo, mudo). Sin esta regla las AuroraRcaCoverage*
  # quedarían registradas y calladas; con ella aparecen como incidente en el
  # tablero. Las dos alertas son `warning` (manifests/rules.yaml, grupo
  # aurora.rca-coverage), así que no solapan con critical-safety-net, y por
  # eso no se la excluye de su lista.
  #
  # 1800s como monitoring-degraded: un reintento del worker no debe abrir
  # incidente nuevo cada pocos minutos.
  - ruleName: aurora-rca-degraded
    celQuery: 'name.startsWith("Aurora")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: Aurora%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: AUR
    incidentNameTemplate: "Investigación de incidentes degradada"
    groupDescription: >-
      Aurora no devuelve análisis completo a los despachos de Keep
      (AuroraRcaCoverageLow) o la métrica de cobertura ha desaparecido
      (AuroraRcaCoverageAbsent, ceguera de la anterior). Revisa worker de
      celery y logs; el conteo es de fingerprints distintos en ventana móvil
      de 24h con gracia de 4h.

  # =========================================================================
  # SYNAPSE
  # =========================================================================
  # Dos reglas y no una: el flujo de datos atascado y los servicios caídos se
  # arreglan de formas distintas, así que merecen incidentes distintos.
  # El pipeline agrupa por alerta Y cola (INFRA-882): con `[]`, una cola nueva sin
  # consumidor (el gmail, 16-10) se unía al incidente abierto de otra (voicelab) y,
  # con `on: [create]`, no avisaba. Un incidente por cola.
  - ruleName: synapse-pipeline
    celQuery: >-
      name.startsWith("SynapseOutbox") || name.startsWith("SynapseJanitor") ||
      name.startsWith("Rabbitmq") || name == "SynapseDLQBacklog" ||
      name == "SynapseScheduledWorkflowStalled" ||
      name == "SynapsePollFaultedBacklog" || name == "SynapseOrphanIndexEntries"
    sqlQuery:
      sql: "((name like :name_1) or (name like :name_2))"
      params:
        name_1: SynapseOutbox%
        name_2: Rabbitmq%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: [alertname, queue]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: SYNP
    incidentNameTemplate: "Synapse: {{ alertname }} {{ queue }}"
    groupDescription: Outbox, DLQ y colas del bus.

  - ruleName: synapse-control-plane
    celQuery: >-
      name.startsWith("Synapse") && !(
        name.startsWith("SynapseOutbox") || name.startsWith("SynapseJanitor") ||
        name in ["SynapseDLQBacklog", "SynapseScheduledWorkflowStalled",
                 "SynapsePollFaultedBacklog", "SynapseOrphanIndexEntries",
                 "SynapseWorkflowFailed"]
      )
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: Synapse%
    timeframeInSeconds: 900
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: SYNC
    incidentNameTemplate: "Plano de control de Synapse degradado"
    groupDescription: >-
      SynapseDown, CoreAbsent, DispatcherNotPublishing, AdapterTargetDown,
      Reconcile*, OperatorRestarts. Servicios, no flujo de datos.

  # =========================================================================
  # SYNAPSE — fallos de workflow, ahora detectados por métricas
  # =========================================================================
  # Esta regla es la contraparte de la VMRule `SynapseWorkflowFailed` que
  # sustituye al push que hacía el ops-explainer. Agrupa por `tenant` y no por
  # `workflow`: si se cae una dependencia común (el brain, Shopify, la DB), fallan
  # varios workflows del mismo tenant a la vez y eso es UN incidente, no seis.
  #
  # El detalle de qué workflow concreto falló va en las alertas del incidente y
  # en el resumen del LLM; el título sólo necesita decir de quién es el problema.
  - ruleName: synapse-workflow-failures
    celQuery: 'name == "SynapseWorkflowFailed"'
    sqlQuery:
      sql: "((name = :name_1))"
      params:
        name_1: SynapseWorkflowFailed
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: [tenant]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: SYNW
    incidentNameTemplate: "Workflows de Synapse fallando ({{ tenant }})"
    groupDescription: >-
      Workflows del engine finalizados con error. Antes lo avisaba el propio
      Synapse empujando a Alertmanager; ahora sale de sus métricas.

  # =========================================================================
  # CRONJOBS — sustituye la lane al cron-alert-analyzer
  # =========================================================================
  # Hasta ahora K8sCronJobFailed se reenviaba a un microservicio propio que leía
  # los logs del pod y los analizaba con LiteLLM. Ese servicio se retira: el
  # análisis lo hace Aurora (que además ve el clúster entero, no sólo los logs) y
  # la notificación Keep con el resumen del router.
  #
  # Agrupado por [namespace, alertname] (INFRA-378): antes era sólo namespace y
  # el incidente viejo CRON-9d403a3e, abierto con K8sCronJobFailed de los Jobs
  # t287-test* en firing, absorbía las BrainIngestConsecutiveFailures nuevas sin
  # emitir `created` — Alertmanager las reenviaba sobre un incidente ya agrupado
  # y ningún aviso llegaba a Telegram. Con alertname en los criterios, cada
  # familia de alerta abre su propio incidente ⇒ `created` ⇒ aviso.
  # BrainIngestConsecutiveFailures entra en la misma regla (INFRA-286), ya no en
  # el mismo incidente.
  - ruleName: cron-job-failed
    celQuery: 'name == "K8sCronJobFailed" || name == "BrainIngestConsecutiveFailures"'
    sqlQuery:
      sql: "((name in (:name_1, :name_2)))"
      params:
        name_1: K8sCronJobFailed
        name_2: BrainIngestConsecutiveFailures
    timeframeInSeconds: 3600
    timeUnit: minutes
    groupingCriteria: [namespace, alertname]
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: CRON
    incidentNameTemplate: "{{ alertname }} en {{ namespace }}"
    groupDescription: >-
      CronJobs con Jobs fallidos. Los logs de pods efímeros que Loki pierde los
      recupera Aurora vía kubectl-agent.

  # =========================================================================
  # SUBSISTEMAS DE APLICACIÓN
  # =========================================================================
  # Todos éstos notifican HOY (por el webhook de Synapse o su propia lane de
  # Telegram), así que sin regla el cutover sería un downgrade para ellos. Muchos
  # emiten `warn` o `page`, que Keep ingiere como `info`: por eso la cobertura la
  # da el nombre y no la severidad.
  - ruleName: libreplay-degraded
    celQuery: 'name.startsWith("LibrePlay")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: LibrePlay%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: LPLY
    incidentNameTemplate: "LibrePlay degradado"
    groupDescription: >-
      Disponibilidad, colas, SLO y sintéticos. 7 de sus 14 series emiten
      `severity: warn`.

  - ruleName: tracking-ingestion
    celQuery: 'name.startsWith("TrackingIngestion") || name == "TrackingPage404Spike"'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: TrackingIngestion%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: TRCK
    incidentNameTemplate: "Ingesta de tracking degradada"
    groupDescription: >-
      Backlog, eventos malos, NATS y silencio. 5 series `warn`, y
      TrackingIngestionNatsDown es `page`.

  - ruleName: labels-pipeline
    celQuery: 'name.startsWith("Labels") || name.startsWith("LabelGeneration")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: Labels%
    timeframeInSeconds: 1800
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: LBL
    incidentNameTemplate: "Pipeline de etiquetas degradado"
    groupDescription: >-
      Valkey de labels, generación y deep-monitor. Aquí viven 5 de las 9 alertas
      `page` del clúster.

  - ruleName: mcp-degraded
    celQuery: 'name.startsWith("MCP")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: MCP%
    timeframeInSeconds: 900
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: MCP
    incidentNameTemplate: "Backends MCP degradados"
    groupDescription: Crashloops, OOM y gateway de los backends MCP.

  # SC-1835 (H5 de SC-1728): la alerta de la sonda del MCP de Atlassian
  # (manifests/atlassian-mcp-rules.yaml). El ruleName NO es kebab-case como el
  # resto, es `AtlassianMcpToolDown` a propósito: `ops-watch.fuente_keep` usa el
  # `rule_name` del incidente para decidir si es la caída de Jira/MCP
  # (company_requests.REGLAS_CAIDA_JIRA, contrato ya en main de x86-host-runtime)
  # y hace el dedup de la Request única contra la del supervisor. Renombrar aquí
  # = entrada nueva junto a la vieja en ese contrato, no edición.
  #
  # Crítica, así que está excluida del safety-net arriba (INVARIANTE 1: la
  # exclusión delega en esta regla, no silencia).
  - ruleName: AtlassianMcpToolDown
    celQuery: 'name == "AtlassianMcpToolDown"'
    sqlQuery:
      sql: "((name = :name_1))"
      params:
        name_1: AtlassianMcpToolDown
    timeframeInSeconds: 900
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: JIRA
    incidentNameTemplate: "Jira/MCP de Atlassian no contesta"
    groupDescription: >-
      La sonda atlassian-mcp-probe no consigue leer una issue por el MCP
      (up=0, sonda atascada o serie ausente). ops-watch abre o comenta la
      Request única [IT] de la caída; el Operador IT la cierra con la causa.

  - ruleName: valkey-datastore
    celQuery: 'name.startsWith("SharedValkey") || name.startsWith("SharedDatastore")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: Shared%
    timeframeInSeconds: 900
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: DSTR
    incidentNameTemplate: "Datastore compartido degradado"
    groupDescription: Valkey compartido y co-locación del datastore.

  - ruleName: ovh-pvc-hub
    celQuery: 'name.startsWith("OVHPVCHub")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: OVHPVCHub%
    timeframeInSeconds: 3600
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: OVH
    incidentNameTemplate: "OVH PVC hub desincronizado"
    groupDescription: Sincronización y frescura del hub de PVCs de OVH.

  - ruleName: sii-cronjobs
    celQuery: 'name.startsWith("Sii")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: Sii%
    timeframeInSeconds: 3600
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: SII
    incidentNameTemplate: "CronJobs fiscales SII degradados"
    groupDescription: Facturación diaria e informe fiscal mensual del SII.

  # ---------------------------------------------------------------------------
  # SC-389 — auditor de pedidos Shopify-Picqer (CronJob skirmshop/
  # shopify-picqer-order-audit, diario 02:30 Europe/Madrid)
  #
  # Réplica exacta de la forma de `sii-cronjobs` (arriba), el precedente que
  # aprobó el CTO: SiiInvoicingFunctionalFailure llega a Telegram hoy PORQUE
  # `sii-cronjobs` agrupa la familia `Sii*` en un incidente. Sin regla, la alerta
  # queda sólo registrada y callada (tercera capa del encabezado), que es justo
  # el fallo que motivó SC-389: la VMRule dispara (activeAt 09:15) y Keep recibe
  # el webhook (event_id 09:31:04Z), pero NINGUNA regla de correlación casaba
  # con ella -> 0 incidentes -> 0 Telegram.
  #
  # Casa por FAMILIA de nombre igual que SII (`name.startsWith`), no por
  # severidad: las dos alertas del dominio (`ShopifyPicqerAuditFindings` y
  # `ShopifyPicqerAuditTelemetryMissing`, manifests/rules.yaml) son `warning`,
  # y Keep normaliza a `info` toda severidad fuera de su mapa -- la cobertura la
  # da el nombre. Sin criterios de agrupación: los dos modos de fallo del mismo
  # CronJob (hallazgos > 0 / telemetría ciega) son UN incidente de auditoría.
  #
  # NO se excluye del critical-safety-net, y no rompe la INVARIANTE 1: ese
  # safety-net sólo captura
  # `severity == "critical"` o `labels.severity == "page"`, y las dos alertas de
  # auditoría son `warning`. Sin solape posible hoy.
  - ruleName: shopify-picqer-audit
    celQuery: 'name.startsWith("ShopifyPicqer")'
    sqlQuery:
      sql: "((name like :name_1))"
      params:
        name_1: ShopifyPicqer%
    timeframeInSeconds: 3600
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: PQAUD
    incidentNameTemplate: "Auditoría de pedidos Shopify-Picqer degradada"
    groupDescription: >-
      El CronJob skirmshop/shopify-picqer-order-audit (diario 02:30) encuentra
      descuadres Shopify/Picqer o completa sin emitir telemetría. Mismo patrón
      que sii-cronjobs: familia de nombre -> un incidente.

  # ---------------------------------------------------------------------------
  # INFRA-1031 (SC-3623) — hueco del camino de scrape (vmagent→vmsingle)
  #
  # El 23/10 un hueco del camino de ≥15 min dejó sin muestras a TODOS los
  # jobs y las 7 absent() dispararon juntas: Keep montó N incidentes de
  # «job X ausente» (SC-2923, SC-2934, SC-2937) cuando era UNA avería del
  # data-plane. Esta regla pone el incidente que nombra la avería real:
  # «Hueco del camino de scrape», y excluye sus dos alertas del
  # critical-safety-net (INVARIANTE 1: la exclusión delega en esta regla).
  #
  # Por qué sólo las dos alertas del camino y no también las absent()
  # hermanas: INFRA-405 (test_infra405_correlation_rules) exige que cada
  # alerta case con ≤1 regla, y CertManagerCertificateMetricsMissing,
  # Rabbitmq*, KeepBackendAbsent y AuroraRcaCoverageAbsent ya son propiedad
  # de synapse-pipeline / keep-hub-degraded / aurora-rca-degraded / el
  # safety-net. Arrastrarlas aquí rompería el contrato; dejarlas fuera es lo
  # que permite que el contrato siga valiendo. Durante un hueco real esas
  # ausencias abrirán además su incidente de dominio (como hoy) — el
  # SCPATH es el que dice qué es lo que está roto de verdad. Silenciarlas
  # durante el hueco es inhibición (vmalert inhibit_rules), y eso es
  # decisión de SC-3623, no de esta Request.
  # ---------------------------------------------------------------------------
  - ruleName: camino-de-scrape
    celQuery: 'name in ["ScrapePathGap", "VmagentRemoteWriteFailing"]'
    sqlQuery:
      sql: "((name in (:name_1, :name_2)))"
      params:
        name_1: ScrapePathGap
        name_2: VmagentRemoteWriteFailing
    timeframeInSeconds: 900
    timeUnit: minutes
    groupingCriteria: []
    createOn: any
    resolveOn: all_resolved
    incidentPrefix: SCPATH
    incidentNameTemplate: "Hueco del camino de scrape (vmagent→vmsingle)"
    groupDescription: >-
      El data-plane de monitoring (vmagent→vmsingle) está dejando de escribir:
      las absent() hermanas son telemetría ciega, no servicios caídos.
      Diagnóstico por orden: pods de vmagent y vmsingle (OOMKilled, SC-2907),
      cola de remote-write (rca:remotewrite_pending) y logs en Loki
      (namespace="monitoring", app="vmagent").
