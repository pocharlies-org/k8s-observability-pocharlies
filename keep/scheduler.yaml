# SC-1711 — El WorkflowScheduler de Keep, en un deployment dedicado.
#
# POR QUÉ EXISTE. En Keep el scheduler no es un proceso aparte: `SCHEDULER` es
# `true` por defecto (keep/api/api.py:81) y el lifespan de la app lo arranca EN
# CADA worker gunicorn (`startup()`, api.py:133). Con los 4 workers de
# keep-backend, la carga periódica de Keep (los workflows con `interval`, la
# misma que cada 10-15 min dispara el resumen LLM y el informe de Aurora)
# competía con los webhooks de Alertmanager por el CPU y el pool de Postgres de
# ESOS workers: la ráfaga del stale-reaper dejó mudos a los 4 a la vez
# (`WORKER TIMEOUT`, HUB-7755) → Alertmanager registró context deadline
# exceeded → keep-hub-degraded (SC-1600). La mitigación de SC-1600 (gunicorn
# --timeout 120 + pool 3+5) estabilizó el hub, pero dejó el acoplamiento:
# cualquier carga periódica interna puede volver a dejar mudos los workers.
#
# QUÉ HACE ESTE DEPLOYMENT. Un solo proceso con el mismo código que ejecuta el
# scheduler hoy —la app completa con gunicorn --workers 1, SCHEDULER=true—,
# fuera del camino crítico de ingesta. keep-backend lleva desde este PR
# SCHEDULER=false (keep/values.yaml): sus workers solo sirven peticiones.
#
# Por qué gunicorn y no un script a medida: el scheduler necesita el arranque
# que hace `keep/api/config.py` (provisión de providers desde KEEP_PROVIDERS y
# del directorio /workflows, caché de providers); saltárselo es reescribir la
# inicialización de Keep en YAML. Con `--workers 1` el lifespan corre una sola
# vez: UN ejecutor. Y no duplicar ejecuciones no depende de la fe en esto: el
# lock real es la restricción de unicidad sobre workflow_execution que
# `get_workflows_that_should_run` (api/core/db.py:319) maneja con
# IntegrityError — así Keep ya soportaba N schedulers sin duplicar.
#
# strategy: Recreate a propósito. Con RollingUpdate habría solapamiento de
# pods (dos schedulers brevemente); el lock de arriba lo hace inofensivo, pero
# Recreate es lo que el criterio pide literalmente — un solo ejecutor — y el
# hueco de unos segundos es irrelevante: los workflows son por intervalo y en
# el siguiente tick se recuperan.
#
# No recibe tráfico: el Service keep-backend selecciona
# `keep-component: backend` y este pod lleva `keep-component: scheduler`. El
# HTTP que sirve en :8080 no lo llama nadie; es el precio de reutilizar el
# arranque nativo de la imagen.
#
# La imagen va fijada a mano (el chart la deriva de su appVersion): al subir
# keep a un chart nuevo, subir también el tag de aquí al appVersion de ese
# chart. pullPolicy IfNotPresent porque el tag es inmutable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keepsvc-scheduler
  namespace: monitoring
  labels:
    app.kubernetes.io/name: keep
    app.kubernetes.io/instance: keep
    app.kubernetes.io/component: scheduler
    keep-component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keep
      app.kubernetes.io/instance: keep
      keep-component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keep
        app.kubernetes.io/instance: keep
        app.kubernetes.io/component: scheduler
        keep-component: scheduler
    spec:
      serviceAccountName: keep
      # Mismo sitio que keep-backend (sauvage + toleration del taint edge):
      # el scheduler llama a Postgres y a los providers locales, y la
      # consolidación de Keep en un nodo ya es criterio del repo (ver el
      # comentario de nodeSelector en keep/values.yaml).
      nodeSelector:
        kubernetes.io/hostname: sauvage
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: scheduler
          # = appVersion del chart keep 0.1.96; mantener en pareja (arriba).
          image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.52.1
          imagePullPolicy: IfNotPresent
          # El CMD nativo de la imagen con --workers 1: mismo arranque
          # (config.py incluido), un solo lifespan, un solo scheduler.
          command:
            - /venv/bin/python
            - /venv/bin/gunicorn
            - keep.api.api:get_app
            - --bind
            - 0.0.0.0:8080
            - --workers
            - "1"
            - -k
            - uvicorn.workers.UvicornWorker
            - -c
            - /venv/lib/python3.13/site-packages/keep/api/config.py
            - --preload
          env:
            - name: SCHEDULER
              value: "true"
            # CONSUMER=false: el EventSubscriber consume el bus de eventos
            # INTERNOS de Keep, que en este despliegue (sin Redis, REDIS no
            # está) es in-process — publicar en un proceso y consumir en otro
            # no tiene sentido. Quien emite y consume esos eventos son los
            # workers de la API; aquí solo estorbarían.
            - name: CONSUMER
              value: "false"
            - name: PORT
              value: "8080"
            - name: KEEP_WORKFLOWS_DIRECTORY
              value: /workflows
            - name: SECRET_MANAGER_TYPE
              value: k8s
            - name: PUSHER_DISABLED
              value: "true"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus
            # Pool a la mitad que la API (1 proceso frente a 4): el techo es
            # 1×(3+5)=8 conexiones, y pre-ping por el mismo motivo que en
            # keep/values.yaml (idle_in_transaction_session_timeout del
            # servidor corta conexiones dormidas).
            - name: DATABASE_POOL_SIZE
              value: "3"
            - name: DATABASE_MAX_OVERFLOW
              value: "5"
            - name: KEEP_DB_PRE_PING_ENABLED
              value: "true"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: DATABASE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: keepsvc-database
                  key: dsn
          # KEEP_DEFAULT_API_KEYS y KEEP_PROVIDERS: la provisión de providers
          # que config.py hace al arrancar el worker lee de aquí, igual que la
          # API.
          envFrom:
            - secretRef:
                name: keepsvc-provisioning
          volumeMounts:
            - name: workflows
              mountPath: /workflows
              readOnly: true
            - name: state-volume
              mountPath: /state
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        # El MISMO ConfigMap que monta keep-backend (lo genera el chart desde
        # provision.workflows de keep/values.yaml): el scheduler no necesita
        # leer los YAML —los workflows los toma de la BBDD— pero config.py los
        # provisiona al arrancar y prefiere encontrarlos ahí.
        - name: workflows
          configMap:
            name: keep-workflows
        - name: state-volume
          emptyDir: {}
