name: aurora · helpers image (SC-2708)

# Construye los dos puentes de imagen de SC-2708:
#   - images/aurora/bridge/transformers → ghcr.io/pocharlies-org/transformers-inference:sentence-transformers-all-MiniLM-L6-v2-r1
#   - images/aurora/kubectl-agent       → ghcr.io/pocharlies-org/aurora-kubectl-agent:1.0.3-r1
# amd64 sola: los dos deployments llevan nodeSelector a sauvage (amd64). Mismo
# patrón de builder que aurora-bridge-image.yml (buildkitd-amd64 del ns
# buildkit, runner arc-k8s con sidecar dind).
#
# El push local con un PAT se rechaza (denied en el manifest PUT): los paquetes
# de la casa se crean y empujan desde la CI de este repo, como en INFRA-326.
# La sustitución de la imagen t2v en el clúster la hace la política Kyverno
# aurora-t2v-image-mirror (k8s-infra-pocharlies); kubectl-agent la toma de
# aurora/kubectl-agent-values.yaml.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - images/aurora/bridge/transformers/**
      - images/aurora/kubectl-agent/**
      - .github/workflows/aurora-helpers-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Builder buildkitd-amd64
        run: |
          docker buildx rm aurora-helpers 2>/dev/null || true
          docker buildx create --name aurora-helpers --driver remote \
            --platform linux/amd64 tcp://buildkitd-amd64.buildkit.svc.cluster.local:1234 --use
          docker buildx inspect --bootstrap

      - name: Build y push
        # cr.weaviate.io reparte el rate limit anónimo de Docker Hub (429
        # "unauthenticated pull rate limit", visto en el run 40503845600): la
        # base se re-suelve en cada runner, así que el build reintenta con
        # backoff hasta que la ventana de pull se relaja.
        run: |
          attempt=0
          until docker buildx build --platform linux/amd64 --push \
              --tag ghcr.io/pocharlies-org/transformers-inference:sentence-transformers-all-MiniLM-L6-v2-r1 \
              images/aurora/bridge/transformers; do
            attempt=$((attempt+1))
            if [ "${attempt}" -ge 6 ]; then exit 1; fi
            echo "429 u otro fallo de resolución; reintento ${attempt} en 120 s"
            sleep 120
          done
          docker buildx build --platform linux/amd64 --push \
            --tag ghcr.io/pocharlies-org/aurora-kubectl-agent:1.0.3-r1 \
            images/aurora/kubectl-agent

      - name: Verificar manifiestos
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools inspect ghcr.io/pocharlies-org/transformers-inference:sentence-transformers-all-MiniLM-L6-v2-r1
          docker buildx imagetools inspect ghcr.io/pocharlies-org/aurora-kubectl-agent:1.0.3-r1
