name: aurora · bridge image (INFRA-326)

# Construye el puente documentado images/aurora/bridge (aurora-server sha-e35121a +
# parche Arvo-AI/aurora#688). Multi-arch nativo sin QEMU: cada plataforma la compila el
# buildkitd de su arch en el namespace buildkit — mismo patrón que
# dgx-infra/.github/workflows/build-bge-embedding.yml. Runner arc-k8s (skill
# ci-runners-arc); el job necesita docker, que el release de ARC trae por sidecar dind.
#
# NO pisa tags existentes: sube ghcr.io/pocharlies-org/aurora-server:sha-e35121a-p688.
# VER images/aurora/bridge/README.md — PLAN DE RETIRADA: este workflow se borra cuando
# Arvo-AI/aurora#688 se fusione y se sudee a la imagen upstream.

on:
  workflow_dispatch: {}
  push:
    paths:
      - images/aurora/bridge/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Builder multi-arch (buildkitd remoto por arch)
        run: |
          docker buildx rm aurora-bridge 2>/dev/null || true
          docker buildx create --name aurora-bridge --driver remote \
            --platform linux/amd64 tcp://buildkitd-amd64.buildkit.svc.cluster.local:1234 --use
          docker buildx create --name aurora-bridge --driver remote \
            --platform linux/arm64 --append tcp://buildkitd-arm64.buildkit.svc.cluster.local:1234
          docker buildx inspect --bootstrap

      - name: Build (push solo en main)
        # En pull_request SOLO se valida el build, sin publicar: el paquete GHCR
        # aurora-server/aurora-frontend está vinculado al repo `aurora` y el
        # GITHUB_TOKEN de este repo no tiene write_package (Request IT enlazada
        # a INFRA-326). En main (push o dispatch) se publica el tag.
        run: |
          ARGS=(--platform linux/amd64,linux/arm64
                --tag ghcr.io/pocharlies-org/aurora-server:sha-e35121a-p688)
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            ARGS+=(--push)
          else
            ARGS+=(--output "type=oci,dest=${RUNNER_TEMP:-/tmp}/bridge.oci")
          fi
          docker buildx build "${ARGS[@]}" images/aurora/bridge

      - name: Espejo del tag frontend (mismo digest, sin rebuild)
        # El chart compone `aurora-frontend:{image.tag}` del MISMO tag global
        # (templates/frontend-deployment.yaml:36, sin override por componente):
        # sin este espejo el frontend entraría en ImagePullBackOff con el tag -p688.
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/pocharlies-org/aurora-frontend:sha-e35121a-p688 \
            ghcr.io/pocharlies-org/aurora-frontend:sha-e35121aeb7d80293d2e4ce462fe2bc05d9adb469

      - name: Verificar manifiesto y digest
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools inspect ghcr.io/pocharlies-org/aurora-server:sha-e35121a-p688 \
            | tee /tmp/inspect.txt
          grep -q 'linux/amd64' /tmp/inspect.txt && grep -q 'linux/arm64' /tmp/inspect.txt
          echo "Digest:"; grep -m1 Digest /tmp/inspect.txt >> "$GITHUB_STEP_SUMMARY" || true
