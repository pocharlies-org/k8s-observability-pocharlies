apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aurora
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    # Sync-wave 2: después de Keep (1), que es quien le manda los incidentes.
    argocd.argoproj.io/sync-wave: "2"
    link.argocd.argoproj.io/Aurora: https://aurora.lan.e-dani.com
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/Arvo-AI/aurora/gh-pages
      chart: aurora-oss
      targetRevision: 1.2.16
      helm:
        releaseName: aurora
        valueFiles:
          - $values/aurora/values.yaml
    - repoURL: https://github.com/pocharlies/k8s-observability-pocharlies
      targetRevision: deploy/prod
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: aurora
  # Los StatefulSets del chart (redis, weaviate) no declaran estos campos, así
  # que los rellena el API server con sus defaults y ArgoCD los lee como drift:
  # el Application se quedaba OutOfSync para siempre con los dos pods Ready y sus
  # PVC Bound. Con selfHeal activo eso además genera intentos de "arreglo" en
  # bucle. Verificado que la divergencia es SÓLO estos defaults comparando el
  # render de helm contra el objeto vivo.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/updateStrategy
        - /spec/revisionHistoryLimit
        - /spec/volumeClaimTemplates/0/spec/volumeMode

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
