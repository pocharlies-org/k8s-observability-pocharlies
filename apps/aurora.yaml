apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aurora
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    # Sync-wave 2: después de Keep (1), que es quien le manda los incidentes.
    argocd.argoproj.io/sync-wave: "2"
    link.argocd.argoproj.io/Aurora: https://aurora.lan.e-dani.com
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/Arvo-AI/aurora/gh-pages
      chart: aurora-oss
      targetRevision: 1.2.16
      helm:
        releaseName: aurora
        valueFiles:
          - $values/aurora/values.yaml
    - repoURL: https://github.com/pocharlies/k8s-observability-pocharlies
      targetRevision: deploy/prod
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: aurora
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
