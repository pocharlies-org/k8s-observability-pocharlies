apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8sgpt
  namespace: argocd
  labels:
    e-dani.com/tier: infra
  annotations:
    # Sync-wave 3: después de Keep (1) y Aurora (2). k8sgpt no depende de que
    # estén arriba para arrancar, pero sus hallazgos acaban ahí vía
    # VMRule -> Alertmanager -> Keep -> Aurora, así que el orden refleja el
    # sentido del flujo.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://charts.k8sgpt.ai/
      chart: k8sgpt-operator
      targetRevision: 0.2.27
      helm:
        releaseName: k8sgpt
        valueFiles:
          - $values/k8sgpt/values.yaml
    - repoURL: https://github.com/pocharlies-org/k8s-observability-pocharlies
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: k8sgpt

  # El toleration de sauvage lo pone Kyverno, no el chart — y sin esto ArgoCD lo
  # borraría en cada sync.
  #
  # El chart no soporta `tolerations` (ver k8sgpt/values.yaml), así que la
  # ClusterPolicy `k8sgpt-sauvage-toleration` lo inyecta en admisión. Pero eso
  # crea una diferencia permanente contra git: ArgoCD ve un campo que su
  # manifiesto no tiene, lo considera drift y con selfHeal lo revierte — dejando
  # el pod sin toleration y Pending en un nodo con taint. Se observó exactamente
  # eso: el Deployment del pod de análisis (que crea el operador, fuera de
  # ArgoCD) SÍ conservaba el toleration, y el del controller-manager no.
  #
  # Ignorar sólo ese path deja que Kyverno gane donde debe, sin renunciar al
  # control de git sobre el resto del pod template.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/tolerations

  syncPolicy:
    automated:
      selfHeal: true
      # prune: false como el resto de apps del repo. Las CRDs
      # (k8sgpts/results/mutations) viven en crds/ del chart y NO deben
      # borrarse por un sync accidental: se llevarían por delante el CR de
      # configuración y todos los Result acumulados.
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
