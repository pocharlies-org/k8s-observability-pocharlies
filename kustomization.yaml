apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests/aurora-namespace.yaml
  - manifests/k8sgpt-namespace.yaml
  - apps/victoria-metrics.yaml
  - apps/loki.yaml
  - apps/blackbox-exporter.yaml
  - apps/alloy.yaml
  - apps/keep.yaml
  - apps/aurora.yaml
  - apps/aurora-kubectl-agent.yaml
  - apps/k8sgpt.yaml
  - manifests/ingressroutes.yaml
  - manifests/alertmanager-secrets.yaml
  - manifests/keep-secrets.yaml
  - manifests/aurora-secrets.yaml
  - manifests/aurora-kubectl-agent.yaml
  - manifests/k8sgpt-secrets.yaml
  - manifests/k8sgpt-config.yaml
  - manifests/k8sgpt-scrape.yaml
  - manifests/k8sgpt-rules.yaml
  - manifests/k8sgpt-tolerations-policy.yaml
  - manifests/aurora-storage.yaml
  - manifests/aurora-frontend-models-policy.yaml
  # SearXNG propio para Aurora con el brain como motor extra. Va fuera del chart
  # porque aurora-oss 1.2.16 trae el settings.yml de SearXNG hardcodeado (ningún
  # `.Values`) y el Application `aurora` tiene selfHeal: cualquier parche a su
  # ConfigMap se revierte solo.
  - manifests/aurora-searxng-brain.yaml
  # Exporta las notas curadas del brain (FINDING/GOTCHA/DECISION) a la Knowledge
  # Base de Aurora: sin esto el agente re-descubre en cada incidente trampas que
  # llevan meses escritas.
  - manifests/aurora-brain-kb-sync.yaml
  - keep/rules/apply-job.yaml
  # Ventana de mantenimiento diaria de las 04:00: las de Keep no tienen
  # recurrencia (start_time/end_time y punto), así que un CronJob la reprograma.
  - keep/maintenance/daily-window.yaml
  - manifests/alertmanager-config.yaml
  - manifests/probes.yaml
  - manifests/rules.yaml
  - manifests/keep-scrape.yaml
  - manifests/grafana-keep.yaml
  - manifests/dashboards.yaml
  - manifests/dcgm-scrape.yaml
  - manifests/rabbitmq-scrape.yaml
  - manifests/dgx-gpu-mem-exporter.yaml
  - manifests/kyverno-policy-exceptions.yaml
  - manifests/dgx-cluster-health-watcher.yaml

# Las reglas de correlación se montan como fichero en el Job que las aplica, en
# vez de duplicarse inline: keep/rules/correlation-rules.yaml sigue siendo la
# única copia, legible y comentada.
configMapGenerator:
  - name: keepsvc-correlation-rules
    namespace: monitoring
    files:
      - correlation-rules.yaml=keep/rules/correlation-rules.yaml
  # El texto que el sincronizador escribe en /memory de Aurora, y que acaba
  # inyectado entero en el system prompt del agente. Va como fichero suelto y no
  # inline en el manifiesto porque es prosa que se itera a mano.
  - name: aurorasvc-brain-kb-memory
    namespace: aurora
    files:
      - brain-kb-memory.md=aurora/brain-kb-memory.md
generatorOptions:
  # El Job referencia el nombre literal, sin sufijo de hash. Se recrea en cada
  # sync (hook PostSync + BeforeHookCreation), así que siempre lee la versión
  # actual del ConfigMap.
  disableNameSuffixHash: true
