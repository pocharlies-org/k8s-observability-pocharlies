# Aurora — investigación de incidentes disparada por Keep.
#
# Keep correla alertas en incidentes y le pasa el incidente a Aurora, que lanza
# agentes read-only sobre el clúster y produce un RCA. Aurora NO recibe alertas
# sueltas: eso multiplicaría investigaciones de la misma causa.
#
# Seam verificado en el código de Aurora (no hace falta adaptador):
# POST /grafana/alerts/webhook/<user_id> consume forma casi-nativa de Alertmanager
# — alerts[], status firing|resolved, commonLabels, commonAnnotations — hace
# fingerprint por alerta, crea incidente y dispara RCA en firing
# (server/routes/grafana/grafana_routes.py:99 y tasks.py).
#
# Postura: SOLO LECTURA. Sin PRs automáticos, sin ejecutores de acción.
#
# Esa postura ya NO significa que en el estado no toque nadie: desde 2026-08-05
# la ejecución mutante vive en el AutoFixExecutor del adapter ops-explainer de
# Synapse (allowlist cerrada de 4 acciones, precondiciones en los ejecutores
# auditados, circuit-breaker por fingerprint y ledger en synapse.autofix_ledger).
# Aurora sigue sin ejecutar nada: hace el RCA y ahí acaba su parte. Los CronJobs
# de autoheal de Synapse siguen suspendidos, pero ahora porque el AutoFixExecutor
# los sustituye, no porque nadie repare.
#
# El reparto es: Aurora analiza (read-only) → el ops-explainer ejecuta lo que la
# allowlist admite → el humano recibe la tarjeta. Dar herramientas de escritura a
# Aurora sería un cambio de postura, no una extensión de ésta.

# El chart compone nombres como <release>-<chart>-<componente>; sin esto los
# Services serían `aurora-aurora-oss-server`. Importa porque el workflow de Keep
# apunta a ese nombre por DNS.
fullnameOverride: aurora

# ---------------------------------------------------------------------------
# Imágenes. El chart trae el placeholder literal `your-registry`, así que sin
# esto todos los pods entran en ImagePullBackOff intentando bajar
# `your-registry/aurora-server:latest` de Docker Hub.
#
# Aurora SÍ publica imágenes: `make prod-prebuilt` tira de
# ghcr.io/arvo-ai/aurora-{server,frontend}, multi-arch amd64+arm64. No hay que
# construir nada.
#
# El tag va pineado a la versión del chart, no a `latest`: un `latest` móvil
# haría que dos syncs del mismo commit desplegasen binarios distintos, y en un
# sistema que investiga incidentes eso es justo lo que no quieres.
#
# Al subir la versión del chart en apps/aurora.yaml, subir también este tag.
# ---------------------------------------------------------------------------
image:
  registry: ghcr.io/arvo-ai
  tag: "1.2.16"

# ---------------------------------------------------------------------------
# Infra compartida en vez de la del chart. Ahorra ~4GB y evita duplicar bases de
# datos que ya tienen backup y monitorización resueltos.
# ---------------------------------------------------------------------------
services:
  postgres:
    enabled: false   # -> postgres-shared (CNPG, 2 instancias, backup a MinIO)
  minio:
    enabled: false   # -> minio-s3.minio, bucket `aurora` con usuario propio
  vault:
    enabled: false   # -> vault.vault, mount KV `aurora` con política acotada
  memgraph:
    enabled: false   # el propio chart lo marca opcional
  redis:
    enabled: true    # propio: Celery contra valkey-sentinel es frágil
  weaviate:
    enabled: true    # lo necesita incident_feedback (memoria de incidentes)

config:
  AURORA_ENV: production

  # --- Postgres compartido ---
  POSTGRES_HOST: postgres-shared-rw.databases.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: aurora
  POSTGRES_SSLMODE: prefer

  # --- S3 en MinIO ---
  STORAGE_BUCKET: aurora
  STORAGE_ENDPOINT_URL: http://minio-s3.minio.svc.cluster.local:9000
  STORAGE_USE_SSL: "false"
  STORAGE_VERIFY_SSL: "false"

  # --- Vault: mount propio, no el compartido ---
  # `aurora` es un mount KV v2 distinto de `secret`, y el token de Aurora está
  # acotado por política a `aurora/*`: no puede leer los secretos del resto del
  # clúster ni con el token en la mano.
  SECRETS_BACKEND: vault
  VAULT_ADDR: http://vault.vault.svc.cluster.local:8200
  VAULT_KV_MOUNT: aurora
  VAULT_KV_BASE_PATH: users

  # --- URLs públicas ---
  #
  # La API se sirve en el MISMO origen que la UI, bajo `/backend` (Traefik hace
  # stripPrefix). No es una preferencia estética: el cliente de Aurora llama a
  # `fetch()` SIN `credentials: "include"` justo en los endpoints de arranque
  # (`/api/auth/register`, `/api/auth/login`, `/api/auth/setup-org` — verificado
  # en los chunks del build), y el valor por defecto `same-origin` significa que
  # en una petición cross-origin el navegador NO manda ninguna cookie, tampoco
  # la de SSO. Con la API en otro host, oauth2-proxy las veía sin sesión y
  # respondía 302 a Keycloak: registro y login imposibles, con un "An error
  # occurred" genérico y cero rastro en los logs. Mismo origen ⇒ la cookie
  # viaja por defecto, no hay preflight y todo pasa por `sso-chain` igual.
  #
  # El resto de la UI sí usa `credentials: "include"` (104 usos en los bundles),
  # así que funcionaba; sólo rompía la superficie de autenticación.
  # El WebSocket NO comparte destino con la API: el chat lo sirve
  # aurora-chatbot:5006 y la API aurora-server:5080. Apuntando ambos a
  # `/backend` el socket acababa en el Flask del server, que no habla ese
  # protocolo, y el chat mostraba "Connection not ready" con cualquier modelo.
  # `/ws` tiene su propia ruta en la IngressRoute (ver manifests/ingressroutes.yaml).
  FRONTEND_URL: https://aurora.lan.e-dani.com
  NEXT_PUBLIC_BACKEND_URL: https://aurora.lan.e-dani.com/backend
  NEXT_PUBLIC_WEBSOCKET_URL: wss://aurora.lan.e-dani.com/ws

  # ------------------------------------------------------------------------
  # LLM: todo local en el DGX vía LiteLLM
  #
  # `direct` + un id explícito `bedrock/<alias>` es la vía documentada para el
  # gateway mode. Verificado en bedrock_provider.py:106: con BEDROCK_BASE_URL
  # presente construye un ChatOpenAI contra esa URL y pasa el sufijo del id tal
  # cual, así que `bedrock/tooling` llega a LiteLLM como el alias `tooling`.
  # `openai` NO sirve: openai_provider.py sólo lee OPENAI_API_KEY, sin base_url.
  # ------------------------------------------------------------------------
  # --- Búsqueda ---
  #
  # Instancia propia de SearXNG (manifests/aurora-searxng-brain.yaml) en vez de la
  # del chart, para que `web_search` consulte también el brain — la memoria de
  # sesiones sobre este clúster. Es la única vía sin forkear Aurora: el agente
  # tiene una sola herramienta de búsqueda y un solo backend configurable.
  #
  # No se pierde nada por el camino: medido el 2026-08-05, el SearXNG del chart
  # devolvía CERO resultados para una consulta técnica normal (duckduckgo y
  # startpage responden CAPTCHA desde IPs de datacenter, y google/bing tampoco
  # contestan). O sea que `web_search` llevaba tiempo siendo una herramienta
  # muerta; con el brain al menos devuelve algo útil. Los motores web siguen
  # declarados por si algún día vuelven a funcionar.
  #
  # OJO: este valor acaba en el ConfigMap `aurora-config`, del que cuelga la
  # anotación checksum/config de 7 deployments -> tocarlo los REINICIA. Es
  # necesario: WebSearchService lee os.getenv("SEARXNG_URL") en su __init__, no en
  # cada búsqueda. El aurora-searxng del chart se queda vivo e intacto: revertir
  # esta línea es el rollback completo.
  SEARXNG_URL: http://aurorasvc-searxng:8080

  LLM_PROVIDER_MODE: direct
  BEDROCK_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
  # UN SOLO ALIAS PARA TODO: `tooling`.
  #
  # Antes esto era `dense` (alias que dejó de existir) y luego `router`. Se
  # unifica en `tooling` por decisión explícita: un único alias, sin indirección
  # y sin que el modelo que razona un RCA dependa de lo que decida el smart
  # router en ese momento.
  #
  # NO ANOTES AQUÍ QUÉ MODELO HAY DETRÁS. Ése es el sentido del alias:
  # `litellm-dgx-backend-sync` repunta `tooling` a lo que esté residente en dgx1,
  # y sólo cabe un vLLM grande por GPU, así que el modelo rota. Este comentario
  # llegó a decir «tooling resuelve a Ornith 35B» y envejeció mal: hoy resuelve a
  # `dgx1-nvidia-qwen36-35b-nvfp4-tooling`. Si necesitas saber quién responde
  # AHORA, míralo, no lo leas:
  #     kubectl -n litellm logs deploy/litellm-dgx-backend-sync | grep 'for alias tooling'
  #
  # La contrapartida que este bloque documentaba como asumida SE COBRÓ, y por eso
  # `tooling` degrada. Decía: «con un alias fijo, si `tooling` se
  # quedara sin backend Aurora daría model-not-found en vez de degradar sola».
  # Pasó el 2026-08-04 19:11 — dgx1 cambió de modelo residente y Aurora murió a
  # los 40 s, a mitad de un incidente real, con «no healthy deployments for this
  # model». Aurora no puede cubrirse a sí misma: no tiene ni un `with_fallbacks`
  # en todo su árbol, su `max_retries` reintenta contra el MISMO modelo, y bedrock
  # es su único provider disponible.
  #
  # `tooling` = «el residente de tooling, y si no está, algo vivo». Del 2026-08-05
  # al 2026-08-10 esto fue un alias aparte, `tooling-ha`, con el argumento de que
  # degradar `tooling` falsearía las mediciones. Se retiró: las mediciones se hacen
  # contra nombres de MODELO (`ornith-1.0`, `qwen36-35b-nvfp4`, `dense-uncensored`), que
  # siguen sin degradar, y TODO el que pedía `tooling` quería «vivo» — eran dos
  # nombres para una intención, y el que no llevaba sufijo era la trampa.
  #
  # El fallback lo aplica el hook litellm_strip_params (repo
  # k8s-litellm-pocharlies) al propio `tooling`, con la cadena tooling -> dense y
  # verificando el salto. Cubre el modo «alias DESREGISTRADO», que el proxy rechaza
  # antes de que corra el Router; funciona porque el hook está en pre_call_hook,
  # antes del gate de nombre de modelo.
  #
  # Sigue NO siendo el smart router: `router`/`auto` reclasifican por forma de
  # petición (con tool -> dense), y eso es justo lo que esta decisión quitó. Aquí
  # el modelo lo elige Aurora y sólo cambia si el elegido no está.
  #
  # La otra mitad de la red vive en la config de LiteLLM
  # (`router_settings.fallbacks: [{tooling: [dense]}]`, un solo sentido) y cubre el
  # modo que el hook no ve: alias registrado pero sin deployment sano. Son dos
  # modos de fallo con dos errores distintos y hacen falta las dos capas.
  # LOS CINCO ROLES A `tooling`. Hubo un intento (2026-08-05) de mandar los que
  # CONDUCEN el bucle — MAIN_MODEL y RCA_MODEL — a un alias del Qwen3-Coder, porque
  # Aurora es LangGraph con 30+ tools y parecía el modelo indicado.
  #
  # REVERTIDO EL MISMO DÍA por capacidad: vivía en el SEGUNDO slot time-sliced de
  # DGX2 y ese slot estaba disputado. Estuvo 1/1 a las 07:47 y a las 08:05:39 el sync
  # ya lo había desregistrado. Apuntar la config a un modelo que no está la mayor
  # parte del tiempo es mentir sobre lo que corre: la cadena degradaba a `tooling`
  # igualmente, así que el efecto real era cero y la config engañosa.
  #
  # La medida que se citaba entonces para justificarlo — un test de opencode — está
  # DESCARTADA por mala (owner, 2026-08-10), así que ya no se cita aquí.
  #
  # 2026-08-10: ni los alias -ha ni el propio Qwen3-Coder existen ya; el modelo se
  # sacó del cluster entero (Deployment, pesos y config). Este bloque documenta un
  # intento que ya no se puede repetir: si algún día hace falta un modelo de código
  # para los roles que CONDUCEN el bucle, hay que traer uno nuevo y medirlo bien.
  MAIN_MODEL: bedrock/litellmrouter
  SUMMARIZATION_MODEL: bedrock/litellmrouter   # trabajo mecánico al modelo rápido
  ENRICHMENT_MODEL: bedrock/litellmrouter
  # Corta cualquier RCA que empiece a repetir herramientas. El valor anterior
  # (240) permitió investigaciones de 30+ llamadas y prompts de hasta 95k.
  AGENT_RECURSION_LIMIT: "12"

  # Un agente primero. El orquestador multi-agente se activa cuando los RCA de
  # un solo agente demuestren ser buenos: con modelo local, el riesgo es que el
  # tool-calling se atasque en cadenas largas y el síntoma sea una investigación
  # pobre, no un error — sólo se ve leyendo los RCA.
  ORCHESTRATOR_ENABLED: "false"
  VISUALIZATION_ENABLED: "false"
  # RCA_MODEL hay que fijarlo EXPLÍCITAMENTE: su default no cae a MAIN_MODEL.
  # En llm.py:46 es `os.getenv("RCA_MODEL") or (... if RCA_OPTIMIZE_COSTS else
  # "anthropic/claude-opus-4.6")`, así que con RCA_OPTIMIZE_COSTS=false y la
  # variable sin poner, el RCA de fondo pedía un modelo de Anthropic — sin
  # credencial y fuera de LiteLLM. El error real en el celery-worker era
  # `RuntimeError: Provider 'anthropic' is not available for model
  # 'anthropic/claude-opus-4.6'`, y tumbaba el chat del incidente, que es lo que
  # produce el resumen.
  RCA_MODEL: bedrock/litellmrouter
  RCA_OPTIMIZE_COSTS: "false"

  # ------------------------------------------------------------------------
  # Guardarraíles: activos, con el juez en el modelo rápido.
  # OJO: el juez LLM falla CERRADO. Si el modelo local no devuelve la estructura
  # esperada, bloquea investigaciones legítimas. Si eso pasa, dejar
  # GUARDRAILS_SIGMA_ENABLED (reglas SigmaHQ, sin LLM) y apagar el juez.
  # ------------------------------------------------------------------------
  GUARDRAILS_ENABLED: "true"
  GUARDRAILS_SIGMA_ENABLED: "true"
  GUARDRAILS_LLM_MODEL: bedrock/litellmrouter

  # --- Aislamiento de los comandos de los agentes: DESACTIVADO ---
  #
  # En "true" crea el namespace `untrusted`, RBAC y una NetworkPolicy que corta
  # el acceso de los pods de terminal a los servicios del clúster (Vault,
  # Postgres, …). Es lo que estaba, y es lo más seguro.
  #
  # Se apaga por decisión explícita del owner (2026-08-06) para habilitar el SSH
  # de Tailscale. `tailscale_ssh_tool.py:282` sólo toma la vía de SSH directo
  # cuando esta variable es false: con el aislamiento activo los comandos corren
  # en pods efímeros de `untrusted` cuya NetworkPolicy no tiene salida al tailnet,
  # así que la clave pública de Aurora instalada en los siete hosts no servía de
  # nada. La alternativa era mantener el aislamiento y abrir la NetworkPolicy
  # hacia 100.64.0.0/10 metiendo Tailscale en esos pods; se descartó por coste.
  #
  # QUÉ SIGNIFICA ESTO, sin adornos: los comandos del agente dejan de correr en
  # sandbox y se ejecutan desde el propio pod de Aurora, que SÍ alcanza Vault,
  # Postgres y el resto del clúster. Sumado a que su clave SSH está en sauvage,
  # x86, dgx, dgx2 y los tres control-plane, Aurora pasa a poder ejecutar
  # comandos arbitrarios en todo el estate.
  #
  # Lo que sigue conteniendo el radio de daño: el kubectl-agent mantiene su RBAC
  # de sólo lectura y sin `secrets` (aurora/kubectl-agent-values.yaml), no hay
  # PRs automáticos (NEXT_PUBLIC_ENABLE_INCIDENT_PREVENTION=false) y los
  # guardarraíles siguen activos. Revertir: poner "true" aquí y borrar la clave
  # `aurora-ssh-key` de los authorized_keys (ver secret/infra/ssh/tailnet).
  ENABLE_POD_ISOLATION: "false"
  TERMINAL_NAMESPACE: untrusted
  TERMINAL_POD_TTL: "3600"
  USE_UNTRUSTED_NODES: "false"

  # --- Sin escritura ---
  NEXT_PUBLIC_ENABLE_INCIDENT_PREVENTION: "false"   # sin PRs automáticos

  # --- Concurrencia ---
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
  # Un solo RCA a la vez. La entrada Keep -> Aurora ya queda serializada por
  # fingerprint, pero este límite contiene cualquier productor adicional y
  # evita que dos bucles de agentes compitan por el mismo backend LLM.
  CELERY_CONCURRENCY: "1"
  DB_POOL_MIN: "1"
  DB_POOL_MAX: "10"
  RATE_LIMITING_ENABLED: "false"

# Todos los secretos desde ESO; ninguno en git. Ver
# manifests/aurora-secrets.yaml.
secrets:
  db:
    existingSecret: aurorasvc-db
  backend:
    existingSecret: aurorasvc-backend
  app:
    existingSecret: aurorasvc-app
  llm:
    existingSecret: aurorasvc-llm

# Ingress propio (IngressRoute + sso-chain), como el resto de UIs de
# observabilidad. Ver manifests/ingressroutes.yaml.
ingress:
  enabled: false

# Aurora entero consolidado en sauvage, StatefulSets incluidos.
#
# El taint del nodo es `role=edge:NoSchedule`: el nodeSelector solo no basta,
# hace falta el toleration o todo se queda Pending. El chart aplica ambos
# valores a TODOS los pods (global), que es justo lo que queremos aquí.
#
# OJO — ESTO NO FUNCIONA SIN LA MIGRACIÓN DE ALMACENAMIENTO
#
# `sauvage` es el ÚNICO nodo del clúster sin driver CSI de Longhorn (verificado:
# `kubectl get csinode` le da la lista de drivers VACÍA). Cualquier PVC de
# storageClass `longhorn` es por tanto imposible ahí: el pod queda Pending con
# "CSINode sauvage does not contain driver driver.longhorn.io".
#
# aurora-redis y aurora-weaviate tienen PVC. Por eso van acompañados de
# manifests/aurora-storage.yaml, que pre-crea sus PVC en `local-path`. Sin ese
# fichero, fijar Aurora aquí rompe los dos StatefulSets.
nodeSelector:
  kubernetes.io/hostname: sauvage
tolerations:
  - key: role
    operator: Equal
    value: edge
    effect: NoSchedule

# ---------------------------------------------------------------------------
# celery-beat: el default del chart (256Mi) lo mata por OOM.
#
# Evidencia: exit=137 OOMKilled, 42 reinicios. El log muestra que importa los 25
# módulos de tareas (GCP, AWS, Dynatrace, PagerDuty, Jenkins, Spinnaker,
# NewRelic, Sentry, GitHub…) y muere justo al acabar. El chart asume que un
# scheduler es ligero, pero beat corre LA MISMA IMAGEN que el worker — al que le
# da 4Gi — y ese grafo de imports no cabe en 256Mi.
#
# 1Gi es holgado para lo único que hace (encolar tareas periódicas) sin
# acercarse al worker, que es quien ejecuta los agentes.
# ---------------------------------------------------------------------------
resources:
  celeryBeat:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # ---------------------------------------------------------------------------
  # El vectorizador de la Knowledge Base, con CPU suficiente para que la ingesta
  # no falle en silencio.
  #
  # El default del chart es `limits.cpu: 500m` — medio core — para all-MiniLM-L6
  # corriendo en CPU (ENABLE_CUDA=0). Medido el 2026-08-05 contra el pod con el
  # sistema ocioso: 1,6 s por chunk de ~520 caracteres, y el throughput NO mejora
  # con concurrencia (0,30 vec/s con 1 hilo, 0,32 con 8): es cuota de CPU, no
  # contención. Además el contenedor ve los 48 cores del nodo y abre 289 hilos
  # que se pelean por ese medio core.
  #
  # POR QUÉ ROMPÍA LA INGESTA, Y ADEMÁS SIN AVISAR
  # weaviate_client.py fija un timeout de inserción de 60 s y usa batch dinámico,
  # que con esta versión del cliente son lotes de 48 objetos. 48 x 1,6 s = 77 s >
  # 60 s: el lote SIEMPRE expiraba, incluso con el vectorizador en reposo. Y
  # `insert_chunks` no propaga el fallo, así que `tasks.py` marcaba el documento
  # como `ready` con `chunk_count=0`: 13 documentos subidos, cero indexados, cero
  # errores a la vista. Con estos límites un lote baja a ~15 s y queda margen 4x.
  #
  # Cabe de sobra: sauvage tiene 48 CPU con los limits al 37 %.
  transformers:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 4Gi

  # Weaviate con el default (500m / 1Gi) era el siguiente cuello: va a recibir
  # ~7.400 vectores y a construir el índice HNSW.
  weaviate:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 100Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi
