# Loki single-binary — logs stored in OVH Object Storage (S3 compatible)
# Helm chart: grafana/loki
# Index local in Longhorn PVC; chunks en el bucket OVH `loki-chunks-pocharlies`
# (INFRA-1175: antes, la MinIO de sauvage).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks-pocharlies
      ruler: loki-chunks-pocharlies
      admin: loki-chunks-pocharlies
    s3:
      # OVH Object Storage (región SBG, París). `s3ForcePathStyle` porque los
      # buckets de OVH no resuelven por subdominio.
      endpoint: s3.sbg.io.cloud.ovh.net
      region: sbg
      # El chart 7.0.0 NO tiene `existingSecret` para S3: estas dos claves se
      # expanden desde el entorno del contenedor (`-config.expand-env=true`), y
      # el entorno viene del Secret `loki-ovh-creds` que materializa el
      # ExternalSecret `manifests/loki-ovh-creds.yaml`. La credencial vive solo
      # en 1Password (item `ovh-object-storage-s3`).
      #
      # Las credenciales que había aquí estaban en claro en git (`dibanez` /
      # bootstrap) y se filtraban además al ConfigMap `loki` y al secret de
      # release de Helm: la rotación es de `security` (INFRA-1175, 47240).
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
  limits_config:
    # INFRA-43 (INFRA-23 H1): los enforces del AgentGateway exigen responder qué
    # principals llamaron una ruta en las ultimas 72 h. 48h (bajada 2026-07-22 tras
    # auditoria de disco) no cubre la ventana; 7d deja margen sobre las 72 h.
    # Ingesta medida 2026-09-12: ~36 KB/s cluster (~3 GB/dia en crudo, chunks
    # comprimidos en el object store). Con OVH de destino, el disco de savage
    # deja de ser la pieza que vigilar.
    retention_period: 168h
    max_query_lookback: 168h
    # Do not accept samples that Loki can no longer retain or query.
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
  compactor:
    retention_enabled: true
    delete_request_store: s3
    # Intervalos conservadores heredados de la MinIO de sauvage (HDD RAID, el
    # ListObjects lo saturaba). Se mantienen con OVH: no hay medida que pida
    # bajarlos y el `retention_delete_worker_count` alto vuelve a castigar el
    # ancho de banda de subida de la casa.
    compaction_interval: 30m
    retention_delete_worker_count: 5

singleBinary:
  replicas: 1
  # INFRA-1175: las credenciales de `loki.storage.s3` se leen del entorno. Sin
  # `-config.expand-env=true` Loki tomaría literal el `${...}` y no escribiría
  # ningún chunk. El Secret lo materializa el ExternalSecret
  # `manifests/loki-ovh-creds.yaml` (ns `monitoring`).
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: loki-ovh-creds
  # 2026-10-27 (SC-2884): el GC de Go aprieta al acercarse a 2600MiB en vez de
  # dejar que el cgroup (limite 3Gi) mate al proceso. Go 1.24 (loki 3.6.7) lo soporta.
  extraEnv:
    - name: GOMEMLIMIT
      value: 2600MiB
  nodeSelector:
    node-pool: ks5-nvme
    kubernetes.io/arch: amd64
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
    enableStatefulSetAutoDeletePVC: true
    whenScaled: Retain
    whenDeleted: Retain
  # Survive accidental scale-to-zero during maintenance — the chart default
  # leaves the StatefulSet with whenScaled: Delete which destroys the PVC
  # (and all log history) when replicas drop to 0. Retain keeps the data.
  resources:
    requests:
      # 2026-09-13 (INFRA-42/INFRA-82): 100m -> 190m. p95 14d = 180m. SRE mide
      # el pod entero (110m = 100m + 10m sidecar loki-sc-rules); objetivo
      # 200m/pod => 190m aqui + 10m del sidecar.
      cpu: 190m
      # 2026-10-27 (SC-2884): 256Mi -> 1Gi. Working set medido: ~700-900Mi a las
      # 2h de arranque (Go heap vivo, no cache) y +25Mi/h. El request viejo dejaba
      # el pod Burstable con 4x su uso real reservado en el papel.
      memory: 1Gi
    limits:
      # 2026-10-27 (SC-2884): 2Gi -> 3Gi. OOMKilled (CONSTRAINT_MEMCG, journal de
      # ks5-cp-1 27-10 16:13Z) tras ~51h subiendo hasta el tope. Con GOMEMLIMIT
      # (abajo) el GC aprieta antes de que el cgroup mate al proceso.
      memory: 3Gi

gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false

test:
  enabled: false
lokiCanary:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: true
