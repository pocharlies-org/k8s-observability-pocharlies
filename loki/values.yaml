# Loki single-binary — logs stored in OVH Object Storage (S3 compatible)
# Helm chart: grafana/loki
# Index local in Longhorn PVC; chunks en el bucket OVH `loki-chunks-pocharlies`
# (INFRA-1175: antes, la MinIO de sauvage).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks-pocharlies
      ruler: loki-chunks-pocharlies
      admin: loki-chunks-pocharlies
    s3:
      # OVH Object Storage (región SBG, París). `s3ForcePathStyle` porque los
      # buckets de OVH no resuelven por subdominio.
      endpoint: s3.sbg.io.cloud.ovh.net
      region: sbg
      # El chart 7.0.0 NO tiene `existingSecret` para S3: estas dos claves se
      # expanden desde el entorno del contenedor (`-config.expand-env=true`), y
      # el entorno viene del Secret `loki-ovh-creds` que materializa el
      # ExternalSecret `manifests/loki-ovh-creds.yaml`. La credencial vive solo
      # en 1Password (item `ovh-object-storage-s3`).
      #
      # Las credenciales que había aquí estaban en claro en git (`dibanez` /
      # bootstrap) y se filtraban además al ConfigMap `loki` y al secret de
      # release de Helm: la rotación es de `security` (INFRA-1175, 47240).
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
  limits_config:
    # INFRA-43 (INFRA-23 H1): los enforces del AgentGateway exigen responder qué
    # principals llamaron una ruta en las últimas 72 h.
    #
    # RETENCIÓN BAJADA A 24 h por Dani el 2026-11-07 (INFRA-1175): «loki son logs,
    # no guardes más de 24 h». Con 168 h el bucket llegó a 250.342 objetos de
    # histórico; con 24 h, y tablas de índice de `period: 24h`, el compactor tira de
    # la tabla entera, que es la forma consistente de borrar. Nunca `rclone delete` a
    # mano por el bucket: índices apuntando a chunks borrados = consultas rotas.
    #
    # Lo que se pierde con 24 h, registrado: el enforce INFRA-43 / INFRA-23 H1 del
    # AgentGateway necesitaba responder qué principals llamaron una ruta en las
    # últimas 72 h. Esa ventana ya NO existe en Loki; o se saca de VictoriaMetrics, o
    # se suben estos tres valores a 72 h. Es decisión de Dani por coste, reversible.
    retention_period: 24h
    max_query_lookback: 24h
    # Coherente con la retención: no aceptar lo que Loki ya no puede retener ni consultar.
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
  # INFRA-1267 (SC-5058): retención por stream para longhorn-system, 14 días.
  # La retención global sigue en 24 h (decisión de Dani, INFRA-1175): NO subir
  # `retention_period`. El runtime-config del chart (clave `runtimeConfig`,
  # CM `loki-runtime`) se aplica por selector LogQL: solo los streams de
  # `longhorn-system` (longhorn-manager e instance-manager, ~92 líneas/h en
  # total) se retienen y consultan 336 h; el resto obedece los 24 h estáticos.
  # El compactor los borra por delete-request contra `delete_request_store: s3`
  # (ya configurado). Sin el flag `-runtime-config.file` de abajo Loki no lee
  # este fichero: el chart 7.0.0 lo monta pero NO añade el flag.
  # Coste: despreciable (el stream entero es < 1 MB/día).
  runtimeConfig:
    limits:
      per_stream:
        - selector: '{namespace="longhorn-system"}'
          limits:
            retention: 336h
            max_query_lookback: 336h
  compactor:
    retention_enabled: true
    delete_request_store: s3
    # Intervalos conservadores heredados de la MinIO de sauvage (HDD RAID, el
    # ListObjects lo saturaba): el `compaction_interval` se queda en 30 m por eso,
    # porque el ListObjects sigue siendo contra el object store. Los workers de
    # borrado suben al default del chart (10): el primer barrido tras bajar la
    # retención a 24 h tiene ~250k claves que eliminar y un DELETE contra OVH es
    # una petición de ~50 ms, no ancho de banda.
    compaction_interval: 30m
    retention_delete_worker_count: 10

singleBinary:
  replicas: 1
  # INFRA-1175: las credenciales de `loki.storage.s3` se leen del entorno. Sin
  # `-config.expand-env=true` Loki tomaría literal el `${...}` y no escribiría
  # ningún chunk. El Secret lo materializa el ExternalSecret
  # `manifests/loki-ovh-creds.yaml` (ns `monitoring`).
  extraArgs:
    - -config.expand-env=true
    # INFRA-1267: sin este flag el chart monta el CM `loki-runtime` en
    # /etc/loki/runtime-config pero Loki no lo carga (los args del chart solo
    # llevan config.file y target). Recarga cada 10 min por defecto.
    - -runtime-config.file=/etc/loki/runtime-config/runtime-config.yaml
  extraEnvFrom:
    - secretRef:
        name: loki-ovh-creds
  # 2026-10-27 (SC-2884): el GC de Go aprieta al acercarse a 2600MiB en vez de
  # dejar que el cgroup (limite 3Gi) mate al proceso. Go 1.24 (loki 3.6.7) lo soporta.
  extraEnv:
    - name: GOMEMLIMIT
      value: 2600MiB
  nodeSelector:
    node-pool: ks5-nvme
    kubernetes.io/arch: amd64
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
    enableStatefulSetAutoDeletePVC: true
    whenScaled: Retain
    whenDeleted: Retain
  # Survive accidental scale-to-zero during maintenance — the chart default
  # leaves the StatefulSet with whenScaled: Delete which destroys the PVC
  # (and all log history) when replicas drop to 0. Retain keeps the data.
  resources:
    requests:
      # 2026-09-13 (INFRA-42/INFRA-82): 100m -> 190m. p95 14d = 180m. SRE mide
      # el pod entero (110m = 100m + 10m sidecar loki-sc-rules); objetivo
      # 200m/pod => 190m aqui + 10m del sidecar.
      cpu: 190m
      # 2026-10-27 (SC-2884): 256Mi -> 1Gi. Working set medido: ~700-900Mi a las
      # 2h de arranque (Go heap vivo, no cache) y +25Mi/h. El request viejo dejaba
      # el pod Burstable con 4x su uso real reservado en el papel.
      memory: 1Gi
    limits:
      # 2026-10-27 (SC-2884): 2Gi -> 3Gi. OOMKilled (CONSTRAINT_MEMCG, journal de
      # ks5-cp-1 27-10 16:13Z) tras ~51h subiendo hasta el tope. Con GOMEMLIMIT
      # (abajo) el GC aprieta antes de que el cgroup mate al proceso.
      memory: 3Gi

gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false

test:
  enabled: false
lokiCanary:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: true
