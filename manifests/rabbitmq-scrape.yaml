---
# Scrape the shared-rabbitmq broker (the Synapse fabric bus) into VictoriaMetrics.
# Until now there were 0 `rabbitmq_*` series in VM — the broker incident was
# flown blind. vmagent has empty serviceScrape{,Namespace}Selector → it picks up
# these objects from any namespace; the objects live in `monitoring` and target
# the shared-rabbitmq Services in `databases`.
#
# The selector {component: shared-rabbitmq, managed-by: argocd} matches both the
# ClusterIP `shared-rabbitmq` Service and the `shared-rabbitmq-headless` Service
# (per-pod endpoints → per-node memory). It deliberately EXCLUDES
# `shared-rabbitmq-ext` (NodePort, no `managed-by` label and no `prometheus`
# port), making discovery deterministic.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: shared-rabbitmq
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: synapse-broker-metrics
spec:
  namespaceSelector:
    matchNames: ["databases"]
  selector:
    matchLabels:
      app.kubernetes.io/component: shared-rabbitmq
      app.kubernetes.io/managed-by: argocd
  endpoints:
    # /metrics -> broker-wide aggregate (memory, alarms, identity_info).
    - port: prometheus
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s
---
# /metrics/detailed -> per-queue series (labels vhost,queue). The `family`
# params bound cardinality to exactly what the alerts need: ready/unacked,
# consumer count and head_message_timestamp.
#
# 2026-09-21 (INFRA-214): `channel_queue_metrics` added. It exposes
# rabbitmq_detailed_channel_messages_delivered_total{queue=...} — the only
# per-queue "commands processed" counter this broker version emits (3.13.7:
# the queue_message_stats/queue_delivery_metrics families return zero series;
# verified against the live endpoint). It powers
# SkirmbooksInvoicingChainStalled: the 17..21-09 stall had consumers alive
# and queues empty, so backlog/head-age rules could not see it — only the
# flow through each hop of the ingest -> ocr -> classify -> posting chain
# distinguishes "quiet" from "broken chain". Cardinality measured on the
# live endpoint: ~200 series/node (only open consumer channels).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: shared-rabbitmq-detailed
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: synapse-broker-metrics
spec:
  namespaceSelector:
    matchNames: ["databases"]
  selector:
    matchLabels:
      app.kubernetes.io/component: shared-rabbitmq
      app.kubernetes.io/managed-by: argocd
  endpoints:
    - port: prometheus
      path: /metrics/detailed
      params:
        family:
          - queue_coarse_metrics
          - queue_consumer_count
          - queue_metrics
          - channel_queue_metrics
      interval: 30s
      scrapeTimeout: 25s
