# Cambia el catálogo de modelos del chat de Aurora por los aliases del LiteLLM.
#
# POR QUÉ UN POSTSTART INYECTADO POR POLICY Y NO ALGO MENOS RARO
#
# El desplegable "Choose Model" del chat NO sale de ningún endpoint: está
# hardcodeado en el bundle del frontend (array `B` en
# .next/static/chunks/app/chat/page-*.js) con cuatro modelos cloud
# (openai/gpt-5.5, anthropic/claude-sonnet-4.6, anthropic/claude-opus-4.7,
# google/gemini-3.1-pro-preview). Y la selección SÍ se aplica: main_chatbot.py
# la pasa a llm.py por encima de MAIN_MODEL, así que elegir cualquiera de ellos
# rompe el chat con "Provider 'openai' is not available" — aquí no hay ninguna
# key cloud, todo va por BEDROCK_BASE_URL → LiteLLM (verificado 2026-08-05
# dentro del pod: los cuatro ids stock fallan; bedrock/<alias> responde).
#
# Alternativas descartadas:
#   - values del chart: aurora-oss 1.2.16 no expone lifecycle/initContainers
#     ni nada equivalente para el frontend (frontend-deployment.yaml es rígido).
#   - Mutar el Deployment: el Application `aurora` tiene selfHeal, Argo lo
#     revertiría en bucle. Los Pods no los trackea, así que se muta el Pod.
#   - Forkear la imagen: mantener un build propio por 4 literales es peor.
#
# El postStart reescribe los cuatro objetos del catálogo por aliases LiteLLM
# vivos (verificados contra /v1/chat/completions con la key de Aurora el
# 2026-08-05). Es idempotente y falla en blando: si una versión futura del
# frontend cambia los literales, el script no encuentra nada, no toca nada y el
# desplegable vuelve al catálogo stock — sin tumbar el pod (|| true).
# Al subir la versión del chart, revisar que los literales sigan existiendo.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aurora-frontend-dgx-models
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    policies.kyverno.io/title: Selector de modelos de Aurora sobre LiteLLM
    policies.kyverno.io/category: Configuration
    policies.kyverno.io/description: >-
      El catálogo de modelos del chat de Aurora está hardcodeado en el bundle
      del frontend y ofrece modelos cloud sin credenciales. Esta policy inyecta
      un postStart que lo reescribe con los aliases reales del LiteLLM del DGX.
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: configuration
spec:
  # Sólo muta, no valida: nada que pueda rechazar un recurso.
  admission: true
  # background: false — los pods vivos no pueden cambiar de lifecycle (es
  # inmutable); basta con que los nuevos nazcan parcheados.
  background: false
  rules:
    - name: inject-model-catalog-patch
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  app.kubernetes.io/name: aurora-oss-frontend
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                      - aurora
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: aurora-frontend
                # `+(...)`: sólo si el contenedor no trae ya un lifecycle.
                +(lifecycle):
                  postStart:
                    exec:
                      command:
                        - /bin/sh
                        - -c
                        - |
                          cat > /tmp/patch-models.js <<"XEOF"
                          const fs = require("fs");
                          const path = require("path");
                          const REPLACEMENTS = [
                            [
                              '{id:"openai/gpt-5.5",name:"gpt-5.5",displayName:"GPT-5.5",provider:"OpenAI",tier:"premium",contextLength:"1M",hasReasoning:!0}',
                              '{id:"bedrock/tooling-ha",name:"tooling-ha",displayName:"Ornith 35B HA (DGX)",provider:"LiteLLM",tier:"premium",contextLength:"256K",hasReasoning:!0}',
                            ],
                            [
                              '{id:"anthropic/claude-sonnet-4.6",name:"claude-sonnet-4.6",displayName:"Claude Sonnet 4.6",provider:"Anthropic",tier:"pro",contextLength:"1M",hasReasoning:!0}',
                              '{id:"bedrock/router",name:"router",displayName:"Router DGX (auto)",provider:"LiteLLM",tier:"pro",contextLength:"256K",hasReasoning:!0}',
                            ],
                            [
                              '{id:"anthropic/claude-opus-4.7",name:"claude-opus-4.7",displayName:"Claude Opus 4.7",provider:"Anthropic",tier:"premium",contextLength:"1M",hasReasoning:!0,isSlow:!0}',
                              '{id:"bedrock/qwen36-35b",name:"qwen36-35b",displayName:"Qwen3.6 35B (DGX)",provider:"LiteLLM",tier:"premium",contextLength:"256K",hasReasoning:!0}',
                            ],
                            [
                              '{id:"google/gemini-3.1-pro-preview",name:"gemini-3.1-pro-preview",displayName:"Gemini 3.1 Pro",provider:"Google",tier:"pro",contextLength:"1M",hasReasoning:!0}',
                              '{id:"bedrock/dense-uncensored",name:"dense-uncensored",displayName:"Qwen3.6 27B Uncensored (DGX)",provider:"LiteLLM",tier:"pro",contextLength:"224K",hasReasoning:!0}',
                            ],
                          ];
                          const dir = "/app/.next/static/chunks/app/chat";
                          for (const f of fs.readdirSync(dir)) {
                            if (!f.endsWith(".js")) continue;
                            const p = path.join(dir, f);
                            let data = fs.readFileSync(p, "utf8");
                            if (data.includes('id:"bedrock/tooling-ha"')) continue;
                            let hits = 0;
                            for (const [oldS, newS] of REPLACEMENTS) {
                              if (data.includes(oldS)) { data = data.split(oldS).join(newS); hits++; }
                            }
                            if (hits > 0) fs.writeFileSync(p, data);
                          }
                          XEOF
                          node /tmp/patch-models.js || true
