# Cambia el catálogo de modelos del chat de Aurora por los aliases del LiteLLM.
#
# POR QUÉ UN POSTSTART INYECTADO POR POLICY Y NO ALGO MENOS RARO
#
# El desplegable "Choose Model" del chat NO sale de ningún endpoint: está
# hardcodeado en el bundle del frontend (array `B` en los chunks de app/chat)
# con cuatro modelos cloud (openai/gpt-5.5, anthropic/claude-sonnet-4.6,
# anthropic/claude-opus-4.7, google/gemini-3.1-pro-preview). Y la selección SÍ
# se aplica: main_chatbot.py la pasa a llm.py por encima de MAIN_MODEL, así que
# elegir cualquiera de ellos rompía el chat con "Provider 'openai' is not
# available" — aquí no hay ninguna key cloud, todo va por BEDROCK_BASE_URL →
# LiteLLM (verificado 2026-08-05 dentro del pod: los cuatro ids stock fallan;
# bedrock/<alias> responde).
#
# Alternativas descartadas:
#   - values del chart: aurora-oss 1.2.16 no expone lifecycle/initContainers
#     ni nada equivalente para el frontend (frontend-deployment.yaml es rígido).
#   - Mutar el Deployment: el Application `aurora` tiene selfHeal, Argo lo
#     revertiría en bucle. Los Pods no los trackea, así que se muta el Pod.
#   - Forkear la imagen: mantener un build propio por 4 literales es peor.
#
# 2026-08-10 — SE RETIRA `qwen36-35b` DEL SELECTOR. Era uno de los nueve alias del
# RESIDENTE de tooling, así que lo servía quien estuviera Ready (hoy
# DeepSeek-V4-Flash-0731) mientras el desplegable decía "Qwen3.6 35B (DGX)". Y
# además duplicaba a `tooling-ha`, que ya está en la primera entrada: dos opciones
# visibles, el mismo backend, y una con nombre de otro modelo. En su hueco va
# `agentic-ha`, que sí es una cadena distinta (qwen3-coder primero, luego el
# residente, luego dense) y por tanto una opción de verdad.
#
# Los `contextLength` de aquí siguen escritos a mano, pero desde el 2026-08-10 ya
# tienen fuente única: LiteLLM publica `max_input_tokens` de verdad en
# /v1/model/info (antes lo declaraba como `context_window`, que no es un campo de
# litellm y no lo leía nadie — de ahí que hubiera que hardcodearlos aquí).
#
# El postStart reescribe el catálogo con aliases LiteLLM vivos (verificados
# contra /v1/chat/completions con la key de Aurora) y añade además:
# las tres variantes GPT-5.6 (sol/terra/luna), que NO corren en el DGX — sale a chatgpt.com por el
# codex-bridge con la suscripción del usuario. Ese comparte cuota con el Codex
# interactivo y OpenAI estrangula por cliente, así que es para chat manual; los
# RCA siguen en los modelos locales.
#
# OJO — hay que parchear DOS sitios. `.next/static/chunks` es lo que descarga el
# navegador, pero `.next/server` es el bundle de SSR: con App Router el
# desplegable se pinta primero en el servidor, así que parchear solo el estático
# deja el catálogo viejo en el HTML inicial. Por eso el script recorre ambos.
#
# Es idempotente y falla en blando: si una versión futura del frontend cambia
# los literales, el script no encuentra nada, no toca nada y el desplegable
# vuelve al catálogo stock — sin tumbar el pod (|| true). Al subir la versión
# del chart, revisar que los literales sigan existiendo.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aurora-frontend-dgx-models
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    policies.kyverno.io/title: Selector de modelos de Aurora sobre LiteLLM
    policies.kyverno.io/category: Configuration
    policies.kyverno.io/description: >-
      El catálogo de modelos del chat de Aurora está hardcodeado en el bundle
      del frontend y ofrece modelos cloud sin credenciales. Esta policy inyecta
      un postStart que lo reescribe con los aliases reales del LiteLLM del DGX.
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: configuration
spec:
  # Sólo muta, no valida: nada que pueda rechazar un recurso.
  admission: true
  # background: false — los pods vivos no pueden cambiar de lifecycle (es
  # inmutable); basta con que los nuevos nazcan parcheados.
  background: false
  rules:
    - name: inject-model-catalog-patch
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  app.kubernetes.io/name: aurora-oss-frontend
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                      - aurora
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: aurora-frontend
                # `+(...)`: sólo si el contenedor no trae ya un lifecycle.
                +(lifecycle):
                  postStart:
                    exec:
                      command:
                        - /bin/sh
                        - -c
                        - |
                          cat > /tmp/patch-models.js <<"XEOF"
                          // Reescribe el catálogo de modelos del chat de Aurora con los del LiteLLM.
                          // Cubre el bundle de cliente Y el de servidor: con App Router el desplegable se
                          // pinta primero en SSR, así que parchear solo /static/chunks deja el catálogo
                          // viejo en el HTML inicial. Idempotente y no fatal.
                          const fs = require("fs");
                          const path = require("path");

                          const REPLACEMENTS = [
                            [
                              '{id:"openai/gpt-5.5",name:"gpt-5.5",displayName:"GPT-5.5",provider:"OpenAI",tier:"premium",contextLength:"1M",hasReasoning:!0}',
                              '{id:"bedrock/tooling-ha",name:"tooling-ha",displayName:"Tooling DGX (HA)",provider:"LiteLLM",tier:"premium",contextLength:"256K",hasReasoning:!0}',
                            ],
                            [
                              '{id:"anthropic/claude-sonnet-4.6",name:"claude-sonnet-4.6",displayName:"Claude Sonnet 4.6",provider:"Anthropic",tier:"pro",contextLength:"1M",hasReasoning:!0}',
                              '{id:"bedrock/router",name:"router",displayName:"Router DGX (auto)",provider:"LiteLLM",tier:"pro",contextLength:"256K",hasReasoning:!0}',
                            ],
                            [
                              '{id:"anthropic/claude-opus-4.7",name:"claude-opus-4.7",displayName:"Claude Opus 4.7",provider:"Anthropic",tier:"premium",contextLength:"1M",hasReasoning:!0,isSlow:!0}',
                              '{id:"bedrock/agentic-ha",name:"agentic-ha",displayName:"Agentic DGX (coder-first)",provider:"LiteLLM",tier:"premium",contextLength:"256K",hasReasoning:!0}',
                            ],
                            [
                              '{id:"google/gemini-3.1-pro-preview",name:"gemini-3.1-pro-preview",displayName:"Gemini 3.1 Pro",provider:"Google",tier:"pro",contextLength:"1M",hasReasoning:!0}',
                              '{id:"bedrock/dense-uncensored",name:"dense-uncensored",displayName:"Qwen3.6 27B Uncensored (DGX)",provider:"LiteLLM",tier:"pro",contextLength:"224K",hasReasoning:!0},{id:"bedrock/gpt-5.6-sol",name:"gpt-5.6-sol",displayName:"GPT-5.6 Sol (ChatGPT Pro)",provider:"OpenAI",tier:"premium",contextLength:"",hasReasoning:!0},{id:"bedrock/gpt-5.6-terra",name:"gpt-5.6-terra",displayName:"GPT-5.6 Terra (ChatGPT Pro)",provider:"OpenAI",tier:"premium",contextLength:"",hasReasoning:!0},{id:"bedrock/gpt-5.6-luna",name:"gpt-5.6-luna",displayName:"GPT-5.6 Luna (ChatGPT Pro)",provider:"OpenAI",tier:"premium",contextLength:"",hasReasoning:!0}',
                            ],
                          ];

                          const ROOTS = ["/app/.next/static/chunks", "/app/.next/server"];

                          function walk(dir, out) {
                            let entries;
                            try {
                              entries = fs.readdirSync(dir, { withFileTypes: true });
                            } catch (e) {
                              return out;
                            }
                            for (const entry of entries) {
                              const p = path.join(dir, entry.name);
                              if (entry.isDirectory()) walk(p, out);
                              else if (entry.name.endsWith(".js")) out.push(p);
                            }
                            return out;
                          }

                          let patched = 0;
                          for (const root of ROOTS) {
                            for (const file of walk(root, [])) {
                              let data;
                              try {
                                data = fs.readFileSync(file, "utf8");
                              } catch (e) {
                                continue;
                              }
                              if (data.indexOf('displayName:"GPT-5.5"') === -1) continue;
                              if (data.indexOf('id:"bedrock/tooling-ha"') !== -1) continue;
                              let hits = 0;
                              for (const [oldS, newS] of REPLACEMENTS) {
                                if (data.includes(oldS)) {
                                  data = data.split(oldS).join(newS);
                                  hits++;
                                }
                              }
                              if (hits > 0) {
                                fs.writeFileSync(file, data);
                                console.log("PATCHED " + file + " (" + hits + "/4)");
                                patched++;
                              }
                            }
                          }
                          console.log("total ficheros parcheados: " + patched);
                          XEOF
                          node /tmp/patch-models.js || true
