# Secretos de Aurora, todos desde Vault vía ESO. Ninguno en git.
#
# OJO con los dos usos de Vault que tiene Aurora, que NO son el mismo sitio:
#
#   secret/aurora  -> secretos de arranque que lee ESO (este fichero). Tienen que
#                     vivir en el mount `secret` porque el ClusterSecretStore
#                     vault-backend está anclado ahí.
#   aurora/        -> mount KV v2 propio de Aurora en runtime (VAULT_KV_MOUNT),
#                     donde guarda credenciales de integraciones. Su token está
#                     acotado por política a `aurora/*`, así que ni con el token
#                     en la mano puede leer los secretos del resto del clúster.
#
# El prefijo `aurorasvc-` y no `aurora-` es deliberado, por el mismo motivo que
# en keep-secrets.yaml: evita colisionar con los nombres que compone el chart.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurorasvc-db
  namespace: aurora
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: database
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aurorasvc-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        POSTGRES_USER: "{{ .db_user }}"
        POSTGRES_PASSWORD: "{{ .db_password }}"
  data:
    - secretKey: db_user
      remoteRef: { key: secret/aurora, property: DB_USER }
    - secretKey: db_password
      remoteRef: { key: secret/aurora, property: DB_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurorasvc-backend
  namespace: aurora
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: backend
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aurorasvc-backend
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Token acotado a `aurora/*`, periódico (768h) y renovable.
        VAULT_TOKEN: "{{ .vault_token }}"
        # Usuario propio de MinIO con política sólo sobre el bucket `aurora`.
        STORAGE_ACCESS_KEY: "{{ .storage_access_key }}"
        STORAGE_SECRET_KEY: "{{ .storage_secret_key }}"
        GITHUB_AUTH_MODE: "app"
        # ------------------------------------------------------------------
        # GitHub App «Aurora RCA» (org pocharlies-org, app_id 4498186).
        #
        # Sin estas cuatro variables, el conector de GitHub de Aurora ni
        # aparece: su config.py las exige (github_connector/config.py:37-40) y
        # el diálogo de la UI se queda con un botón «Close» y nada más, que es
        # exactamente lo que pasaba hasta hoy — el log decía
        # `github_app_status=disabled missing=[...]`.
        #
        # La App se creó con el App Manifest flow, no a mano: GitHub NO tiene
        # API para crear Apps, sólo su UI o ese flujo, que devuelve app_id,
        # client_id, private key y webhook secret de una vez al canjear el
        # `code` en /app-manifests/{code}/conversions.
        #
        # PERMISOS TODOS DE LECTURA (metadata, contents, deployments, actions,
        # pull_requests, issues, checks, statuses). Coherente con la postura
        # del estate: Aurora investiga, no actúa — sin PRs automáticos, sin
        # ejecutores, igual que los CronJobs de autoheal siguen suspendidos.
        # El WEBHOOK_URL y el SETUP_URL no son secretos y podrían ir en
        # values.yaml, pero se ponen aquí para que las cinco variables del
        # conector vivan juntas y no se desincronicen.
        # ------------------------------------------------------------------
        GITHUB_APP_ID: "{{ .gh_app_id }}"
        GITHUB_APP_CLIENT_ID: "{{ .gh_client_id }}"
        GITHUB_APP_CLIENT_SECRET: "{{ .gh_client_secret }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .gh_private_key }}"
        GITHUB_APP_WEBHOOK_SECRET: "{{ .gh_webhook_secret }}"
        GITHUB_APP_WEBHOOK_URL: "https://aurora.e-dani.com/github/webhook"
        GITHUB_APP_SETUP_URL: "https://aurora.e-dani.com/github/app/install/callback"
  data:
    - secretKey: vault_token
      remoteRef: { key: secret/aurora, property: VAULT_TOKEN }
    - secretKey: storage_access_key
      remoteRef: { key: secret/aurora, property: STORAGE_ACCESS_KEY }
    - secretKey: storage_secret_key
      remoteRef: { key: secret/aurora, property: STORAGE_SECRET_KEY }
    # Ruta propia y no `secret/aurora`: estas cinco se regeneran juntas si
    # alguna vez hay que recrear la App, y separarlas evita tocar el resto.
    - secretKey: gh_app_id
      remoteRef: { key: secret/aurora-github, property: GITHUB_APP_ID }
    - secretKey: gh_client_id
      remoteRef: { key: secret/aurora-github, property: GITHUB_APP_CLIENT_ID }
    - secretKey: gh_client_secret
      remoteRef: { key: secret/aurora-github, property: GITHUB_APP_CLIENT_SECRET }
    - secretKey: gh_private_key
      remoteRef: { key: secret/aurora-github, property: GITHUB_APP_PRIVATE_KEY }
    - secretKey: gh_webhook_secret
      remoteRef: { key: secret/aurora-github, property: GITHUB_APP_WEBHOOK_SECRET }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurorasvc-app
  namespace: aurora
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: app
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aurorasvc-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        FLASK_SECRET_KEY: "{{ .flask_secret_key }}"
        AUTH_SECRET: "{{ .auth_secret }}"
        SEARXNG_SECRET: "{{ .searxng_secret }}"
        INTERNAL_API_SECRET: "{{ .internal_api_secret }}"
  data:
    - secretKey: flask_secret_key
      remoteRef: { key: secret/aurora, property: FLASK_SECRET_KEY }
    - secretKey: auth_secret
      remoteRef: { key: secret/aurora, property: AUTH_SECRET }
    - secretKey: searxng_secret
      remoteRef: { key: secret/aurora, property: SEARXNG_SECRET }
    - secretKey: internal_api_secret
      remoteRef: { key: secret/aurora, property: INTERNAL_API_SECRET }
---
# La "API key de Bedrock" es en realidad la master key de LiteLLM: en gateway
# mode Aurora construye un ChatOpenAI contra BEDROCK_BASE_URL y manda esto como
# bearer. Nada de AWS por aquí.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurorasvc-llm
  namespace: aurora
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: llm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aurorasvc-llm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        BEDROCK_API_KEY: "{{ .litellm_key }}"
  data:
    - secretKey: litellm_key
      remoteRef: { key: secret/aurora, property: LITELLM_KEY }
