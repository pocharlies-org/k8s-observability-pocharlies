apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-service-visibility
  namespace: monitoring
spec:
  groups:
    - name: pocharlies.service-visibility
      rules:
        - alert: BlackboxProbeDown
          expr: probe_success{job=~"k8s-.*"} == 0
          for: 2m
          labels:
            severity: warning
            area: availability
          annotations:
            summary: "Endpoint probe is failing"
            description: "{{ $labels.instance }} has failed blackbox probes for more than 2 minutes."
        - alert: KubernetesDeploymentUnavailable
          expr: |
            (kube_deployment_spec_replicas > kube_deployment_status_replicas_available)
              unless on(namespace, deployment)
            kube_deployment_spec_replicas{namespace="llm",deployment=~"vllm-.*|omnivoice-tts-dgx2|.*-bench"}
          for: 15m
          labels:
            severity: critical
            area: kubernetes
          annotations:
            summary: "Deployment unavailable"
            description: "{{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired."
        - alert: LlmResidentDeploymentUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace="llm",deployment=~"vllm-.*-dgx1|vllm-.*-dgx2|omnivoice-tts-dgx2"}
              >
            kube_deployment_status_replicas_available{namespace="llm",deployment=~"vllm-.*-dgx1|vllm-.*-dgx2|omnivoice-tts-dgx2"}
          for: 2h
          labels:
            severity: critical
            area: kubernetes
            workload_class: gpu-llm
          annotations:
            summary: "LLM resident deployment unavailable"
            description: "{{ $labels.namespace }}/{{ $labels.deployment }} is still unavailable after 2 hours; inspect GPU scheduling, model startup and competing bench workloads."
        # A service that is *scaled to zero* is invisible to every rule above:
        # they all compare spec > available, which at spec=0 evaluates 0 > 0 and
        # can never fire. That blind spot hid two outages in July 2026 — the
        # OmniVoice TTS/STT pair for six days and the DGX1 BGE pair for 5d15h —
        # both left behind by an abandoned "RHO benchmark isolation" window
        # (replicas: 0 committed to git, plus a KEDA activationThreshold of 2 on
        # a trigger query bounded to 0..1, which reads as Ready and unpaused
        # while pinning the target at zero). Watch the declared replica count
        # itself, so "someone switched it off and walked away" pages like any
        # other outage.
        #
        # The list is an explicit allowlist by design: 14 of the 23 llm
        # Deployments sit at zero legitimately (alternative model profiles,
        # canaries, retired node variants), so a namespace-wide "== 0" would be
        # pure noise. Add a Deployment here only when zero is never correct.
        # bge-m3-embedding and bge-reranker are the DGX1 halves, pinned to
        # minReplicaCount: 1; if their VRAM gate is ever re-armed (min: 0), drop
        # them from this list and let LlmPoolCapabilityUnavailable cover them.
        - alert: LlmResidentScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="llm",deployment=~"omnivoice-audio|omnivoice-tts-dgx2|stt-turbo|bge-m3-embedding|bge-reranker"} == 0
          for: 15m
          labels:
            severity: critical
            area: kubernetes
            workload_class: llm-resident
          annotations:
            summary: "Resident LLM service scaled to zero"
            description: "{{ $labels.namespace }}/{{ $labels.deployment }} has been declared with 0 replicas for 15 minutes, which is never correct for this service. Check git on the branch the ai Application is pinned to, the KEDA ScaledObject (activationThreshold vs the range its query can actually produce) and whether the ArgoCD pin was rolled back to an older revision."
        # The BGE embedder and reranker run active-active across both GB10 nodes
        # behind a single pool Service, and the DGX2 half is deliberately
        # preemptible — the gpu_arbiter retires it to free the GPU for
        # ComfyUI/Trellis — so a per-Deployment alert on that half would be
        # noise. What matters is the capability. On 2026-07-21 both halves were
        # down simultaneously for ~8 minutes (DGX1 parked at zero by the
        # isolation window, DGX2 preempted) and nothing noticed, because there
        # is no CPU fallback since 2026-07-03. Alert on the sum, not the parts.
        - alert: LlmPoolCapabilityUnavailable
          expr: |
            sum by (pool) (
              label_replace(
                kube_deployment_status_replicas_available{namespace="llm",deployment=~"bge-m3-embedding|bge-m3-embedding-dgx2"},
                "pool", "bge-embedding", "deployment", ".*"
              )
              or
              label_replace(
                kube_deployment_status_replicas_available{namespace="llm",deployment=~"bge-reranker|bge-reranker-dgx2"},
                "pool", "bge-reranker", "deployment", ".*"
              )
            ) == 0
          for: 5m
          labels:
            severity: critical
            area: kubernetes
            workload_class: llm-pool
          annotations:
            summary: "LLM pool has no serving replica on any node"
            description: "The {{ $labels.pool }} pool has zero available replicas across both GB10 nodes, so its Service has no endpoints and there is no CPU fallback. Everything that embeds or reranks (brain, litellm, openclaw) is failing. Check the KEDA ScaledObjects on both nodes and whether the gpu_arbiter has preempted the DGX2 half while the DGX1 half was already down."
        - alert: KubernetesStatefulSetUnavailable
          expr: kube_statefulset_replicas > kube_statefulset_status_replicas_ready
          for: 5m
          labels:
            severity: critical
            area: kubernetes
          annotations:
            summary: "StatefulSet unavailable"
            description: "{{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired."
        - alert: KubernetesDaemonSetUnavailable
          expr: kube_daemonset_status_desired_number_scheduled > kube_daemonset_status_number_ready
          for: 10m
          labels:
            severity: warning
            area: kubernetes
          annotations:
            summary: "DaemonSet unavailable"
            description: "{{ $labels.namespace }}/{{ $labels.daemonset }} has nodes without a ready daemon pod."
        - alert: Dgx2GpuMemoryWarning
          expr: dgx_gpu_memory_used_bytes{node="gx10-ec3d",index="0"} >= 107374182400
          for: 0m
          labels:
            severity: warning
            area: gpu
            workload_class: gpu-hybrid
          annotations:
            summary: "DGX2 GPU memory reached the 100 GiB warning threshold"
            description: "DGX2 is using {{ $value | humanize1024 }}B of unified GPU memory. The hybrid GPU arbiter cutoff is 105 GiB."
        - alert: Dgx2GpuMemoryCutoff
          expr: dgx_gpu_memory_used_bytes{node="gx10-ec3d",index="0"} >= 112742891520
          for: 0m
          labels:
            severity: critical
            area: gpu
            workload_class: gpu-hybrid
          annotations:
            summary: "DGX2 GPU memory reached the 105 GiB cutoff"
            description: "DGX2 is using {{ $value | humanize1024 }}B of unified GPU memory. The arbiter must abort the active on-demand workload and keep or restore dense."
        - alert: KubeHpaMaxedOut
          expr: |
            (
              kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics"}
                == kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"}
            )
            and on(namespace, horizontalpodautoscaler, cluster)
            (
              kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"}
                != kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics"}
            )
            and on(namespace, horizontalpodautoscaler, cluster)
            (
              kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",condition="ScalingLimited",status="true"} == 1
            )
          for: 15m
          labels:
            severity: warning
            area: kubernetes
          annotations:
            summary: "HPA is capped at max replicas"
            description: "{{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} is at max replicas and Kubernetes reports ScalingLimited=True for more than 15 minutes."
        - alert: NodeDiskIOSaturation
          expr: |
            (
              rate(node_disk_io_time_weighted_seconds_total{job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m]) > 10
            )
            and on (instance, device)
            (
              rate(node_disk_io_time_seconds_total{job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m]) > 0.8
            )
          for: 30m
          labels:
            severity: warning
            area: node
          annotations:
            summary: "Disk IO saturation is sustained"
            description: "{{ $labels.instance }} {{ $labels.device }} has both a high IO queue and >80% IO busy time for more than 30 minutes. This is actionable saturation, not just queued writes on a slow disk."
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-synapse
  namespace: monitoring
spec:
  groups:
    - name: pocharlies.synapse
      rules:
        # NOT about alert delivery any more: alerts go straight to Keep
        # in-cluster and Synapse is out of that path entirely. What this still
        # watches is the edge for the BUSINESS webhooks — synapse.e-dani.com is
        # the only ingress for Shopify / Stripe / Telegram / Gmail / WhatsApp
        # deliveries, and it is the only probe on that host, so it stays.
        # The probed path moved off /webhooks/alertmanager (retired with the
        # alerting plane) onto /webhooks/stripe, which is POST-only and answers
        # 405 — see the http_synapse_edge module in blackbox/values.yaml.
        - alert: SynapseDown
          expr: probe_success{job="synapse-gateway"} == 0
          for: 2m
          labels:
            severity: critical
            area: availability
            component: synapse
          annotations:
            summary: "Synapse gateway unreachable at the edge — business webhooks are being lost"
            description: "synapse.e-dani.com is not answering on the gateway's webhook prefix for >2m, so Shopify / Stripe / Telegram / Gmail / WhatsApp deliveries are being dropped at the edge. Alert delivery is NOT affected: that goes to Keep in-cluster. Check deploy/synapse-gateway in the synapse namespace and the traefik-edge IngressRoute edge-synapse-legacy."
---
# Synapse CORE health: the two singleton control-plane pods (engine +
# dispatcher) plus the transactional outbox and the dead-letter graveyard.
# SynapseDown above only probes the gateway from the edge. These
# rules watch the actual fabric: the engine that schedules workflows, the
# dispatcher that drains the Postgres outbox onto RabbitMQ, and the DLQ
# backlog. Series confirmed live in VM 2026-07-22 (roadmap D2, after R1
# made the core series scrapeable).
#
# Real label pins (VM query, ns synapse):
#   job="synapse-engine"      (svc synapse-engine, 1 replica, :9103)
#   job="synapse-dispatcher"  (svc synapse-dispatcher, 1 replica, :9102)
# Both are singletons: no HPA, no dedup needed on synapse_* series.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-synapse-core
  namespace: monitoring
spec:
  groups:
    - name: pocharlies.synapse-core
      rules:
        # --- critical: control-plane singletons ---------------------------
        # Either singleton missing from scrape (pod gone / crashloop before
        # the metrics server binds) OR present-but-down. absent() covers the
        # "series vanished" case that a bare `== 0` cannot see. Routed to the
        # direct emergency-telegram leg (see alertmanager-config.yaml): the
        # engine/dispatcher being down degrades the very pipeline that would
        # otherwise render the alert card, so delivery must not depend on it.
        - alert: SynapseCoreAbsent
          expr: |
            absent(up{job="synapse-engine"})
            or absent(up{job="synapse-dispatcher"})
            or (up{job=~"synapse-engine|synapse-dispatcher"} == 0)
          for: 3m
          labels:
            severity: critical
            area: availability
            component: synapse
          annotations:
            summary: "Synapse core singleton down (engine/dispatcher)"
            description: "synapse-engine and/or synapse-dispatcher is absent from scrape or reporting up==0 for >3m (job label on this alert names the affected side; absent() legs carry only the matched job). The control plane is degraded: engine=workflow scheduling, dispatcher=outbox drain onto RabbitMQ. Check `kubectl -n synapse get pods -l 'app in (synapse-engine,synapse-dispatcher)'` and the pod logs/events."
        # Dispatcher alive but the outbox is NOT draining: zero publishes over
        # 15m WHILE there is live (non-exhausted) backlog waiting. The backlog
        # guard is deliberate — an idle-but-healthy dispatcher legitimately
        # publishes nothing, so depth>0 is what turns silence into an alert.
        # synapse_outbox_unpublished_rows is an in-process dispatcher gauge and
        # DISAPPEARS on a dispatcher restart until the next outbox sweep
        # repopulates it (observed 2026-07-22): when absent the right operand
        # is empty and the whole expr is empty — fail-safe, no false page. Also
        # routed to emergency-telegram (a stuck outbox blocks event delivery).
        - alert: SynapseDispatcherNotPublishing
          expr: |
            sum(rate(synapse_dispatcher_published_total[15m])) == 0
            and
            sum(synapse_outbox_unpublished_rows{exhausted="false"}) > 0
          for: 10m
          labels:
            severity: critical
            area: messaging
            component: synapse
          annotations:
            summary: "Synapse dispatcher not draining outbox despite backlog"
            description: "synapse-dispatcher published 0 events in 15m while the transactional outbox holds unexhausted (still-retryable) rows. Events are being written but never reach RabbitMQ. Check the dispatcher pod (publisher channel / broker connection) and RabbitmqMemoryAlarmActive (a publish-block would also stall this)."
        # --- warning: scheduled workflows ---------------------------------
        # synapse_engine_scheduled_workflow_last_success_timestamp_seconds is a
        # per-(tenant,workflow) in-process gauge on the engine. Two restart
        # guards, both required, both validated against a live engine restart
        # 21m before authoring (uptime 1273s, expr correctly empty):
        #   1) `> 0` filter drops any child series that reset to 0 (a workflow
        #      that has never succeeded since process start), which would else
        #      read as `time()-0` ~ 1.7e9s and page instantly.
        #   2) engine-uptime guard (kube_pod_container_state_started, KSM):
        #      only alert once the engine has been up longer than the stall
        #      threshold, so a fresh restart that has not yet re-run a workflow
        #      cannot page. process_start_time_seconds is NOT exported by these
        #      pods (verified absent in VM), hence the KSM container-start gauge.
        # Threshold 3h = 3x the SLOWEST current cadence (all 14 scheduled
        # workflows run hourly-or-faster: */15, */20, */30, and :NN hourly).
        # CAVEAT: any future scheduled workflow with a cadence > ~2h will
        # false-positive here and must be excluded with a workflow!~"..."
        # matcher (or its own longer-threshold rule).
        - alert: SynapseScheduledWorkflowStalled
          expr: |
            (
              time()
              - max by (tenant, workflow) (
                  synapse_engine_scheduled_workflow_last_success_timestamp_seconds > 0
                )
            ) > 10800
            and on ()
            (
              time()
              - max(
                  kube_pod_container_state_started{
                    namespace="synapse", pod=~"synapse-engine-.*", container="engine"
                  }
                )
            ) > 10800
          for: 15m
          labels:
            severity: warning
            area: reliability
            component: synapse
          annotations:
            summary: "Synapse scheduled workflow {{ $labels.tenant }}/{{ $labels.workflow }} stalled"
            description: "Scheduled workflow {{ $labels.workflow }} (tenant {{ $labels.tenant }}) has not recorded a success in over 3h, and the engine has been up longer than that (so this is a real stall, not a restart artifact). Check the engine scheduler and the workflow's handler logs. NOTE: assumes sub-3h cadence; a workflow scheduled less often than that must be excluded from this rule."
        # --- warning: transactional outbox --------------------------------
        # Exhausted rows = events that hit max retries and are stuck in the
        # outbox (a poison payload or a permanently-failing publish). Any
        # exhausted row is actionable. COORDINATION (2026-07-22 go-live): the
        # outbox currently holds ~430 exhausted rows (tenant=system) + 1
        # (skirmshop) of stale sediment, so this WILL fire on first repopulation
        # after the current dispatcher restart. That is intended — the D2 triage
        # drains the graveyard to 0 in parallel and the alert then clears. If it
        # is still firing days later, the graveyard was never triaged.
        - alert: SynapseOutboxExhausted
          expr: sum by (tenant) (synapse_outbox_unpublished_rows{exhausted="true"}) > 0
          for: 15m
          labels:
            severity: warning
            area: messaging
            component: synapse
          annotations:
            summary: "Synapse outbox has exhausted (dead) rows — tenant {{ $labels.tenant }}"
            description: "{{ $value }} exhausted outbox row(s) for tenant {{ $labels.tenant }} — events that exceeded max publish retries and are now stuck (poison payload or permanent publish failure). Inspect the synapse outbox table and re-drive or discard. Baseline at D2 go-live was ~430 (system) + 1 (skirmshop) of sediment being triaged to 0 in parallel."
        # Oldest unpublished row aging past 15m. This metric has NO exhausted
        # split (only a tenant label), so while the ~430 exhausted-sediment rows
        # exist it fires on that sediment (oldest ~467h) alongside
        # SynapseOutboxExhausted; once the graveyard is triaged to 0 it becomes
        # a clean "a LIVE unpublished row has been stuck > 15m" head-of-line
        # signal. Absent on dispatcher restart (in-process gauge) -> no false
        # page. for: 15m so a normal drain latency does not trip it.
        - alert: SynapseOutboxOldestStale
          expr: max by (tenant) (synapse_outbox_oldest_unpublished_age_seconds) > 900
          for: 15m
          labels:
            severity: warning
            area: messaging
            component: synapse
          annotations:
            summary: "Synapse outbox oldest unpublished row is stale — tenant {{ $labels.tenant }}"
            description: "The oldest unpublished outbox row for tenant {{ $labels.tenant }} has been waiting {{ $value | humanizeDuration }} (>15m). Until the exhausted-row sediment is triaged this reflects that sediment; afterwards it means a live event is not draining. Cross-check SynapseOutboxExhausted and SynapseDispatcherNotPublishing."
        # --- warning: DLQ graveyard ---------------------------------------
        # Total dead-letter depth backstop, complementary to RabbitmqDlqGrowth
        # (which catches per-queue GROWTH over 6h). DEDUP IS MANDATORY: every
        # DLQ series is scraped by BOTH the shared-rabbitmq and
        # shared-rabbitmq-headless jobs, so a naive sum() double-counts
        # (564 vs the real 282). `sum(max by (queue) (...))` collapses the two
        # jobs back to the true per-queue depth. Threshold 350 sits above the
        # 2026-07-22 baseline of 282 sediment messages (~68 headroom): only a
        # bulk NEW dead-lettering event trips it, so the standing graveyard does
        # not nag. repeat 24h on its dedicated route (alertmanager-config.yaml).
        - alert: SynapseDLQBacklog
          expr: |
            sum(
              max by (queue) (
                rabbitmq_detailed_queue_messages_ready{vhost="/synapse", queue=~"dlq\\..+"}
              )
            ) > 350
          for: 15m
          labels:
            severity: warning
            area: messaging
            component: synapse
          annotations:
            summary: "Synapse DLQ total backlog high ({{ $value }} messages)"
            description: "Total ready messages across all /synapse dlq.* queues exceeded 350 (deduped across the two rabbitmq scrape jobs; baseline sediment ~282). A handler is dead-lettering in bulk. Use RabbitmqDlqGrowth to find the growing queue, then inspect that adapter's logs and the DLQ payloads."
        # --- warning: core adapters ---------------------------------------
        # The four control-critical adapters that must always have a target up.
        # telegram is EXCLUDED on purpose: synapse-adapter-telegram runs at
        # replicas=0 by design (no such scrape target exists), so any liveness
        # rule on it would be permanently firing. Uses == 0 (not absent) so a
        # legitimately-scaled-to-zero adapter does not page; a scheduled adapter
        # reporting down for 10m does.
        - alert: SynapseAdapterTargetDown
          expr: |
            up{
              namespace="synapse",
              job=~"synapse-adapter-(reminders|gmail|shopify|whatsapp)"
            } == 0
          for: 10m
          labels:
            severity: warning
            area: availability
            component: synapse
          annotations:
            summary: "Synapse adapter down: {{ $labels.job }}"
            description: "{{ $labels.job }} ({{ $labels.pod }}) has reported up==0 for >10m. That control-critical adapter is not serving. Check `kubectl -n synapse get pods` and the pod logs. (telegram is intentionally not watched here: replicas=0 by design.)"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-k8s-cronjobs
  namespace: monitoring
spec:
  groups:
    - name: pocharlies.k8s-cronjobs
      rules:
        # Fires only when Kubernetes has marked a CronJob-owned Job as failed
        # and no newer successful run exists for the same CronJob. This avoids
        # false positives where a Job has a failed pod attempt, is still
        # retrying, or the next scheduled run has already recovered.
        #
        # The cron-alert-analyzer receives the webhook, fetches the pod logs via
        # the k8s API, runs an LLM root-cause analysis via LiteLLM,
        # and posts the report to the Telegram "Crons" topic with a deep-link
        # to the dashboard and Telegram action buttons.
        # severity:warning (NOT critical) so this does NOT also fire the
        # severity=critical → telegram-backup route (which would duplicate the
        # alert in the General topic without LLM analysis).
        - alert: K8sCronJobFailed
          expr: |
            (
              (
                max by (namespace, job_name) (kube_job_failed{condition="true"} == 1)
                and on (namespace, job_name)
                max by (namespace, job_name) (kube_job_status_start_time > time() - 3600)
              )
              * on (namespace, job_name) group_left(owner_name)
                max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob"})
            )
            unless on (namespace, owner_name)
            (
              max by (namespace, owner_name) (
                (
                  max by (namespace, job_name) (kube_job_status_start_time)
                  * on (namespace, job_name)
                    max by (namespace, job_name) (kube_job_status_succeeded > 0)
                )
                * on (namespace, job_name) group_left(owner_name)
                  max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob"})
              )
              > on (namespace, owner_name)
              max by (namespace, owner_name) (
                (
                  max by (namespace, job_name) (kube_job_status_start_time)
                  * on (namespace, job_name)
                    max by (namespace, job_name) (kube_job_failed{condition="true"} == 1)
                )
                * on (namespace, job_name) group_left(owner_name)
                  max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob"})
              )
            )
          # Give frequent CronJobs one natural retry window before paging. A
          # newer success still clears the expression immediately via the
          # `unless` above; persistent failures continue to alert.
          for: 15m
          labels:
            severity: warning
            area: kubernetes
            domain: crons
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.owner_name }} failed"
            description: "Job {{ $labels.job_name }} owned by CronJob {{ $labels.namespace }}/{{ $labels.owner_name }} has failed. The cron-alert-analyzer will post a root-cause analysis to the Telegram 'Crons' topic."
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-rabbitmq
  namespace: monitoring
spec:
  groups:
    - name: pocharlies.rabbitmq
      rules:
        # The shared-rabbitmq broker is the Synapse fabric bus. Before these
        # rules there were 0 rabbitmq_* series in VM (see manifests/
        # rabbitmq-scrape.yaml) so the broker incident was invisible. The 19
        # functional queues being moved to quorum (engine.*, gestoria, webhooks,
        # messaging.send) need head-of-line and memory visibility. The single
        # root cause of the incident was: consumer stuck -> backlog -> memory
        # watermark -> publishers blocked.
        #
        # Per-queue alerts EXCLUDE buffers without a consumer by design:
        # dlq.*, archive.* and the catch-all parent queues. These are sinks,
        # not work queues; a backlog or zero-consumer there is expected.

        # --- critical: broker-wide ---------------------------------------
        - alert: RabbitmqMemoryAlarmActive
          # RabbitMQ has tripped its own memory high-watermark alarm and is
          # blocking publishers cluster-wide. This is the terminal state of
          # the original incident.
          expr: rabbitmq_alarms_memory_used_watermark == 1
          for: 0m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ memory alarm active — publishers blocked"
            description: "shared-rabbitmq node {{ $labels.rabbitmq_node }} has tripped the memory high-watermark alarm. Publishers are throttled/blocked. Drain the offending queue (check RabbitmqUnackedStuck / RabbitmqQueueBacklogHigh) and inspect consumers on sauvage."
        - alert: RabbitmqMemoryHigh
          # Resident memory above 80% of the configured watermark
          # (1.8 GB). Pages before the hard alarm so there is time to react.
          expr: |
            (
              rabbitmq_process_resident_memory_bytes
                / rabbitmq_resident_memory_limit_bytes
            ) > 0.80
          for: 10m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ resident memory >80% of watermark"
            description: "shared-rabbitmq node {{ $labels.rabbitmq_node }} resident memory has been above 80% of the 1.8 GB watermark for 10m. Approaching the publish-blocking alarm. Identify the growing queue before it trips."
        - alert: RabbitmqUnackedStuck
          # Unacked messages piling up while consumers are present == a
          # consumer that took messages but is not acking (the exact failure
          # mode of the incident). Buffers excluded.
          expr: |
            (
              rabbitmq_detailed_queue_messages_unacked{
                vhost="/synapse",
                queue!~"dlq\\..+|archive\\..+|adapter\\.[^.]+"
              } > 100
            )
            and on (vhost, queue)
            (
              rabbitmq_detailed_queue_consumers{
                vhost="/synapse",
                queue!~"dlq\\..+|archive\\..+|adapter\\.[^.]+"
              } > 0
            )
          for: 15m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ queue {{ $labels.queue }} has stuck unacked messages"
            description: "Queue {{ $labels.queue }} (vhost {{ $labels.vhost }}) has >100 unacked messages with consumers present for 15m. A consumer is holding deliveries without acking — head-of-line block. Inspect the consumer (systemd --user on sauvage)."
        - alert: RabbitmqHeadMessageStale
          # The oldest message in the queue has been sitting unconsumed for
          # >30m. head_message_timestamp only exists when there are messages,
          # so an empty queue does not false-positive.
          expr: |
            (
              time() - (
                rabbitmq_detailed_queue_head_message_timestamp{
                  vhost="/synapse",
                  queue!~"dlq\\..+|archive\\..+|adapter\\.[^.]+"
                } / 1000
              )
            ) > 1800
          for: 10m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ queue {{ $labels.queue }} head message is stale"
            description: "The oldest message in {{ $labels.queue }} (vhost {{ $labels.vhost }}) has been unconsumed for over 30 minutes. Consumer is stalled or absent — messages are aging at the head of the line."
        - alert: RabbitmqScrapeMissing
          # The broker scrape itself is gone. Without this the whole rule set
          # is silently blind — which is precisely how the incident happened.
          expr: |
            absent(rabbitmq_identity_info{rabbitmq_node=~".*shared-rabbitmq.*"})
          for: 5m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ broker metrics are missing"
            description: "No rabbitmq_identity_info series for shared-rabbitmq for 5m. The broker scrape (manifests/rabbitmq-scrape.yaml) is failing or the broker is down. All other RabbitMQ alerts are blind until this is fixed."

        # --- warning: per-queue health -----------------------------------
        - alert: RabbitmqQueueBacklogHigh
          # A large ready backlog on a functional queue. Not yet a memory
          # alarm, but trending there. Buffers excluded.
          expr: |
            rabbitmq_detailed_queue_messages_ready{
              vhost="/synapse",
              queue!~"dlq\\..+|archive\\..+|adapter\\.[^.]+"
            } > 10000
          for: 15m
          labels:
            severity: warning
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ queue {{ $labels.queue }} backlog is high"
            description: "Queue {{ $labels.queue }} (vhost {{ $labels.vhost }}) has >10000 ready messages for 15m. Consumers are not keeping up — check throughput and scaling before it pressures broker memory."
        - alert: RabbitmqDlqGrowth
          # Dead-letters ACCUMULATING (growth over 6h, sustained 30m) — a
          # handler is failing repeatedly. Depth-only alerting is avoided on
          # purpose: stale sediment (e.g. dlq.mac_bridge=129) would fire
          # forever. Motivation: 19 dead-lettered expense commands sat FIVE
          # days unalerted (2026-07-16..21, publisher-channel outage) because
          # every queue alert above excludes dlq.* by design.
          expr: (rabbitmq_detailed_queue_messages_ready{vhost="/synapse",queue=~"dlq\\..+"} - (rabbitmq_detailed_queue_messages_ready{vhost="/synapse",queue=~"dlq\\..+"} offset 6h)) > 0
          for: 30m
          labels:
            severity: warning
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ DLQ {{ $labels.queue }} is growing"
            description: "Dead-letter queue {{ $labels.queue }} (vhost {{ $labels.vhost }}) grew in the last 6h and kept growing for 30m. New messages are dead-lettering — inspect the DLQ payloads and the owning adapter's logs."
        - alert: SynapseUnroutableMessages
          # A publish whose routing key matched NO binding. `events` and
          # `commands` carry an alternate-exchange policy into the `unroutable`
          # fanout, so instead of the broker silently dropping the message it
          # lands here. Depth-based on purpose: a single unroutable message is
          # already a contract break (publisher and consumer disagree on the
          # routing key), never normal traffic. Motivation: shopify-sii-app
          # published email.skirmshop.draft for weeks while the live consumer
          # bound messaging.skirmshop.draft_email — every publish was ack'd,
          # the app reported draft=queued, and the Gmail drafts never existed.
          expr: |
            rabbitmq_detailed_queue_messages_ready{
              vhost="/synapse",
              queue="synapse.unroutable"
            } > 0
          for: 1m
          labels:
            severity: warning
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "Synapse has unroutable messages (contract break)"
            description: "Queue synapse.unroutable holds messages: some publisher used a routing key with no binding. Inspect the payload headers for the origin (`source`, `connection_name`) and the routing key, then reconcile publisher and consumer against libs/synapse-contracts/registry.yaml. Runbook: skill synapse-contracts."
        - alert: RabbitmqFunctionalQueueNoConsumer
          # A functional queue with messages waiting and zero consumers
          # attached. This is a dead handler. Buffers (which legitimately have
          # no consumer) are excluded.
          #
          # DEDUPE (2026-08-04): every queue is scraped TWICE — the shared-rabbitmq
          # and shared-rabbitmq-headless Services both point at the same broker, so
          # each series exists once per job (measured: 406 series for 203 queues).
          # Without `max by (vhost, queue)` this alert fired twice per dead queue,
          # doubling the noise for the same incident. Same fix the
          # synapse-conversation VMRule already documents for its scoped DLQ alert.
          #
          # `max` and not `min` on the consumer side on purpose: if the two scrapes
          # disagree (one still sees a consumer), max keeps the optimistic value and
          # the alert stays quiet. Better a late alert than a false one during the
          # seconds-long consumer gap of a normal rollout.
          expr: |
            (
              max by (vhost, queue) (
                rabbitmq_detailed_queue_consumers{
                  vhost="/synapse",
                  queue!~"dlq\\..+|archive\\..+|adapter\\.[^.]+"
                }
              ) == 0
            )
            and on (vhost, queue)
            (
              max by (vhost, queue) (
                rabbitmq_detailed_queue_messages_ready{
                  vhost="/synapse",
                  queue!~"dlq\\..+|archive\\..+|adapter\\.[^.]+"
                }
              ) > 0
            )
          for: 10m
          labels:
            severity: warning
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ queue {{ $labels.queue }} has messages but no consumer"
            description: "Queue {{ $labels.queue }} (vhost {{ $labels.vhost }}) has ready messages with zero consumers for 10m. The handler is dead or disconnected — messages will sit until a consumer reattaches."

        # --- critical: cluster membership / partition ----------------------
        # Added after the 2026-07-10 01:08Z split-brain (P1): a Tailscale flap
        # (casa<->OVH) partitioned rabbit-0 from rabbit-1/2 for ~7h and nothing
        # here fired. Evidence from that incident:
        #   * rabbitmq_unreachable_cluster_peers_count stayed 0 the WHOLE time:
        #     the Erlang dist link reconnected within seconds and the partition
        #     is sticky Mnesia state, which the 3.13.7 prometheus plugin does
        #     NOT export. RabbitmqClusterPartition alone cannot catch that case.
        #   * The only signal in VM was up{pod="shared-rabbitmq-0",
        #     job="shared-rabbitmq"}==0 for 3 samples (01:07:30-01:08:30Z) —
        #     hence RabbitmqNodeScrapeBlackout, validated against that window
        #     (returns pod-0 at 0.58 @ 01:10Z).
        # Dedupe GOTCHA: every broker pod is scraped by TWO jobs
        # (shared-rabbitmq + shared-rabbitmq-headless) -> always aggregate
        # with min/max by (pod).
        # Residual gap: 3.13.7 exports NO direct Mnesia-partitions metric; the
        # sticky partition phase is covered by the latched proxy
        # RabbitmqMnesiaPartitionStuck below. Direct detection would still
        # need a probe of the mgmt API /api/nodes .partitions field
        # (future work).
        # All are severity critical ON PURPOSE: critical rides the default
        # route to the synapse webhook; warning would hit the blackhole leg
        # (see alertmanager-config.yaml) and need its own alertname route.
        - alert: RabbitmqClusterPartition
          # Sustained unreachable peers = hard partition in progress. for: 5m
          # so a single rolling pod restart (~2-3m) does not page.
          expr: max by (pod) (rabbitmq_unreachable_cluster_peers_count{namespace="databases"}) > 0
          for: 5m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ {{ $labels.pod }} cannot reach {{ $value }} cluster peer(s) — possible partition"
            description: "shared-rabbitmq (ns databases) reports unreachable cluster peers for >5m (cluster_partition_handling=pause_minority). Run rabbitmqctl cluster_status on ALL 3 pods and check the Network Partitions section. If partitions are listed: inventory queues/messages on both sides first, then restart the MINORITY side pod (kubectl -n databases delete pod <minority>). Never force_boot/reset. Runbook: memory gotcha_rmq_pause_minority_flash_partition."
        - alert: RabbitmqNodeScrapeBlackout
          # THE signal that existed during the 2026-07-10 partition. <0.7 means
          # >=2 of the last 6 samples (30s interval) failed on EITHER scrape
          # job (min by; max by would NOT have fired — the headless job only
          # lost 1 sample). A single isolated miss does not fire. Clean pod
          # deletes do not fire either (the target leaves the Service and the
          # series disappears) — that case is covered by
          # RabbitmqClusterSizeBelowExpected.
          expr: min by (pod) (avg_over_time(up{job=~"shared-rabbitmq(-headless)?",namespace="databases"}[3m])) < 0.7
          for: 1m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ {{ $labels.pod }} scrape failing in bursts — hung node or network partition in progress"
            description: "The prometheus endpoint (15692) of {{ $labels.pod }} failed >=2 of the last 6 scrapes. This is the exact signature of the 2026-07-10 01:08Z split-brain (90s blackout + sticky Mnesia partition). Check NOW: rabbitmqctl cluster_status on all 3 pods (Network Partitions section) and the pod logs for running_partitioned_network."
        - alert: RabbitmqMnesiaPartitionStuck
          # Latched detector for the DAMAGING phase of the 2026-07-10 P1: after
          # a flash partition the Erlang dist links reconnect within seconds,
          # every gauge returns to healthy (unreachable_peers==0, dist state
          # up==3, scrapes green), but Mnesia stays running_partitioned_network
          # with BOTH sides serving until a broker restart. 3.13.7 exports no
          # partitions metric, so this latches the two onset signatures for 24h:
          #   * a scrape blackout (same signal as RabbitmqNodeScrapeBlackout), OR
          #   * Erlang dist-link resets (erlang_vm_dist_recv_cnt drops to 0 when
          #     a dist connection is re-established — catches flaps that never
          #     break the scrape path).
          # It keeps firing while BOTH hold:
          #   * no rabbitmq container has (re)started AFTER the flap — a broker
          #     restart is the only thing that clears sticky Mnesia state. Flap
          #     evidence within 15m after a container start is ignored: peer
          #     dist resets caused by a restarted/crashlooping broker are
          #     expected (validated: the 2026-07-05 05:37Z pod-2 container
          #     restart produced dist resets on all pods but zero Mnesia events
          #     in Loki, and is correctly gated out).
          #   * scrapes are currently healthy (>0.9) — while a blackout is
          #     still live, RabbitmqNodeScrapeBlackout/ClusterSizeBelowExpected
          #     already page; this alert owns the deceptive "everything looks
          #     green again" phase.
          # Backtest vs the real incident (query_range step 5m): fires
          # continuously 01:15Z->07:55Z on 2026-07-10 (partition active
          # 01:08Z->07:58Z heal restart; clears exactly on the heal). Zero
          # firing samples over the whole rest of the metric history
          # (2026-06-25 first data -> 2026-07-10 00:30Z).
          # CAVEATS: (1) clears on ANY rabbitmq container start, even if the
          # wrong (majority) pod was restarted — ALWAYS verify cluster_status
          # on all 3 pods after the heal. (2) The restart gate depends on
          # kube-state-metrics (kube_pod_container_state_started); if KSM is
          # down this alert is blind (KSM itself is covered by the stack's
          # TargetDown alerts). (3) Latch expires after 24h unhealed.
          expr: |
            (
              max_over_time(
                timestamp(
                  (
                    (
                      (
                        min(avg_over_time(up{job=~"shared-rabbitmq(-headless)?",namespace="databases"}[3m])) < bool 0.7
                      )
                      +
                      (
                        sum(resets(erlang_vm_dist_recv_cnt{namespace="databases",job="shared-rabbitmq"}[10m])) > bool 0
                      )
                    ) > bool 0
                  )
                  *
                  (
                    (
                      time() - max(kube_pod_container_state_started{namespace="databases",pod=~"shared-rabbitmq-.*",container="rabbitmq"})
                    ) > bool 900
                  )
                  == 1
                )[24h:2m]
              )
              >
              max(kube_pod_container_state_started{namespace="databases",pod=~"shared-rabbitmq-.*",container="rabbitmq"})
            )
            and on ()
            (
              min(avg_over_time(up{job=~"shared-rabbitmq(-headless)?",namespace="databases"}[3m])) > 0.9
            )
          for: 10m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "RabbitMQ dist-link flap detected and no broker restarted since — Mnesia partition likely stuck"
            description: "shared-rabbitmq (ns databases) had a network/dist-link flap in the last 24h and no rabbitmq container has restarted since: Mnesia is very likely stuck in running_partitioned_network with all gauges looking healthy (the exact 2026-07-10 01:08Z split-brain mode — 6.5h undetected). Verify NOW: rabbitmqctl cluster_status on ALL 3 pods (Network Partitions section) and pod logs for inconsistent_database. If partitioned: inventory queues/messages on both sides first (list_queues per vhost from both sides), then restart the MINORITY side pod: kubectl -n databases delete pod <minority>. Never force_boot/reset. After the heal re-check cluster_status from all 3 pods — this alert clears on ANY broker restart, including the wrong one. Runbook: memory gotcha_rmq_pause_minority_flash_partition."
        - alert: RabbitmqClusterSizeBelowExpected
          # Covers the blackout alert's blind spot: when a pod drops out of the
          # Service endpoints (prolonged NotReady / paused by pause_minority)
          # its up series DISAPPEARS instead of going to 0. 3 = StatefulSet
          # replicas. If ALL targets vanish this returns no data — that case
          # is RabbitmqScrapeMissing above.
          expr: count(up{job="shared-rabbitmq",namespace="databases"} == 1) < 3
          for: 5m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "Only {{ $value }}/3 shared-rabbitmq nodes visible to scrape for >5m"
            description: "Fewer than 3 healthy targets in the shared-rabbitmq scrape job. A broker node is down, paused (pause_minority) or out of the Service endpoints. Check kubectl -n databases get pods -o wide | grep rabbitmq and rabbitmqctl cluster_status."
        - alert: RabbitmqPeersMetricMissing
          # absent() watchdog (same pattern as OVHPVCHubMetricMissing in
          # dgx-infra): if the metric RabbitmqClusterPartition relies on
          # disappears (plugin/scrape regression), that alert goes silently
          # blind. Critical, not warning, so it rides the default route
          # (precedent: RabbitmqScrapeMissing is critical for the same reason).
          expr: absent(rabbitmq_unreachable_cluster_peers_count{namespace="databases"})
          for: 15m
          labels:
            severity: critical
            area: messaging
            component: shared-rabbitmq
          annotations:
            summary: "rabbitmq_unreachable_cluster_peers_count has been absent >15m — partition detection is blind"
            description: "The metric backing RabbitmqClusterPartition no longer exists in VM. Check the VMServiceScrape shared-rabbitmq (manifests/rabbitmq-scrape.yaml) and the broker prometheus plugin (port 15692)."
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-sii-cronjobs
  namespace: monitoring
spec:
  groups:
    - name: pocharlies.sii-cronjobs
      rules:
        # Kubernetes is authoritative for whether each CronJob completed. The
        # application metrics add the functional result, but can disappear: the
        # monthly metric was absent in VictoriaMetrics even though Kubernetes
        # recorded a successful run on 2026-08-01. Never use an application
        # metric as the only heartbeat for these fiscal jobs.
        - alert: SiiInvoicingCronStale
          # Daily at 01:00 Europe/Madrid. 27h leaves two hours even across the
          # 25-hour autumn DST interval, including the 30-minute Job deadline.
          expr: |
            (
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{
                  namespace="skirmshop", cronjob="sii-invoicing"
                }
              ) > 27 * 3600
            )
            or
            absent(kube_cronjob_status_last_successful_time{
              namespace="skirmshop", cronjob="sii-invoicing"
            })
          for: 15m
          labels:
            severity: critical
            area: fiscal
            domain: crons
            component: shopify-sii
          annotations:
            summary: "SII daily invoicing CronJob has no recent successful run"
            description: "CronJob skirmshop/sii-invoicing has no Kubernetes success in over 27 hours, or its status metric is absent. It should run daily at 01:00 Europe/Madrid. Check `kubectl -n skirmshop get cronjob sii-invoicing` and the newest Job/pod logs."
        - alert: SiiInvoicingTelemetryMissing
          # Only fires while Kubernetes still proves a recent successful run;
          # once that run is stale, SiiInvoicingCronStale takes over.
          expr: |
            absent_over_time(sii_invoicing_last_run_timestamp{
              job="sii_invoicing"
            }[27h])
            and on()
            (
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{
                  namespace="skirmshop", cronjob="sii-invoicing"
                }
              ) < 27 * 3600
            )
          for: 15m
          labels:
            severity: warning
            area: fiscal
            domain: crons
            component: shopify-sii
          annotations:
            summary: "SII daily invoicing completed but emitted no run telemetry"
            description: "Kubernetes records a recent successful sii-invoicing Job, but VictoriaMetrics has no sii_invoicing_last_run_timestamp sample in 27 hours. The fiscal work may have completed, but functional alerting is blind. Check the Job logs and the VictoriaMetrics import request."
        - alert: SiiInvoicingFunctionalFailure
          # Fatal exceptions already fail the Job and are covered by
          # K8sCronJobFailed. This catches non-fatal fiscal degradation that can
          # coexist with exit 0: reconciliation errors or blocked submissions.
          expr: |
            (
              last_over_time(sii_invoicing_last_success{
                job="sii_invoicing", step="reconcile"
              }[27h]) == 0
            )
            or
            (
              last_over_time(sii_invoicing_invoices_failed{
                job="sii_invoicing"
              }[27h]) > 0
            )
            or
            (
              last_over_time(sii_invoicing_invoices_blocked{
                job="sii_invoicing"
              }[27h]) > 0
            )
          for: 15m
          labels:
            severity: warning
            area: fiscal
            domain: crons
            component: shopify-sii
          annotations:
            summary: "SII daily invoicing reported a functional failure"
            description: "The last daily SII run reported a reconciliation error, failed AEAT submission or invoice blocked before AEAT. Inspect `kubectl -n skirmshop logs job/<latest-sii-invoicing-job>` and resolve the affected invoice before the next filing cycle."
        - alert: SiiMonthlyReportFailed
          expr: last_over_time(sii_monthly_report_last_success{job="sii_monthly_report"}[40d]) == 0
          for: 15m
          labels:
            severity: warning
            area: fiscal
            domain: crons
            component: shopify-sii
          annotations:
            summary: "SII monthly fiscal report last run failed"
            description: "sii_monthly_report_last_success=0 for the last run of CronJob skirmshop/sii-monthly-report. The fiscal artifacts (Excel + gestoría Gmail draft) are preserved by design; the failing step (most often the Telegram post to a missing forum topic) is in `kubectl -n skirmshop logs job/<sii-monthly-report-...>`. Fix the forum topic / SII_REPORT_TELEGRAM_THREAD_ID in secret sii-secrets and re-run."
        - alert: SiiMonthlyReportTelemetryMissing
          # The app metric is best-effort. Alert on its absence only while the
          # Kubernetes status proves the monthly Job itself ran recently.
          expr: |
            absent_over_time(sii_monthly_report_last_run_timestamp{
              job="sii_monthly_report"
            }[40d])
            and on()
            (
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{
                  namespace="skirmshop", cronjob="sii-monthly-report"
                }
              ) < 32 * 24 * 3600
            )
          for: 15m
          labels:
            severity: warning
            area: fiscal
            domain: crons
            component: shopify-sii
          annotations:
            summary: "SII monthly report completed but emitted no run telemetry"
            description: "Kubernetes records a recent successful sii-monthly-report Job, but VictoriaMetrics has no sii_monthly_report_last_run_timestamp sample in 40 days. This hides non-fatal Telegram/report failures. Check the next Job logs and the VictoriaMetrics import request."
        - alert: SiiMonthlyReportCronStale
          expr: |
            (
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{
                  namespace="skirmshop", cronjob="sii-monthly-report"
                }
              ) > 32 * 24 * 3600
            )
            or
            absent(kube_cronjob_status_last_successful_time{
              namespace="skirmshop", cronjob="sii-monthly-report"
            })
          for: 30m
          labels:
            severity: critical
            area: fiscal
            domain: crons
            component: shopify-sii
          annotations:
            summary: "SII monthly fiscal report has not run in over 32 days"
            description: "CronJob skirmshop/sii-monthly-report has no Kubernetes success in over 32 days, or its status metric is absent. It should run at 01:10 Europe/Madrid on day 1. The fiscal Excel and gestoría draft may be missing; inspect the CronJob and latest Job immediately."
---
# affiliate.skirmshop.es (Shopify embedded app): affiliate portal/API + the
# go.skirmshop.es/r/* link redirects (revenue path), single pod on the edge node.
# Historically failed intermittently with OOMKill (~every 12h) + readiness
# flapping and had ZERO alerting, so failures were only found via user reports.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: affiliate-app-reliability
  namespace: monitoring
spec:
  groups:
    - name: affiliate-app.availability
      rules:
        - alert: AffiliateAppPublicDown
          expr: probe_success{job="k8s-public-endpoints",instance=~"https://(affiliate|go)[.]skirmshop[.]es/health"} == 0
          for: 3m
          labels:
            severity: critical
            area: availability
            component: affiliate
          annotations:
            summary: "Affiliate app endpoint down"
            description: "{{ $labels.instance }} has failed blackbox probes for >3m. Affiliate portal/API and go.skirmshop.es link redirects may be returning 5xx/timeout."
        - alert: AffiliateAppHealthLatencyHigh
          expr: avg_over_time(probe_duration_seconds{job="k8s-public-endpoints",instance="https://affiliate.skirmshop.es/health"}[5m]) > 2
          for: 10m
          labels:
            severity: warning
            area: availability
            component: affiliate
          annotations:
            summary: "Affiliate /health latency high"
            description: "affiliate.skirmshop.es/health averaged {{ $value | humanizeDuration }} over 5m (>2s). Likely GC stalls (heap growth) or cross-node DB/Redis latency; readiness flapping tends to follow."
    - name: affiliate-app.runtime
      rules:
        # Edge-triggered: last termination was OOMKilled AND a restart happened in
        # the last 15m, so it auto-resolves instead of staying stuck for the pod's
        # whole life. Primary historical failure mode (heap grew to the limit).
        - alert: AffiliateAppOOMKilled
          expr: |
            (kube_pod_container_status_last_terminated_reason{namespace="skirmshop",container="app",reason="OOMKilled"} == 1)
            and on (namespace,pod,container)
            (increase(kube_pod_container_status_restarts_total{namespace="skirmshop",container="app"}[15m]) > 0)
          for: 1m
          labels:
            severity: critical
            area: kubernetes
            component: affiliate
          annotations:
            summary: "Affiliate app OOMKilled"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled and restarted. Heap leak likely — profile and fix in v0.4.5."
        - alert: AffiliateAppMemoryHigh
          expr: |
            max by (namespace,pod) (container_memory_working_set_bytes{namespace="skirmshop",container="app",pod=~"affiliate-app.*"})
            /
            max by (namespace,pod) (container_spec_memory_limit_bytes{namespace="skirmshop",container="app",pod=~"affiliate-app.*"})
            > 0.85
          for: 5m
          labels:
            severity: warning
            area: resources
            component: affiliate
          annotations:
            summary: "Affiliate app memory >85% of limit"
            description: "{{ $labels.pod }} working set is {{ $value | humanizePercentage }} of its memory limit for >5m. OOMKill likely within ~1-2h — check heap growth (leak)."
        - alert: AffiliateAppRestartSpike
          expr: increase(kube_pod_container_status_restarts_total{namespace="skirmshop",container="app"}[1h]) > 2
          for: 10m
          labels:
            severity: critical
            area: kubernetes
            component: affiliate
          annotations:
            summary: "Affiliate app restarting repeatedly"
            description: "{{ $labels.pod }} restarted {{ $value }} times in 1h. Check pod events (OOM, liveness, or prisma migrate P1001 crashloop at boot)."
        - alert: AffiliateAppNotReady
          expr: max by (namespace,pod) (kube_pod_status_ready{namespace="skirmshop",pod=~"affiliate-app.*",condition="true"}) == 0
          for: 5m
          labels:
            severity: critical
            area: kubernetes
            component: affiliate
          annotations:
            summary: "Affiliate app pod not Ready"
            description: "{{ $labels.pod }} not-Ready for >5m (readiness /health failing). Traefik returns 503 for affiliate.skirmshop.es."
    - name: pocharlies.llm
      rules:
        - alert: VllmLaneRestartLoop
          expr: increase(kube_pod_container_status_restarts_total{namespace="llm"}[1h]) > 2
          for: 5m
          labels:
            severity: critical
            area: llm
            component: vllm
          annotations:
            summary: "LLM lane restarting repeatedly"
            description: "{{ $labels.pod }} (ns llm) restarted {{ $value }} times in 1h — crash-loop de lane (patrón 2026-07-10: CUDA illegal access bajo carga multimodal; exit code 0 engañoso). Ver logs --previous y XID en DCGM; litellm cae a fallbacks 35B mientras tanto."
---
# Platform-critical signals born from the 2026-07-20 incident: the ubuntu node
# froze with both postgres-shared instances on it and nothing paged. Pod-level
# metrics went STALE (kubelet dead reports last-known ready=1), so these rules
# lean on service-level probes and litellm's own readiness instead.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-platform-critical
  namespace: monitoring
spec:
  groups:
    - name: pocharlies.platform-critical
      rules:
        - alert: SharedDatastoreUnreachable
          expr: probe_success{job="shared-datastores-tcp"} == 0
          for: 3m
          labels:
            severity: critical
            area: availability
            topic: crons
          annotations:
            summary: "Shared datastore unreachable via Service"
            description: "TCP connect to {{ $labels.instance }} has failed for 3 minutes. Consumers (litellm, synapse, skirmbooks…) are cut off even if pod metrics still look green (stale-kubelet pattern, incident 2026-07-20)."
        - alert: LitellmNotReady
          expr: min by (pod) (kube_pod_container_status_ready{namespace="litellm", container="litellm"}) == 0
          for: 5m
          labels:
            severity: critical
            area: availability
            topic: crons
          annotations:
            summary: "litellm out of Service endpoints"
            description: "Container litellm in {{ $labels.pod }} has been NotReady for 5 minutes — every local-model agent (OpenClaw litellm overrides, skirmshop tools) gets connection refused. Was 9h silent on 2026-07-20."
        - alert: SharedDatastoreCoLocated
          expr: |
            count by (node, app) (
              label_replace(
                kube_pod_info{namespace="databases", pod=~"(postgres-shared|shared-valkey|shared-rabbitmq)-[0-9]+"},
                "app", "$1", "pod", "^(postgres-shared|shared-valkey|shared-rabbitmq)-[0-9]+$"
              )
            ) > 1
          for: 30m
          labels:
            severity: warning
            area: availability
            topic: crons
          annotations:
            summary: "Shared datastore replicas co-located on one node"
            description: "{{ $labels.app }} has {{ $value }} replicas on node {{ $labels.node }} — one node failure takes out quorum/failover (root cause of 2026-07-20). Required anti-affinity should make this impossible; if it fires, scheduling drifted."
---
# Reglas que vigilan al vigilante. Sin ellas el dead-man's switch del
# VMAlertmanagerConfig no tiene nada que disparar: son las únicas alertas que
# pueden avisar de que Keep — ahora el único notificador — ha dejado de recibir.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: keep-hub-health
  namespace: monitoring
spec:
  groups:
    - name: keep.hub-health
      rules:
        - alert: SynapseWorkflowFailed
          # SUSTITUYE al push que hacía el ops-explainer de Synapse
          # (POST /api/v2/alerts contra el Service alertmanager-ingest).
          #
          # Ese push era el último acoplamiento de Synapse con el alerting: para
          # avisar de un fallo, Synapse tenía que conocer Alertmanager, tener un
          # cliente HTTP, una config y una IP fija. Ahora sólo exporta métricas
          # —como cualquier workload— y la detección vive donde le corresponde.
          #
          # La serie ya existe y trae los labels necesarios (verificado en
          # vmsingle): status ∈ {completed, failed}, más `workflow` y `tenant`.
          # Validada con control positivo (>= 0 devuelve las 2 series activas) y
          # negativo (> 0 no devuelve nada porque ahora no hay fallos recientes).
          expr: |
            sum by (workflow, tenant) (
              increase(synapse_engine_workflow_instance_duration_seconds_count{status="failed"}[10m])
            ) > 0
          for: 2m
          labels:
            severity: warning
            area: synapse
          annotations:
            summary: "Workflow de Synapse fallido: {{ $labels.workflow }}"
            description: >-
              El engine ha finalizado con error el workflow
              {{ $labels.workflow }} (tenant {{ $labels.tenant }}) en los últimos
              10 minutos. Detalle en la UI de Synapse; el RCA lo produce Aurora.
        - alert: SynapseWorkflowFailed
          # Pata DLQ/unroutable: la métrica del engine (alerta de arriba) no ve
          # fallos que nunca corrieron en el engine — dead-letters y publishes
          # sin binding. Los contadores por cola del broker no se scrapean (las
          # familias channel×queue están excluidas por cardinalidad), así que el
          # dlq-monitor cuenta lo que drena — como cualquier workload. Cualquier
          # incremento es un contrato roto o un mensaje envenenado, y entra en
          # la misma familia de incidentes SYNW.
          expr: |
            sum by (tenant, kind) (
              increase(synapse_dlq_messages_total[10m])
            ) > 0
          for: 1m
          labels:
            severity: warning
            area: synapse
          annotations:
            summary: "Mensajes {{ $labels.kind }} de {{ $labels.tenant }} entrando en la red de seguridad"
            description: "El dlq-monitor drenó mensajes nuevos ({{ $labels.kind }}) en los últimos 10m — dead-letter o routing key sin binding. El detalle está en la tarjeta del ops-explainer y en synapse.dlq_archive."
        - alert: AlertmanagerTelegramDeliveryFailed
          # Vivía en cron-alert-analyzer.yaml, que se retira. La descripción
          # anterior decía "se entrega por el webhook Synapse" — esa ruta ya no
          # existe: hoy sale por el mismo Keep que vigila, así que si Keep
          # también está roto, quien avisa es el dead-man's switch.
          expr: sum by (reason) (increase(alertmanager_notifications_failed_total{integration="telegram"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
            area: alerting
          annotations:
            summary: "Alertmanager no pudo entregar por Telegram"
            description: >-
              Fallos de entrega Telegram en los últimos 10 minutos. Afecta al
              dead-man's switch (backstop-telegram), que es la única vía que no
              depende de Keep: si esto falla, el backstop no protege.
        - alert: AlertmanagerWebhookDeliveryFailed
          # OJO: esta alerta CAMBIÓ DE SIGNIFICADO con el cutover a Keep.
          # `integration="webhook"` ya no es Synapse — es KEEP. O sea que esto
          # ahora significa "Alertmanager no consigue entregar al hub de alertas",
          # y por eso está en el matcher del dead-man's switch del
          # VMAlertmanagerConfig. Es de las más importantes del repo.
          expr: sum by (reason) (increase(alertmanager_notifications_failed_total{integration="webhook"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
            area: alerting
          annotations:
            summary: "Alertmanager no puede entregar a Keep"
            description: >-
              Fallos del webhook en los últimos 10 minutos. El webhook es la
              ingesta de Keep: mientras dure, las alertas no se están
              registrando. Sale por Telegram directo (backstop), no por Keep.
        - alert: KeepBackendAbsent
          # OJO con lo que se mide aquí. La primera versión usaba
          #   absent(up{namespace="monitoring", pod=~"keep-backend-.*"})
          # y era un falso positivo PERMANENTE: no había ningún scrape apuntando
          # a Keep, así que esa serie no existía nunca y absent() era siempre
          # true. La alerta se disparó en el minuto en que se creó la regla y no
          # podía resolverse — un dead-man's switch que grita siempre es peor que
          # no tenerlo, porque enseña a ignorarlo.
          #
          # Ahora depende sólo de kube-state-metrics, que sí se scrapea:
          #   - absent(...)  -> el Deployment ha desaparecido del clúster
          #   - == 0         -> existe pero no hay ninguna réplica disponible
          # El scrape propio de Keep está en manifests/keep-scrape.yaml; cuando
          # lleve tiempo estable se le puede añadir una condición sobre `up`.
          expr: |
            absent(kube_deployment_status_replicas_available{namespace="monitoring", deployment="keep-backend"})
              or
            max(kube_deployment_status_replicas_available{namespace="monitoring", deployment="keep-backend"}) == 0
          for: 2m
          labels:
            severity: critical
            area: availability
          annotations:
            summary: "Keep backend caído — no hay ingesta de alertas"
            description: >-
              El hub de alertas no está disponible. Alertmanager sigue
              entregando por la lane directa de Telegram sólo para las 5 alertas
              del backstop; todo lo demás se está perdiendo.
        - alert: KeepIngestionDown
          # Alertmanager contabiliza aquí los fallos de entrega del webhook. Si
          # sube, Keep está arriba pero rechazando o no respondiendo — el caso
          # que `up` no detecta (401 por API key mal sembrada, por ejemplo).
          expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[10m]) > 0
          for: 5m
          labels:
            severity: critical
            area: availability
          annotations:
            summary: "Alertmanager no consigue entregar a Keep"
            description: >-
              Fallos de entrega del webhook en los últimos 10 minutos. Revisar
              que keepsvc-alertmanager-apikey coincida con KEEP_DEFAULT_API_KEYS
              y que keep-backend responda en /alerts/event/prometheus.
        - alert: KeepBackendNotSpread
          # Las 2 réplicas de Keep en el MISMO nodo: si ese nodo cae, el hub de
          # alertas desaparece entero y sólo sobreviven las 6 alertas del
          # dead-man's switch.
          #
          # Hace falta una alerta porque el reparto NO se puede garantizar aquí.
          # Sólo 3 nodos llevan node-pool=ks5-nvme y uno está al 99% de CPU, así
          # que quedan 2 usables; con maxUnavailable=0 (el default de k8s para 2
          # réplicas) y sin `strategy` expuesto en el chart, una restricción dura
          # (podAntiAffinity required / topologySpread DoNotSchedule) mete el
          # rollout en deadlock — ya pasó, 3h parado. La blanda
          # (whenUnsatisfiable: ScheduleAnyway) nunca bloquea pero es sólo un
          # peso de scoring, y de hecho perdió: ambas réplicas acabaron en cp-1.
          #
          # Así que el reparto es best-effort y esta alerta lo hace VISIBLE. Se
          # arregla borrando un pod para que se reprograme, o liberando CPU en
          # ks5-cp-2 para tener 3 nodos usables.
          #
          # Expresión validada en vivo con control positivo y negativo.
          expr: |
            kube_deployment_spec_replicas{namespace="monitoring", deployment="keep-backend"} >= 2
              and on()
            count(count by (node) (kube_pod_info{namespace="monitoring", pod=~"keep-backend-.*"})) < 2
          for: 15m
          labels:
            severity: warning
            area: availability
          annotations:
            summary: "Las réplicas de Keep están en un solo nodo"
            description: >-
              El hub de alertas no tiene reparto entre nodos: una caída de ese
              nodo lo tira entero. Borrar un pod de keep-backend para que el
              scheduler lo reubique.
        - alert: KeepIngestionSilent
          # Watchdog llega siempre (antes iba al blackhole, ahora entra a Keep).
          # Si Alertmanager deja de notificar del todo, ni fallos ni éxitos se
          # incrementan: este es el caso que ninguna de las dos anteriores ve.
          expr: increase(alertmanager_notifications_total{integration="webhook"}[30m]) == 0
          for: 10m
          labels:
            severity: warning
            area: availability
          annotations:
            summary: "Alertmanager no ha notificado nada a Keep en 30 minutos"
            description: >-
              Con Watchdog activo debería haber tráfico constante hacia el
              webhook. Silencio total sugiere que la ruta no está entregando.
