# DGX-112 fase 0 — alerta de cuota de 1Password y de "volvemos a estar ciegos".
#
# Por qué existe. La cuota de la API de 1Password Families es de 1.000 llamadas
# diarias y el suelo estructural de external-secrets la agotaba SOLO: 966/día
# medidos el 14-09 (288 de revalidar el store + 678 de reconciliar los ~176
# ExternalSecret). El store `onepassword` es compartido por ~200 ES de todo el
# clúster, así que mientras está en rate limit ningún Secret se resincroniza: si
# un token rota antes de que vuelva la cuota, se rompe el plano de auth de esas
# cargas. Se agotó dos veces (13-09 y 14-09) sin que existiera un solo dato donde
# mirar: la métrica se contaba pero no se raspaba (ver external-secrets-scrape.yaml).
#
# Las LABELS de estas expresiones están VERIFICADAS contra el endpoint /metrics
# del controller el 16-09, no copiadas de la doc ni del dashboard. Lo real:
#
#   externalsecret_provider_api_calls_count{call,status,provider}
#     provider = "1Password/SDK" | "HashiCorp/Vault" | "Kubernetes"
#     call     = ItemsGet | ItemsList | ItemsPut | VaultsList | Login | ...
#     status   = success | ...
#
# Se suma por SOLO `provider` a propósito: enumerar `call` repetiría el fallo de
# KeepBackendAbsent (una regla sobre una serie que no existe no avisa de nada y
# encima parece que sí), y la cuota se gasta igual en success que en error.
#
# El umbral es 700 sobre 1.000, no 900: la cuota es VENTANA DESLIZANTE de 24 h, no
# reset de medianoche — la barrida del 14-09 convergió a las 13:00Z, no a las
# 00:05Z — así que avisar tarde no deja margen para reaccionar dentro del día.
#
# Enrutado: no hace falta tocar Alertmanager. Del árbol de Alertmanager sale un
# catch-all `receiver: keep` que lleva las alertas a Keep y de ahí a Aurora
# (mismo camino que k8sgpt-rules.yaml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-external-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: alerting
spec:
  groups:
    - name: pocharlies.external-secrets
      rules:
        # Nos comemos la cuota de 1Password: el store entra en rate limit y deja
        # de sincronizar secretos en ~200 cargas.
        - alert: OnePasswordQuotaBurn
          expr: |
            sum(increase(externalsecret_provider_api_calls_count{
              provider="1Password/SDK"
            }[24h])) > 700
          for: 30m
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "external-secrets quema la cuota diaria de 1Password"
            description: >-
              Más de 700 de las 1.000 llamadas/día de 1Password Families en la
              ventana deslizante de 24 h. Si llega a 1.000 el ClusterSecretStore
              `onepassword` entra en rate limit y NINGÚN ExternalSecret de los ~200
              que dependen de él se resincroniza: un token que rote ese día no
              llega al clúster. Desglosar por call con
              `sum by (call) (increase(externalsecret_provider_api_calls_count{provider="1Password/SDK"}[24h]))`
              — si domina VaultsList es el suelo de revalidación del store
              (`--store-requeue-interval`), si domina ItemsGet/ItemsList son los
              reconcile de los ExternalSecret (refreshInterval). Contexto: DGX-117.

        # El controller dejó de exponer métricas: o está caído, o el scrape perdió
        # el paso. Es la alerta importante, porque su ausencia es exactamente el
        # estado en el que estuvimos hasta este PR — sin datos y sin saberlo.
        - alert: ExternalSecretsMetricsAbsent
          expr: |
            up{namespace="external-secrets-operator"} == 0
              or
            absent(up{namespace="external-secrets-operator"})
          for: 15m
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "El controller de external-secrets no responde al scrape"
            description: >-
              Sin métricas del controller 15 min. Si el pod está Running, sospechar
              del scrape (VMServiceScrape `external-secrets` en monitoring, puerto
              `metrics` del Service external-secrets-metrics:8080). Sin esta métrica
              la cuota de 1Password vuelve a ser invisible, que es como se agotó
              dos veces en agosto y septiembre.

    # DGX-128 — el sync 1Password -> Vault del namespace `onepassword-sync`
    # (objetos de DGX-125/126: ExternalSecret `ITEM-from-op` con refresh 24 h y
    # PushSecret `ITEM-to-vault` con refresh 1 h, ítems
    # infra-harbor-k8s-runtime-pull, skirmshop-catalog-api y
    # minio-backup-user). Restricción 2 del epic: el sync no puede fallar en
    # silencio. ESO NO expone "última sincronización con éxito" como métrica
    # (veredicto del tech lead en DGX-125): .status.refreshTime vive solo en el
    # CR. Las dos familias eso_* las publica kube-state-metrics vía
    # CustomResourceState (sección kube-state-metrics de
    # victoria-metrics/values.yaml; RFC3339 -> float timestamp), así que
    # "sync viejo" es time() - refreshTime. Las condiciones Ready sí son
    # métricas nativas de ESO (externalsecret/pushsecret_status_condition,
    # scrape external-secrets-scrape.yaml).
    #
    # LABELS DE LAS DOS FAMILIAS, NO SON IGUALES (verificado contra VM vivo
    # 16-09, evidencia DGX-125 plans/evidencia/dgx-125-linea-base-20260916.md):
    # el VMServiceScrape `external-secrets` que raspa las condiciones Ready NO
    # define honorLabels (default false en vm-operator) -> en colisión el
    # namespace del recurso se renombra a `exported_namespace` y `namespace`
    # pasa a valer el del pod raspado, siempre `external-secrets-operator`.
    # Por eso las dos NotReady filtran por exported_namespace. Las eso_* las
    # publica kube-state-metrics y su scrape
    # `vm-victoria-metrics-k8s-stack-kube-state-metrics` SÍ lleva
    # honorLabels: true (verificado: kube_namespace_created{namespace=
    # "backup-hub"} casa con namespace=), así que ahí el filtro correcto
    # sigue siendo `namespace`.
    # OJO: OnePasswordVaultSyncMissing dispara desde el merge de este PR hasta
    # que DGX-126 cree los 3 PushSecret; es el recordatorio, no un falso
    # positivo.
    - name: pocharlies.onepassword-sync
      rules:
        # El PushSecret (1Password -> Vault) dice Ready=False: el sync de ida
        # está roto AHORA, no hace horas. Filtra por `exported_namespace`: el
        # scrape de ESO no lleva honorLabels, `namespace` vale siempre
        # `external-secrets-operator` (namespace del pod scrapeado) y el del
        # recurso llega renombrado (ver cabecera del grupo).
        - alert: OnePasswordVaultSyncNotReady
          expr: |
            pushsecret_status_condition{exported_namespace="onepassword-sync",condition="Ready",status="False"} == 1
          for: 15m
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "PushSecret del sync 1Password -> Vault no está Ready"
            description: >-
              Un PushSecret del namespace onepassword-sync lleva 15 min con
              condición Ready=False: el secreto no está llegando a Vault. Ver
              `kubectl describe pushsecret -n onepassword-sync` (campo
              `message` de la condición) y el log del controller. El destino es
              Vault: si falla, las cargas que leen de Vault siguen con el valor
              viejo hasta que caduque.

        # El ExternalSecret (lector de 1Password) dice Ready=False 30 min: el
        # sync de vuelta está roto. For más largo que el de Vault porque un
        # ES en rate limit de 1Password alterna Ready brevemente entre
        # reconcilios.
        # Mismo eje de label que OnePasswordVaultSyncNotReady:
        # `exported_namespace`, no `namespace` (ver cabecera del grupo).
        - alert: OnePasswordSyncReaderNotReady
          expr: |
            externalsecret_status_condition{exported_namespace="onepassword-sync",condition="Ready",status="False"} == 1
          for: 30m
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "ExternalSecret del sync 1Password no está Ready"
            description: >-
              Un ExternalSecret del namespace onepassword-sync lleva 30 min con
              condición Ready=False. Si el message habla de rate limit, es la
              cuota de 1Password (ver OnePasswordQuotaBurn arriba); si no,
              `kubectl describe externalsecret -n onepassword-sync`.

        # Sync de ida viejo: refreshInterval del PushSecret es 1 h; a las 3 h
        # (3x) el reconciler no está haciendo su trabajo aunque la condición
        # Ready siga en True — Ready dice "el último reconcile fue bien", no
        # "reconcilia".
        - alert: OnePasswordVaultSyncStale
          expr: |
            time() - eso_pushsecret_status_refresh_time{namespace="onepassword-sync"} > 3*3600
          for: 15m
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "El sync 1Password -> Vault no refresca desde hace 3 h"
            description: >-
              time() - eso_pushsecret_status_refresh_time supera 3 h (3x el
              refreshInterval de 1 h) para algún PushSecret de
              onepassword-sync. La condición Ready puede estar en True: este
              alerta justo el fallo en silencio que Ready no cubre. Comprobar
              que la serie existe (si no, KSM CRS: OnePasswordSyncMetricsAbsent)
              y el log del controller de external-secrets.

        # Sync de vuelta viejo: refreshInterval del ExternalSecret es 24 h; a
        # las 26 h hay 2 h de margen sobre el intervalo.
        - alert: OnePasswordSyncReaderStale
          expr: |
            time() - eso_externalsecret_status_refresh_time{namespace="onepassword-sync"} > 26*3600
          for: 15m
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "El lector de 1Password no refresca desde hace 26 h"
            description: >-
              time() - eso_externalsecret_status_refresh_time supera 26 h (24 h
              de refreshInterval + 2 h de margen) para algún ExternalSecret de
              onepassword-sync. Si además arde OnePasswordQuotaBurn, el store
              está en rate limit y ningún secreto se resincroniza.

        # La CustomResourceState de KSM está rota (config, RBAC o el propio
        # KSM): sin esa serie, las dos alertas Stale de arriba no pueden
        # disparar y el silencio vuelve a ser invisible. Con ~200
        # ExternalSecret en el clúster la serie debe existir SIEMPRE, sync o
        # no sync.
        - alert: OnePasswordSyncMetricsAbsent
          expr: |
            absent(eso_externalsecret_status_refresh_time)
          for: 15m
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "kube-state-metrics no expone la métrica de refreshTime de ExternalSecret"
            description: >-
              La familia eso_externalsecret_status_refresh_time no existe en
              VictoriaMetrics 15 min. Con ~200 ExternalSecret en el clúster la
              serie debe existir siempre: si falta, está rota la
              CustomResourceState de kube-state-metrics (ConfigMap
              vm-kube-state-metrics-customresourcestate-config, RBAC
              external-secrets.io del ClusterRole vm-kube-state-metrics, o el
              pod vm-kube-state-metrics). Sin ella, OnePasswordSyncReaderStale
              y OnePasswordVaultSyncStale no pueden disparar.

        # El sync aún no existe: se esperan 3 PushSecret en
        # onepassword-sync (infra-harbor-k8s-runtime-pull,
        # skirmshop-catalog-api, minio-backup-user). DISPARA desde el merge de
        # este PR hasta que DGX-126 los cree; después, que arda significa que
        # uno de los tres desapareció.
        - alert: OnePasswordVaultSyncMissing
          expr: |
            (count(eso_pushsecret_status_refresh_time{namespace="onepassword-sync"}) or vector(0)) < 3
          for: 1h
          labels:
            severity: warning
            area: infra
          annotations:
            summary: "Faltan PushSecret del sync 1Password -> Vault (se esperan 3)"
            description: >-
              Menos de 3 series de eso_pushsecret_status_refresh_time en el
              namespace onepassword-sync durante 1 h. Esperado y conocido entre
              el merge de DGX-128 y el de DGX-126 (los PushSecret aún no
              existen). Fuera de esa ventana: un PushSecret del sync fue
              borrado o KSM dejó de verlo.
