# Virtual key de LiteLLM para k8sgpt, desde Vault vía ESO.
#
# Ruta en Vault que hay que sembrar antes del primer sync:
#   secret/k8sgpt  ->  LITELLM_KEY
#
# La key es una virtual key dedicada (`key_alias: k8sgpt-prod`). Dos motivos
# para no reutilizar otra:
#
#  1. Atribución: el panel LIVE REQUESTS de LiteLLM separa el consumo de k8sgpt
#     del de OpenClaw y del resto, que comparten el mismo modelo residente.
#  2. Blast radius: k8sgpt analiza el clúster ENTERO sin filtros de namespace,
#     así que una tormenta de hallazgos podría monopolizar la única GPU de dgx1.
#     El tope está en LiteLLM, no aquí — k8sgpt no sabe limitarse solo.
#
# Parámetros de la key (se fijan por API, no por este yaml):
#   models                ["tooling","tooling"]
#   max_parallel_requests 4     <- el control que de verdad importa
#   rpm_limit             600   <- backstop anti-runaway, no el regulador
#
# EL LÍMITE ÚTIL ES LA CONCURRENCIA, NO EL RITMO.
#
# Lo que hace daño a un vLLM compartido son las peticiones SIMULTÁNEAS: cada
# una ocupa un slot de la GPU y alarga la latencia de todos los demás
# consumidores (OpenClaw incluido). El primer intento aquí fue rpm_limit=30, y
# salió mal por partida doble: no limitaba la concurrencia (k8sgpt lanza 10 a
# la vez igualmente) y además tumbaba la analítica entera, porque el RPC
# Analyze es todo-o-nada ante un 429. Ver el comentario de backOff en
# manifests/k8sgpt-config.yaml.
#
# El nombre `k8sgptsvc-` sigue el patrón de `keepsvc-`/`aurorasvc-`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8sgptsvc-llm
  namespace: k8sgpt
  annotations:
    # Antes del CR K8sGPT (wave 5), que monta este Secret.
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/component: llm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8sgptsvc-llm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # El nombre de la clave lo consume spec.ai.secret.key del CR K8sGPT.
        litellm-key: "{{ .litellm_key }}"
  data:
    - secretKey: litellm_key
      remoteRef: { key: secret/k8sgpt, property: LITELLM_KEY }
