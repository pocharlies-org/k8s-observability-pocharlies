# Virtual key de LiteLLM para k8sgpt, desde Vault vía ESO.
#
# Ruta en Vault que hay que sembrar antes del primer sync:
#   secret/k8sgpt  ->  LITELLM_KEY
#
# La key es una virtual key dedicada (`key_alias: k8sgpt-prod`). Dos motivos
# para no reutilizar otra:
#
#  1. Atribución: el panel LIVE REQUESTS de LiteLLM separa el consumo de k8sgpt
#     del de OpenClaw y del resto, que comparten el mismo modelo residente.
#  2. Blast radius: sólo el explicador idempotente usa esta clave y LiteLLM
#     impone una segunda barrera aunque el worker tenga un bug.
#
# Parámetros de la key (se fijan por API, no por este yaml):
#   models                ["tooling","agent"]
#   max_parallel_requests 1
#   rpm_limit             8
#   tpm_limit             40000
#
# EL LÍMITE ÚTIL ES LA CONCURRENCIA, NO EL RITMO.
#
# El worker procesa un fingerprint cada vez y la clave vuelve a imponer uno.
# El presupuesto durable adicional es 24 intentos/día y 1024 tokens de salida
# por intento; una llamada fallida también descuenta presupuesto.
#
# El nombre `k8sgptsvc-` sigue el patrón de `keepsvc-`/`aurorasvc-`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8sgptsvc-llm
  namespace: k8sgpt
  annotations:
    # Antes del CR K8sGPT (wave 5), que monta este Secret.
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/component: llm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8sgptsvc-llm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # El nombre de la clave lo consume spec.ai.secret.key del CR K8sGPT.
        litellm-key: "{{ .litellm_key }}"
  data:
    - secretKey: litellm_key
      remoteRef: { key: secret/k8sgpt, property: LITELLM_KEY }
