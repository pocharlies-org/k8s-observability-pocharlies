  scrapeTimeout: 10s
  module: http_alive
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: cluster
      targets:
        - http://vm-grafana.monitoring.svc.cluster.local/api/health
        - http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/health
        - http://vmagent-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8429/health
        - http://vmalert-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8080/health
        - http://loki.monitoring.svc.cluster.local:3100/ready
---
# Shared datastores probed at the SERVICE level (TCP connect through the VIP).
# During the 2026-07-20 ubuntu-node freeze every pod-level metric stayed green
# (stale kubelet status, direct pod-IP scrapes) while the Services had no
# endpoints — this probe is the signal that would have caught it.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: shared-datastores-tcp
  namespace: monitoring
spec:
  jobName: shared-datastores-tcp
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: cluster
        component: shared-datastores
      targets:
        - postgres-shared-rw.databases.svc.cluster.local:5432
        - shared-rabbitmq.databases.svc.cluster.local:5672
        - shared-valkey-master.databases.svc.cluster.local:6379
---
# Edge check for the business webhooks (shopify, stripe, telegram, gmail,
# whatsapp): they enter by Cloudflare → traefik-edge (sauvage) → deploy/
# synapse-gateway. The probe measures that path, not the LAN one (INFRA-1536).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: synapse-gateway
  namespace: monitoring
spec:
  jobName: synapse-gateway
  interval: 30s
  scrapeTimeout: 10s
  module: http_synapse_edge
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: edge
        component: synapse
      targets:
        # POST-only route, so a GET answers 405 — which is what the module
      # accepts. The target is pinned to sauvage's tailnet IP because the
      # hostname alone resolves (split DNS) to 192.168.50.240 = traefik-lan,
      # node-pinned to ubuntu: on 23-11 the x86 saturated under blender
      # renders (load 40-60), the LAN path crossed the module's 5 s timeout
      # and SynapseDown fired critical claiming lost webhooks while the real
      # edge answered in 0.07 s (measured: edge 0.07 s, Cloudflare 0.12 s,
      # traefik-lan 1.69 s+). The module carries Host + SNI for the name.
      # shortcut: if sauvage's tailnet IP changes, update the target here.
      - https://100.109.183.9/webhooks/stripe
---
# Sonda TCP casa→control-plane (SC-5606). Mide el path REAL casa→OVH: el TCP a
# 6443 sale del nodo de casa ubuntu (blackbox-exporter-casa, hostNetwork) por su
# tailscale0, exactamente el camino que se cae al relay DERP cuando el enlace
# degrada (SC-5549). jobName NO empieza por "k8s-" a propósito: así no casa con
# BlackboxProbeDown (job=~"k8s-.*") y la señal de partición la da exclusivamente
# la alerta HomeControlPlaneTCPFailing, que cruza esta serie con la de OVH.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: home-control-plane-tcp
  namespace: monitoring
spec:
  jobName: home-control-plane-tcp
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  vmProberSpec:
    url: blackbox-exporter-casa.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: control-plane
        component: apiserver
        probe_from: casa
      targets:
        - 100.107.21.89:6443
        - 100.71.117.127:6443
        - 100.75.189.75:6443
---
# Sonda TCP sauvage→postgres-shared-rw (INFRA-1556, INFRA-1004). Mide el path REAL
# sauvage→ks5: DNS del servicio → ClusterIP → DNAT al primario → VXLAN al nodo del
# primario, el camino que quedó intermitente el 27-10 tras el switchover a ks5-cp-2.
# Sale del blackbox-exporter-sauvage (CNI, nodeSelector sauvage), no del de ks5, que
# no ve esa ruta. Sustituye al CronJob postgres-rw-connectivity-probe (*/1, nc -z).
# jobName NO empieza por "k8s-" a propósito: no casa con BlackboxProbeDown
# (job=~"k8s-.*"); la señal la da exclusivamente SharedDatastoreUnreachableFromSauvage.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: postgres-rw-sauvage
  namespace: monitoring
spec:
  jobName: postgres-rw-sauvage
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  vmProberSpec:
    url: blackbox-exporter-sauvage.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: cluster
        component: shared-datastores
        probe_from: sauvage
      targets:
        - postgres-shared-rw.databases.svc.cluster.local:5432
---
# Referencia OVH→control-plane (SC-5606). Mismo target, sonda desde el blackbox
# de OVH. Sirve para distinguir PARTICIÓN (OVH ve el API vivo, casa no) de
# caída total (ninguno lo ve). La alerta HomeControlPlaneTCPFailing exige que
# esta serie esté a 1 para disparar: si el API está caído también desde OVH, no
# es una partición de enlace y no debe abrir el incidente «Partición».
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: ovh-control-plane-tcp
  namespace: monitoring
spec:
  jobName: ovh-control-plane-tcp
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: control-plane
        component: apiserver
        probe_from: ovh
      targets:
        - 100.107.21.89:6443
        - 100.71.117.127:6443
        - 100.75.189.75:6443
