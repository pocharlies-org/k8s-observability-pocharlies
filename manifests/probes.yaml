apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: k8s-lan-ingresses
  namespace: monitoring
spec:
  jobName: k8s-lan-ingresses
  interval: 30s
  scrapeTimeout: 10s
  module: http_alive_tls
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: lan
      targets:
        - https://adguard.e-dani.com/
        - https://argocd.e-dani.com/
        - https://grafana.e-dani.com/
        - https://alertmanager.e-dani.com/
        - https://vm.e-dani.com/
        - https://harbor.lan.e-dani.com/
        - https://litellm.e-dani.com/health/liveliness
        - https://longhorn.e-dani.com/
        - https://minio.e-dani.com/
        - https://minio-s3.e-dani.com/
        - https://teslamate.e-dani.com/
        # vault.e-dani.com RETIRADO 28-09-2026: Vault desmantelado tras la
        # migracion Vault -> 1Password (_ops/vault-to-1password; ns `vault`
        # vacio verificado 29-09). El probe daba BlackboxProbeDown permanente
        # desde 10:46Z. No reañadir sin un backend vivo detras.
---
