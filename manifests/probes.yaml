apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: k8s-lan-ingresses
  namespace: monitoring
spec:
  jobName: k8s-lan-ingresses
  interval: 30s
  scrapeTimeout: 10s
  module: http_alive_tls
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: lan
      targets:
        - https://adguard.lan.e-dani.com/
        - https://argocd.lan.e-dani.com/
        - https://grafana.lan.e-dani.com/
        - https://alertmanager.lan.e-dani.com/
        - https://vm.lan.e-dani.com/
        - https://harbor.lan.e-dani.com/
        - https://litellm.lan.e-dani.com/health/liveliness
        - https://longhorn.lan.e-dani.com/
        - https://minio.lan.e-dani.com/
        - https://s3.lan.e-dani.com/
        - https://teslamate.lan.e-dani.com/
        - https://vault.lan.e-dani.com/
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: k8s-public-endpoints
  namespace: monitoring
spec:
  jobName: k8s-public-endpoints
  interval: 30s
  scrapeTimeout: 10s
  module: http_alive_tls
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: public
      targets:
        - https://auth-next.e-dani.com/
        - https://firecrawl.e-dani.com/
        - https://harbor.e-dani.com/
        - https://skirmshop.e-dani.com/labels/
        - https://skirmshop.e-dani.com/labels-ups/health
        - https://skirmshop.e-dani.com/picker/health
        - https://whatsapp.e-dani.com/
        # Affiliate app (Shopify embedded) — portal/API + go.skirmshop.es/r/* link
        # redirects (revenue path). /health probes the app cheaply; probing a real
        # /r/<code> is avoided on purpose (it would record fake affiliate clicks).
        - https://affiliate.skirmshop.es/health
        - https://go.skirmshop.es/health
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: k8s-public-redirect-endpoints
  namespace: monitoring
spec:
  jobName: k8s-public-redirect-endpoints
  interval: 30s
  scrapeTimeout: 10s
  module: http_alive_tls_no_redirect
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: public
        probe_mode: initial_redirect_ok
      targets:
        - https://skirmshop.e-dani.com/bundles/
        - https://skirmshop.e-dani.com/sii/
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: k8s-control-plane-health
  namespace: monitoring
spec:
  jobName: k8s-control-plane-health
  interval: 30s
  scrapeTimeout: 10s
  module: http_alive
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: cluster
      targets:
        - http://vm-grafana.monitoring.svc.cluster.local/api/health
        - http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/health
        - http://vmagent-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8429/health
        - http://vmalert-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8080/health
        - http://loki.monitoring.svc.cluster.local:3100/ready
---
# Shared datastores probed at the SERVICE level (TCP connect through the VIP).
# During the 2026-07-20 ubuntu-node freeze every pod-level metric stayed green
# (stale kubelet status, direct pod-IP scrapes) while the Services had no
# endpoints — this probe is the signal that would have caught it.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: shared-datastores-tcp
  namespace: monitoring
spec:
  jobName: shared-datastores-tcp
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: cluster
        component: shared-datastores
      targets:
        - postgres-shared-rw.databases.svc.cluster.local:5432
        - shared-rabbitmq.databases.svc.cluster.local:5672
        - shared-valkey-master.databases.svc.cluster.local:6379
---
# Synapse lives OUTSIDE the cluster (systemd on sauvage); Alertmanager's
# only delivery route to Telegram is the webhook to this endpoint. Probe
# it directly so we can alert (critical) when the delivery path is down.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: synapse-gateway
  namespace: monitoring
spec:
  jobName: synapse-gateway
  interval: 30s
  scrapeTimeout: 10s
  module: http_synapse_webhook
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        scope: edge
        component: synapse
      targets:
        - https://synapse.e-dani.com/webhooks/alertmanager
