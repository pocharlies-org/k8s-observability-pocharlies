# DGX-112 fase 0 — recoger las llamadas a proveedores de external-secrets.
#
# El controller ya las contaba desde siempre (`ObserveAPICall` en cada
# VaultsAPI.List / ItemsList / ItemsGet) y las exponía en :8080, pero nadie las
# recogía: el Service `external-secrets-metrics` existe desde el PR que puso
# `metrics.service.enabled: true` en k8s-gitops (deploy/prod), y hasta aquí no
# había nadie raspándolo. Resultado medido antes de este PR:
# `sum by (call) (increase(externalsecret_provider_api_calls_count[24h]))` = 0
# series. O sea, la cuota de 1Password Families (1.000/día) se agotaba dos veces
# — 13-09 y 14-09 — sin un solo dato donde mirar.
#
# Por qué hace falta: el suelo de consumo NO es un coste por secreto, es un coste
# por ExternalSecret y por reconcile (`GetVault` llama a `VaultsAPI.List` en cada
# NewClient y la caché del store no lo cubre). Con ~200 ES vivos eso es lo único
# que explica el suelo, y es la métrica con la que DGX-125 tiene que cerrar.
#
# Verificado contra el clúster el 16-09, no copiado del chart:
#   - Service `external-secrets-metrics`: puerto `metrics` 8080 -> targetPort
#     `metrics` (containerPort 8080 en el controller). EndpointSlice vivo.
#   - `curl http://external-secrets-metrics:8080/metrics` responde y trae 28 líneas
#     con `externalsecret_provider_api_calls_count`.
#   - En el namespace solo hay DOS Services y sólo ESTE tiene puerto `metrics`
#     (el otro es `external-secrets-webhook`, puerto `webhook`). Por eso el
#     selector va por name+instance del chart y el endpoint elige el puerto por
#     NOMBRE: sobre el webhook ese puerto no existe y no genera target.
#
# Intervalo 60s: es un contador, no un gauge de picos — con 5m valdría igual para
# la cuenta diaria, pero a 60s el panel reacciona enseguida tras un incidente.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: external-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: alerting
spec:
  namespaceSelector:
    matchNames: ["external-secrets-operator"]
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
