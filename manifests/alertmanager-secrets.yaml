# Bot token for the direct-to-Telegram BACKUP receiver. Synapse is
# Alertmanager's normal delivery path (webhook); this secret powers the
# fallback that fires for critical alerts so they survive a Synapse
# outage. Value lives in Vault at secret/observability/prod/telegram.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-backup
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: telegram-backup
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram-backup
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        bot_token: "{{ .synapse_bot_token }}"
  data:
    - secretKey: synapse_bot_token
      remoteRef:
        key: observability-prod-telegram/synapse_bot_token
---
# 29-09-2026: token del webhook de Hermes para el receiver sre-devops (victoria-metrics/values.yaml).
# Es el secreto de las rutas webhook de Hermes (1Password hermes-compania/webhook_secret, el mismo que
# lee el chart de Hermes); Alertmanager lo manda en la cabecera X-Gitlab-Token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-webhook-token
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: hermes-webhook
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hermes-compania/webhook_secret
