# Configuración del análisis. Este CR es lo que el operador vigila: al crearlo,
# despliega un pod `k8sgpt` que escanea el clúster en bucle y materializa cada
# hallazgo como un CR `Result` en este mismo namespace.
#
# CÓMO REPARTE EL TRABAJO (importante para entender el coste)
#
# Los analyzers son deterministas y van en Go: detectan el síntoma SIN IA
# (CrashLoopBackOff, Service sin endpoints, PVC en Pending, Ingress con una
# class que no existe...). El LLM sólo interviene DESPUÉS, para explicar en
# lenguaje natural lo ya detectado y proponer arreglo.
#
# Consecuencia: el número de llamadas al modelo escala con el número de
# PROBLEMAS, no con el tamaño del clúster. Un clúster sano ≈ cero llamadas.
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt
  namespace: k8sgpt
  annotations:
    # Wave 5: después del ExternalSecret (4) y, sobre todo, después de que el
    # Application `k8sgpt` (wave 3) haya instalado la CRD `k8sgpts`.
    argocd.argoproj.io/sync-wave: "5"
    #
    # En el PRIMER sync la CRD todavía no existe cuando ArgoCD valida este
    # objeto, y el dry-run fallaría. Las sync-waves ordenan los apply dentro de
    # este Application, pero NO esperan a que un Application hijo esté Healthy,
    # así que la carrera es real. Con esto ArgoCD se salta el dry-run cuando el
    # recurso aún no es conocido, y selfHeal converge en el siguiente ciclo.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/part-of: observability
spec:
  # Imagen del CLI k8sgpt que despliega el operador (NO la del operador, que la
  # fija el chart). v0.4.36 es la última estable, 2026-07-10.
  version: v0.4.36

  # El pod de análisis, junto al operador, en sauvage.
  #
  # Este nodeSelector NO es el del chart: aquel fija el controller-manager, y
  # éste el Deployment `k8sgpt` que el operador crea a partir de este CR. Son dos
  # pods distintos y cada uno se fija por su lado.
  #
  # El toleration de `role=edge:NoSchedule` no cabe aquí: la CRD tiene
  # `nodeSelector` pero NO `tolerations` (verificado contra el esquema de
  # k8sgpt-crd.yaml 0.2.27). Lo pone Kyverno, en
  # manifests/k8sgpt-tolerations-policy.yaml.
  nodeSelector:
    kubernetes.io/hostname: sauvage

  ai:
    enabled: true

    # `openai` es el backend genérico "API compatible con OpenAI", y con
    # baseUrl apunta a donde sea. No es el openai.com de verdad: aquí no sale
    # ni un byte del clúster.
    backend: openai
    baseUrl: http://litellm.litellm.svc.cluster.local:4000/v1

    # k8sgpt sólo sabe hablar con UN endpoint y UN nombre de modelo: no tiene
    # concepto de fallback ni de router. Toda la lógica de qué GPU responde vive
    # al otro lado, en LiteLLM — y por eso el alias lleva sufijo `-ha`.
    #
    # ESTO ERA `tooling` PELADO Y SE COBRÓ SU PRECIO.
    #
    # Medido: 16 fallos en 24h, a ráfagas, cuando dgx1 rota el modelo residente
    # y `tooling` se queda sin backend sano. Y no degrada suavemente: el RPC
    # Analyze es TODO O NADA, así que cada ráfaga tira un ciclo de análisis
    # entero sin escribir ni un Result. El error que se veía:
    #
    #   model=tooling. There are no healthy deployments for this model
    #   Available Model Group Fallbacks=['dense']
    #   Error doing the fallback: model=dense. There are no healthy deployments
    #
    # Es decir: el fallback `tooling -> dense` de router_settings existía, pero
    # no cubre el caso en que AMBOS caen a la vez — que con 1 GPU por nodo es
    # justo lo que pasa al rotar.
    #
    # `tooling` lo resuelve el hook litellm_strip_params (repo
    # k8s-litellm-pocharlies) con la cadena tooling -> dense -> qwen3-coder,
    # verificando cada salto. NO lo busques en /v1/models: no es un deployment
    # registrado, funciona porque el hook corre en pre_call_hook. Es el mismo
    # alias al que se pasó Aurora tras romperse a mitad de un incidente real.
    #
    # LA VIRTUAL KEY TIENE QUE PERMITIRLO. La auth de LiteLLM valida el modelo
    # PEDIDO antes de que el hook lo reescriba, así que una key acotada a
    # ["tooling"] rechaza `tooling` con "key not allowed to access model".
    # La key k8sgpt-prod se amplió a ["tooling","tooling"] al hacer este
    # cambio. Si algún día se recrea la key, hay que incluir ambos.
    model: tooling

    secret:
      name: k8sgptsvc-llm
      key: litellm-key

    # El default del CRD es `true`, y aquí sería contraproducente.
    #
    # Anonimizar sustituye nombres de recursos por placeholders antes de mandar
    # el prompt. Existe para no filtrar topología a un proveedor externo — pero
    # el modelo es NUESTRO, corre en dgx1 y el tráfico no sale del clúster. Lo
    # único que conseguiría es cegarlo: sin el nombre real no puede relacionar
    # un pod con su Deployment ni sugerir el kubectl correcto.
    anonymized: false

    language: spanish

    # Techo por respuesta. 2048 da para diagnóstico + pasos de arreglo sin que
    # una explicación desbocada ocupe la GPU compartida.
    maxTokens: "2048"

    # IMPRESCINDIBLE, y aprendido a base de fallo en el primer despliegue.
    #
    # k8sgpt manda las explicaciones con max_concurrency=10, y el RPC `Analyze`
    # es TODO O NADA: si una sola llamada devuelve 429, se cae la analítica
    # entera y NO se escribe ni un Result. No degrada, desaparece.
    #
    # Observado tal cual con un rpm_limit de 30 en la virtual key:
    #   "exhausted API quota ... Current limit: 30, Remaining: 0"
    #   -> 0 Results durante 4 minutos, con el operador reintentando en bucle.
    #
    # Con backOff, un 429 se reintenta con espera en vez de matar el ciclo. Es
    # lo que convierte el límite de LiteLLM en un regulador (frena) en lugar de
    # un interruptor (corta).
    backOff:
      enabled: true
      maxRetries: 5

  # Caché ACTIVADA (noCache: false). El mismo hallazgo repetido entre scans no
  # vuelve a pagar una llamada al LLM.
  noCache: false

  # `filters` ES UNA LISTA BLANCA, NO UNA LISTA NEGRA.
  #
  # Verificado en pkg/analysis/analysis.go (RunAnalysis): con `filters` no vacío
  # sólo se ejecutan los analyzers enumerados; con la lista vacía corren los 14
  # de core. Por eso para quitar TRES hay que escribir los ONCE que se quedan.
  # Escribir aquí los que quieres excluir apagaría todo lo demás en silencio.
  #
  # SIN `targetNamespace`: el análisis sigue siendo de todo el clúster.
  #
  # ---------------------------------------------------------------------------
  # POR QUÉ FALTAN ConfigMap, CronJob E Ingress
  #
  # Se arrancó a propósito sin filtros para MEDIR en vez de suponer. Medido sobre
  # 261 hallazgos reales del clúster, los tres tenían 100% de falsos positivos y
  # sumaban ~200 (77% del total):
  #
  #   ConfigMap (178) — 90 son "ConfigMap kube-root-ca.crt is not used by any
  #     pods", y la solución que redacta el LLM es literalmente
  #     `kubectl delete configmap kube-root-ca.crt -n <ns>`. Es FALSO y
  #     destructivo: lo publica Kubernetes en CADA namespace vía el controlador
  #     root-ca-cert-publisher (comprobado: 90 namespaces, 90 copias), lleva el
  #     CA bundle del kube-apiserver y se recrea solo. El analyzer no ve
  #     referencias porque los pods lo consumen por proyección del
  #     ServiceAccount, no como volumen configMap. Los otros 85 son el mismo
  #     heurístico "no usado", igual de flojo: un ConfigMap puede consumirlo un
  #     operador, un CRD, ArgoCD o un dashboard por label sin montarlo nunca.
  #
  #   CronJob (16) — los 16 son "CronJob is suspended". El clúster tiene
  #     exactamente 16 CronJobs suspendidos y suspenderlos fue deliberado (los
  #     de autoheal de Synapse, entre otros). Marcar una decisión como error.
  #
  #   Ingress (6) — los 6 dicen que la IngressClass no existe. Existe:
  #     `ha-dashboard` declara `ingressClassName: traefik-lan` y traefik-lan está
  #     registrada y además es la default. Falso positivo puro.
  #
  # Lo que se queda ya ha demostrado valor en este clúster: Job (backups
  # semanales y retención de clickhouse fallando de verdad), Pod (readiness de
  # litellm contra el 4000, backups S3 de synapse con exit 5), StatefulSet
  # (minio declara `serviceName: minio` y los services son minio-s3 y
  # minio-console — real), Service (17 de 40 son "no endpoints" legítimos).
  #
  # OJO con Service: los otros 23 no son problemas de endpoints, son EVENTOS de
  # Kyverno (require-resource-limits, restrict-image-registries) que el analyzer
  # recoge del objeto y el LLM narra como si fueran el fallo del Service — de ahí
  # salían diagnósticos de "falta límite de memoria" en un Service, que no
  # encajan. Se mantiene porque los 17 buenos compensan, pero si algún día
  # molesta, ésa es la causa y no un fallo del analyzer.
  #
  # PersistentVolumeClaim y Node hoy dan cero hallazgos. Se quedan porque no
  # cuestan nada: un analyzer sólo gasta LLM cuando encuentra algo.
  # ---------------------------------------------------------------------------
  filters:
    - Pod
    - Deployment
    - ReplicaSet
    - DaemonSet
    - StatefulSet
    - Service
    - Job
    - PersistentVolumeClaim
    - Node
    - ValidatingWebhookConfiguration
    - MutatingWebhookConfiguration
