# ─────────────────────────────────────────────────────────────────────────────
# INFRA-1031 (SC-3623): auto-monitoreo del camino de scrape (vmagent→vmsingle).
#
# El 23/10 hubo TRES tormentas simultáneas de absent() (SC-2923 15:02,
# SC-2934 ~20:11, SC-2937 22:30 UTC): un hueco del camino de ≥15 min deja sin
# muestras a TODOS los jobs y las 7 reglas absent() disparan juntas — Keep las
# vendía como N caídas independientes cuando era UNA avería del data-plane.
# Ningún servicio real había caído y ninguna instancia pudo tener RCA.
#
# Estas reglas dicen «camino roto» en vez de «job X ausente»: el summary lleva
# literalmente «hueco del camino de scrape» y keep/rules/correlation-rules.yaml
# (regla camino-de-scrape) agrupa aquí las ausencias de telemetría ciegas.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: scrape-path
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  groups:
    - name: scrape-path
      rules:
        - alert: ScrapePathGap
          # count(up) es el latido del camino: si vmagent deja de escribir
          # (OOMKilled, nodo caído, remote-write bloqueado), las series `up`
          # quedan vacías tras la ventana de lookback (~5 min) y esto cae a 0.
          # El `or vector(0)` de la izquierda es imprescindible: en un hueco
          # TOTAL el lado izquierdo es vacío y una comparación con lado vacío
          # NO dispara — justo lo que hay que cazar. La derecha se deja sin
          # guarda a propósito: count() sobre series vacías devuelve vacío, así
          # que en un arranque en frío (offset 1h sin datos) la comparación
          # queda vacía y la alerta no se dispara sin histórico que comparar.
          # SC-5199 (10/11): `for:` subido de 5m a 15m — el umbral del hueco real
          # de SC-3623. Medido sobre 30 días en rca:up:count (vmsingle-rca, 90 d):
          # esta regla SOLO disparó en los dos simulacros de INFRA-1031 (10-30
          # 22:47-23:03 y 10-31 01:05-01:22 UTC, huecos totales de 16-17 min);
          # las Requests auto-cerradas «no había nada que arreglar» (SC-4984,
          # SC-5084) eran falsos positivos del umbral viejo de
          # VmagentRemoteWriteFailing (pending>0), ya corregido por SC-5084.
          # Con 15m, un hueco que se auto-cura en minutos no abre Request.
          # NO se exige corroboración con VmagentRemoteWriteFailing (el «y/o» de
          # la Request): con vmagent MUERTO (el caso núcleo, OOMKilled SC-2907)
          # RWF no dispara — sin proceso no hay errores ni backlog — y un AND
          # cegaría justo lo que esta regla caza. RWF sigue como aviso temprano
          # aparte; la duración sostenida es la corroboración.
          # SIMULACROS: antes de escalar vmagent a 0, declarar la ventana —
          # `ops-watch keep ventana <min> --cel 'name in ["ScrapePathGap",
          # "VmagentRemoteWriteFailing"]' --nombre <clave>` (ventana de
          # mantenimiento de Keep, suppress: true: queda auditada, no suena) o
          # `ops-watch keep ack <incidente> --ticket <clave>` (SC-3810).
          expr: |
            (count(up) or vector(0)) <= 0.5 * count(up offset 1h)
          for: 15m
          labels:
            severity: critical
            area: monitoring
          annotations:
            summary: "Hueco del camino de scrape (vmagent→vmsingle): count(up) cae ≥50 % respecto a 1h antes"
            description: >-
              NO son N servicios caídos: el camino de scrape
              (vmagent→vmsingle) está dejando sin muestras a todos los jobs,
              y las absent() que disparan a la vez son telemetría ciega, no
              caídas. Antes de tocar ningún servicio, mira el camino:
              `kubectl -n monitoring get pods -l
              app.kubernetes.io/name=vmagent` y el estado de vmsingle
              (OOMKilled — SC-2907), y los logs en Loki
              (namespace="monitoring").

        - alert: VmagentRemoteWriteFailing
          # Nombres de métrica MEDIDOS sobre v1.143.0: no existe
          # vmagent_remotewrite_packets_pending (así venía pedida en la
          # Request); las reales son vmagent_remotewrite_errors_total y
          # vmagent_remotewrite_pending_data_bytes.
          # SC-5084 (10/11): el umbral > 0 era falso positivo crónico — medido
          # sobre el vmagent vivo, pending_data_bytes oscila 0↔~1 MB durante
          # horas con el camino SANO (0 errores, count(up) plano en 198,
          # blocks_sent ~15.5/s estables) y con for: 10m el estado pending
          # llegaba a firing: 56 incidentes SCPATH en 10 días, todos sin
          # avería.
          # INFRA-1529 (SYNC-20319, 22-11): el otro lado — un atasco REAL de
          # ~15 min (backlog 0.7→147 MB, vmsingle ACK lento por consultas
          # pesadas + compactación; 0 errores de conexión) pasó bajo 100 MB/
          # for:10m (>100 MB solo ~10 min) y las absent() dispararon PRIMERO:
          # SynapseCoreAbsent x2 a las 22:38Z contra un engine/dispatcher
          # sanos (up con 2 samples/min, 0 restarts). Con 20 MB (20× el pico
          # sano medido en SC-5084) el backlog cruza el umbral en los ~2
          # primeros minutos de un atasco y con for: 5m esta regla arde antes
          # que la falsa página (staleness 5m + for: 2-3m de las absent()); y
          # mientras arde, inhibe a las que lleven pipeline_blind=true (ver
          # inhibit_rules en alertmanager-config.yaml).
          expr: |
            increase(vmagent_remotewrite_errors_total[10m]) > 0
            or
            vmagent_remotewrite_pending_data_bytes > 20e6
          for: 5m
          labels:
            severity: critical
            area: monitoring
          annotations:
            summary: "vmagent no consigue escribir en vmsingle: errores de remote-write o backlog sostenido"
            description: >-
              vmagent acumula errores de remote-write o una cola pendiente
              (> 20 MB) durante 5 min: el camino se está atascando ANTES de
              quedarse vacío del todo (ScrapePathGap). Mientras arda, las
              alertas absent() de servicios están inhibidas (pipeline_blind):
              no se puede distinguir «servicio caído» de «monitoring ciego».
              Comprueba vmsingle (memoria/OOM, consultas lentas) y los logs de
              vmagent en Loki (namespace="monitoring", app="vmagent").
