# DGX-1440 — vivacidad de mac-build (Mac de compilaciones, off-cluster): tailnet y puente iphone MCP.
#
# Fuente: `mac_build_tailnet_up` y `mac_build_bridge_up` que empuja cada 1 min la sonda
# mac-build-liveness (libexec/mac-build-liveness.sh, x86-host-runtime-pocharlies). Desde
# SC-5631 el productor es el bucle company-cron del pod company-0 (k8s-paseo,
# k8s/company.yaml `cada 60 mac-build-liveness`), no un timer systemd --user del x86:
# un cierre de sesión o el traslado fuera del x86 ya no pueden pararlo en silencio
# (SC-5609: ese timer parado abría MBD críticos falsos — SC-5442, SC-5454, SC-5455).
# El push va a https://vm.lan.e-dani.com/api/v1/import/prometheus, igual que el emisor
# del disco (manifests/mac-build-disk-rules.yaml): el ingress de VM admite el tailnet
# directo y no hay scrape — el Mac no escucha nada, sólo empuja (y aquí ni eso: la sonda
# vive fuera del Mac porque tiene que estar SIEMPRE encendida, SC-4378).
#
# La ocurrencia que la motiva (DGX-1432, documentada en DGX-1409 P5): sobre las 19:00 del
# 03-11 tailscaled en mac-build murió en silencio — el Mac encendido y con red local (los
# runners de GitHub seguían "online"), pero sin tailnet no había ssh ni túnel 8815 y el
# arreglo era físico. Nadie se enteró hasta 15 h después, con la revisión ux de DGX-799
# bloqueada. Los guardas del puente (watchdog de simuladores, KeepAlive del servidor,
# Restart=always del túnel) viven al otro lado del tailnet y no pueden verlo.
#
# Qué cubre cada serie:
#   mac_build_tailnet_up — TCP al puerto 22 de la IP tailnet del Mac (desde SC-5631 la
#     sonda corre también sin binario tailscale: el TCP solo conecta si tailscaled vive
#     allí; sin respaldo ssh a propósito: el ssh usa el mismo tailnet y taparía el caso
#     exacto que hay que ver, tailscaled muerto).
#   mac_build_bridge_up  — TCP 127.0.0.1:8815 + `initialize` MCP por el túnel
#     mac-pruebas-tunnel (lo que ve la sesión ux/qa desde el lado del consumidor; el TCP
#     solo no basta: DGX-1370 — el list pasaba con el servidor roto).
#
# SC-5609 divide la regla: el `absent()` de las dos ya NO es crítico. Con la sonda parada
# las series desaparecen y el Mac sano parecía caído (SC-5442: el propio IT paró el timer
# para probarlo y MBD-19159 se abrió 12,8 min después; SC-5454: Mac despierto, ssh OK).
# Es el mismo arreglo que SC-4378 aplicó al disco (MacBuildDiskMetricStale): la ceguera de
# la vigilancia es incidente, pero WARNING — la sonda muerta no es el Mac muerto.
# Consecuencia aceptada (misma que SC-4378): si la sonda de presencia muere a la par
# (mac_build_awake ausente), la crítica queda gateada y ninguna de las dos casa; la ceguera
# total la cubre MacBuildUnreachable (`for: 12h`, warning, en mac-build-disk-rules.yaml).
#
# Relación con MacBuildUnreachable (arriba, en mac-build-disk-rules.yaml, `for: 12h`,
# warning): aquélla es la señal de «el portátil lleva medio día dormido», el uso normal
# de Dani; ésta es la vía rápida que pide la Request — aviso en menos de 15 min desde la
# caída, que es lo que faltó el 03-11. Las dos conviven: awake y tailnet_up son series
# distintas (la primera con respaldo ssh, esta sin él) y la 12 h no se toca.
#
# Enrutado, en dos pasos y los dos hacen falta (como mac-build-disk-rules.yaml):
#   1. Alertmanager: el catch-all `receiver: keep` la entrega a Keep (sin ruta nueva por
#      alertname; `python3 scripts/alert_routing.py matrix`).
#   2. Keep solo notifica INCIDENTES: la regla `mac-build-disk` de
#      keep/rules/correlation-rules.yaml (celQuery `name.startsWith("MacBuild")`, prefijo
#      MBD) la convierte en incidente — misma familia y mismo destinatario que las de
#      disco (patrón node-degraded: `MacBuild` está excluida de `critical-safety-net`, y
#      tests/test_dgx1440_macbuild_liveness_correlation.py lo vigila).
#
# Carril de pruebas de disparo (SC-4171): empujar el sintético CON la etiqueta `test`
# (su valor, la clave del ticket) manteniéndolo vivo ≥ 8 min — el `for` son 5 min y la
# muestra vale 5 min — y ops-watch aparca el MBD como «Prueba declarada <marcador>» sin
# abrir Request. Al terminar, borrar SOLO la serie sintética (match por `test`, NUNCA
# `host="mac-build"` a secas: eso borra también la real y abre MacBuildLivenessProbeStale):
#   curl -X POST 'https://vm.lan.e-dani.com/api/v1/admin/tsdb/delete_series?match[]=mac_build_bridge_up{test="DGX-XXXX"}'
# Runbook completo: skill `mac-ops`.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pocharlies-mac-build-liveness
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mac-build
    app.kubernetes.io/component: alerting
spec:
  groups:
    - name: pocharlies.mac-build-liveness
      rules:
        # `for: 5m` con sonda cada 1 min: la primera lectura a 0 llega al minuto de la
        # caída y el `for` se cumple al minuto 5-6; vmalert evalúa cada 20 s y el
        # group_interval hacia Keep es de 15 s — aviso en menos de 15 min medido desde
        # la caída, que es el criterio de la Request (el 03-11 fueron 15 h).
        # SC-5609: gate `and on() (mac_build_awake == 1)` (espejo de
        # MacBuildDiskMetricStale, SC-4378) — sólo el Mac VIVO con tailnet/puente caído es
        # crítico; con el Mac dormido no hay builds que perder y la serie ausente es el
        # caso normal.
        - alert: MacBuildUnreachableOrBridgeDown
          expr: |
            ((mac_build_tailnet_up{host="mac-build"} == 0)
              or
            (mac_build_bridge_up{host="mac-build"} == 0))
              and on() (mac_build_awake{host="mac-build"} == 1)
          for: 5m
          labels:
            severity: critical
            area: monitoring
          annotations:
            summary: "mac-build despierto pero no responde por tailnet/ssh o el puente iphone MCP (8815) no responde: builds y pruebas de ux parados"
            description: >-
              La sonda mac-build-liveness (company-cron del pod company-0, cada 1 min)
              lleva >= 5 min viendo mac_build_tailnet_up=0 con el Mac despierto
              (mac_build_awake=1; el 03-11 tailscaled murió en el Mac con los runners de
              GitHub aún "online": el diagnóstico es runner-online-vs-tailnet-muerto, skill
              `mac-ops`), o mac_build_bridge_up=0 (el initialize MCP por el túnel
              mac-pruebas-tunnel no responde: servidor com.e-dani.iphone-mcp en el Mac, o
              el propio túnel). Comprobación de 1 minuto: reiniciar Tailscale en el Mac; si
              está apagado, encender e iniciar sesión (sin auto-login por FileVault). Si
              las series están AUSENTES en vez de a 0, es la sonda:
              MacBuildLivenessProbeStale. Runbook: skill `mac-ops`.
        # SC-5609 — espejo de MacBuildDiskMetricStale (SC-4378): la serie ausente con el
        # Mac despierto es la sonda muerta (vigilancia ciega, INFRA-849), no el Mac caído.
        # `for: 15m`: con push cada 1 min una ausencia de 15 min solo se explica por el
        # bucle parado o el pod company-0 caído, y tolera un reinicio del pod con su
        # sincronización de runtime. Con mac_build_awake ausente (ceguera total) no casa:
        # eso lo cubre MacBuildUnreachable a las 12 h.
        - alert: MacBuildLivenessProbeStale
          expr: |
            (absent(mac_build_tailnet_up{host="mac-build"})
              or
            absent(mac_build_bridge_up{host="mac-build"}))
              and on() (mac_build_awake{host="mac-build"} == 1)
          for: 15m
          labels:
            severity: warning
            area: monitoring
          annotations:
            summary: "mac-build responde pero no reporta su vivacidad hace 15 min: la vigilancia del tailnet/puente está ciega"
            description: >-
              mac_build_awake=1 (la sonda de presencia, company-cron de company-0, ve el
              Mac despierto) pero VictoriaMetrics no ve mac_build_tailnet_up o
              mac_build_bridge_up hace 15 min, cuando el bucle las empuja cada 1 min: la
              sonda está rota o el push falla, no el Mac. Comprobar:
              `kubectl -n paseo logs company-0 | grep mac-build-liveness | tail` (el
              script vuelca el fallo del push) y que company-0 esté en pie
              (`kubectl -n paseo get pod company-0`). Runbook: skill `mac-ops`.
