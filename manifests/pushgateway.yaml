# ─────────────────────────────────────────────────────────────────────────────
# Pushgateway (INFRA-954): destino de las métricas que se EMPUJAN desde fuera
# del ciclo scrape — hoy, `synapse_gmail_watch_expiration_seconds` que publica
# el CronJob synapse-gmail-watch-renew (ns synapse) tras cada renewal. Sin
# destino el alerta SynapseGmailWatchExpired no tenía serie que evaluar: un
# renew fallido pasaba desapercibido hasta cortar la ingesta de me@/info@.
#
# Persistencia: gauge empujado cada 6 días; sin fichero, un reinicio del pod
# borra la serie y el alerta de expiración queda ciego hasta el siguiente
# empuje (ventana de hasta 6 días sin vigilancia). `--persistence.file` sobre
# PVC cierra esa ventana.
#
# honorLabels: true en el scrape: la serie llega con job="synapse_gmail_watch_renew"
# puesto por pushgateway y sin honrarlo vmagent lo pisaría con el nombre del
# scrape; las reglas y el dashboard lo leen tal cual.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/part-of: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC RWO: nunca dos pods escribiendo el mismo fichero
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
        app.kubernetes.io/part-of: monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.5
          args:
            - --persistence.file=/data/pushgateway.db
            - --persistence.interval=5m
          ports:
            - name: http
              containerPort: 9091
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pushgateway
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/part-of: monitoring
spec:
  selector:
    app.kubernetes.io/name: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true  # conserva job="synapse_gmail_watch_renew" del empuje
