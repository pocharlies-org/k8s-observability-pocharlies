# Enrutado de alertas del clúster. Keep es el hub: recibe el 100% del tráfico,
# deduplica, correla, notifica y guarda el registro auditable.
#
# ---------------------------------------------------------------------------
# POR QUÉ ESTE FICHERO ES TAN CORTO AHORA
#
# El árbol anterior tenía 20 rutas y funcionaba como un ALLOWLIST, no como un
# filtro: Alertmanager entrega al receiver propio de una ruta sólo cuando
# ninguna hija encaja, y la última hija era `severity = warning -> blackhole`.
# Resultado medido con scripts/alert_routing.py: 118 de 280 series (42%) no
# podían notificar a nadie, y las 9 reglas `severity: page` — la convención más
# urgente del repo — salían sólo por el webhook de Synapse, nunca a Telegram.
# Ver docs/alert-routing-matrix.md.
#
# Toda esa lógica de reparto vive ahora en Keep, donde es visible, versionada
# (keep/values.yaml) y auditable alerta por alerta, en vez de emergente de un
# árbol anidado.
#
# ---------------------------------------------------------------------------
# NO RENOMBRAR ESTE CR
#
# El nombre ya no describe su contenido (no queda webhook de Synapse), pero el
# Application de ArgoCD tiene `prune: false` y el operador mezcla TODOS los
# VMAlertmanagerConfig del clúster (selectAllByDefault: true). Renombrarlo
# dejaría el viejo vivo y DUPLICARÍA el enrutado de cada alerta.
# ---------------------------------------------------------------------------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: synapse-webhook
  namespace: monitoring
spec:
  route:
    # Todo a Keep. Con disableNamespaceMatcher activo (ver
    # victoria-metrics/values.yaml) esto captura cualquier namespace.
    receiver: keep
    # ---------------------------------------------------------------------
    # PASS-THROUGH DELIBERADO: Alertmanager aquí es transporte, no criterio.
    #
    # `group_by: ['...']` es la sintaxis especial de Alertmanager para "agrupa
    # por TODAS las etiquetas", o sea: una serie por combinación única de
    # labels, sin colapsar nada. Cualquier group_by más estrecho tomaría por
    # Keep la decisión de qué eventos son "el mismo", que es precisamente la
    # decisión que queremos que tome Keep (dedup + correlación), donde está
    # versionada y auditable.
    #
    # Los intervalos cortos son los que recomienda la propia doc de Keep para
    # esta integración. Es un firehose a propósito: mantiene `lastReceived`
    # fresco al minuto, lo que hace que "¿esto sigue disparado?" sea una
    # pregunta con respuesta fiable en el sistema de récord.
    #
    # El reenvío cada minuto NO produce spam porque la notificación se dispara
    # con `type: incident` / `on: [create]` (keep/values.yaml), no por alerta
    # recibida. Si alguien añade un workflow con `type: alert` que notifique,
    # tendrá que poner `only_on_change` o volverá a inundar Telegram.
    # ---------------------------------------------------------------------
    group_by: ['...']
    group_wait: 15s
    group_interval: 15s
    repeat_interval: 1m
    routes:
      # ---------------------------------------------------------------------
      # DEAD-MAN'S SWITCH
      #
      # Estas alertas notifican por Telegram SIN pasar por Keep, porque su modo
      # de fallo puede además romper Keep: si el hub está caído o el nodo que lo
      # aloja no responde, un aviso que dependa del hub no llega.
      #
      # `continue: true` es deliberado: la alerta se notifica por aquí Y sigue a
      # Keep para quedar registrada. No es la doble notificación que este
      # rediseño elimina — son 5 alertname que sólo disparan cuando el propio
      # sistema de alertas está roto.
      #
      # Antes de dar el cutover por bueno hay que probarlo de verdad:
      #   kubectl -n monitoring scale deploy/keep-backend --replicas=0
      # esperar KeepBackendAbsent, confirmar el mensaje, y restaurar.
      # ---------------------------------------------------------------------
      - matchers:
          - 'alertname =~ "KeepBackendAbsent|KeepIngestionDown|KeepIngestionSilent|AlertmanagerWebhookDeliveryFailed|KubeNodeNotReady|KubeNodeUnreachable"'
        receiver: backstop-telegram
        continue: true
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 30m

      # ---------------------------------------------------------------------
      # CATCH-ALL EXPLÍCITO — no borrar, no es redundante
      #
      # `receiver: keep` en la ruta padre NO basta: Alertmanager usa el receiver
      # propio de una ruta sólo cuando NINGUNA hija encaja. Sin esta hermana, las
      # 6 alertas del backstop irían sólo a Telegram y nunca quedarían
      # registradas en Keep — el mismo fallo de allowlist que tenía el árbol
      # anterior, reproducido en su reemplazo.
      #
      # Verificado con: scripts/alert_routing.py (simula el matching real).
      # ---------------------------------------------------------------------
      - receiver: keep

  receivers:
    # Ingesta in-cluster: Service a Service dentro de monitoring. Ni ingress, ni
    # salto externo, ni hostAliases — el camino crítico más corto que hay.
    - name: keep
      webhook_configs:
        - url: http://keep-backend.monitoring.svc.cluster.local:8080/alerts/event/prometheus
          send_resolved: true
          max_alerts: 0
          http_config:
            basic_auth:
              # Ambos son SecretKeySelector: en el operador de VictoriaMetrics
              # BasicAuth.Username no acepta un string literal
              # (vmextra_types.go:360), así que el usuario `api_key` — que es la
              # convención de Keep, no un usuario real — también va en el secreto.
              username:
                name: keepsvc-alertmanager-apikey
                key: username
              password:
                name: keepsvc-alertmanager-apikey
                key: apikey

    - name: backstop-telegram
      telegram_configs:
        - bot_token:
            name: alertmanager-telegram-backup
            key: bot_token
          chat_id: -1003785136626
          send_resolved: true
          parse_mode: HTML
          # Se identifica como vía directa para que al leerlo se sepa que Keep
          # no ha intervenido: si llega esto y nada por el canal normal, el hub
          # es el problema.
          message: >-
            {{ if eq .Status "firing" }}🆘{{ else }}✅{{ end }}
            <b>{{ .CommonLabels.alertname }}</b> — vía Alertmanager directo
            (Keep fuera de juego){{ range .Alerts }}
            {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}{{ end }}
