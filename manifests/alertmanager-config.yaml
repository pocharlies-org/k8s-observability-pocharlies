apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: synapse-webhook
  namespace: monitoring
spec:
  route:
    # Default route: now that disableNamespaceMatcher is on (see
    # victoria-metrics/values.yaml), this captures ALL alerts of any
    # namespace — including infra (kube-state, node-exporter, etc.).
    # Grouped by alertname+namespace+severity and rate-limited (repeat 12h)
    # so the full infra catalogue does not flood Telegram.
    receiver: synapse-alertmanager
    group_by:
      - alertname
      - namespace
      - severity
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # Pure liveness/self-test alerts are useful for Alertmanager internals,
      # but they should never create Telegram work items.
      - matchers:
          - 'alertname =~ "Watchdog|InfoInhibitor"'
        receiver: blackhole
      # One direct emergency leg is intentional: when Synapse itself is down,
      # the normal webhook path cannot deliver the alert or its OpenClaw button.
      - matchers:
          - "alertname = SynapseDown"
        receiver: emergency-telegram
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 30m
      # Every OTHER critical gets a direct-Telegram BACKUP copy (continue: true)
      # and then keeps flowing to the Synapse webhook for the clean LLM card.
      # Incident 2026-07-20: node freeze took the synapse delivery path down
      # with it (AlertmanagerClusterFailedToSendAlerts fired 23:20->08:10) and
      # every critical died unseen for 9h. The emergency leg uses its own tidy
      # template, so the old "raw dump bypasses the LLM" concern does not apply.
      # SynapseDown is excluded here only because its dedicated leg above
      # already delivers to emergency-telegram (no duplicate messages).
      - matchers:
          - "severity = critical"
        receiver: emergency-telegram
        continue: true
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 2h
      # Node-down family is severity=warning upstream (stock VM k8s-stack rule)
      # and used to die in the warning blackhole below — the exact reason the
      # 2026-07-20 9h node outage was silent. Direct emergency copy first, then
      # a Synapse card for context when the webhook path is alive.
      - matchers:
          - 'alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubeletInstanceUnreachable"'
        receiver: emergency-telegram
        continue: true
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 2h
      - matchers:
          - 'alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubeletInstanceUnreachable|SharedDatastoreCoLocated"'
        receiver: synapse-alertmanager
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 6h
      # Synapse application failures (pushed in by the ops-explainer) are
      # grouped by domain and rate-limited here so a burst of the same
      # failure collapses into one card instead of flooding Telegram.
      - matchers:
          - "alertname = SynapseWorkflowFailed"
        receiver: synapse-alertmanager
        group_by:
          - alertname
          - domain
        group_wait: 30s
        group_interval: 2m
        repeat_interval: 12h
      # K8s CronJob failures → cron-alert-analyzer service (in-cluster), which
      # fetches the failed pod's logs (k8s API), runs an LLM root-cause
      # analysis (vllm-122b via litellm), and posts the report to the Telegram
      # "Crons" topic with a deep-link to the dashboard. Grouped by CronJob
      # (owner_name) so repeat failures of the same cron collapse into one card.
      - matchers:
          - "alertname = K8sCronJobFailed"
        receiver: cron-alert-analyzer-webhook
        group_by:
          - alertname
          - namespace
          - owner_name
        group_wait: 30s
        group_interval: 2m
        repeat_interval: 6h
      # The chart default KubeJobFailed alert is raw and duplicates CronJob
      # failures already handled by K8sCronJobFailed + cron-alert-analyzer.
      # Drop it here to avoid zombie retained Jobs flooding the general stream.
      - matchers:
          - "alertname = KubeJobFailed"
        receiver: blackhole
      # SII monthly fiscal report alerts are metric-based (pushed gauge, no pod
      # logs to fetch), so the cron-alert-analyzer path does not apply. Route
      # them to the Synapse webhook so the ops-explainer renders one LLM card to
      # Telegram; without this, the warning leg below would blackhole
      # SiiMonthlyReportFailed (SiiMonthlyReportMissing is critical and would
      # reach Telegram anyway, but keep both on one deterministic route).
      - matchers:
          - 'alertname =~ "SiiMonthlyReport.*"'
        receiver: synapse-alertmanager
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
      # MCP plane health (AgentGateway + bridge backends). The 2026-07-04 outage
      # proved MCPBackendCrashLooping fires but dies in the warning blackhole
      # below — route the whole MCPBackend.*/MCPGatewayDown family to the
      # Synapse webhook (ops-explainer renders to the Telegram Crons topic)
      # BEFORE the generic warning leg, same pattern as SiiMonthlyReport above.
      - matchers:
          - 'alertname =~ "MCPBackend.*|MCPGatewayDown"'
        receiver: synapse-alertmanager
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 6h
      # OVH PVC-hub backup watchdog (Stale/MetricMissing) — same alertname-route
      # pattern; these are warnings that MUST reach the Telegram Crons topic.
      - matchers:
          - 'alertname =~ "OVHPVCHub.*"'
        receiver: synapse-alertmanager
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
      # DLQ growth — dead-letters accumulating means a handler is failing
      # repeatedly; MUST reach Telegram (2026-07-21: 19 msgs sat 5 days silent).
      - matchers:
          - 'alertname = "RabbitmqDlqGrowth"'
        receiver: synapse-alertmanager
        group_by:
          - alertname
          - queue
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      # RabbitMQ functional-queue health (no-consumer / backlog) — actionable
      # warnings that MUST reach Telegram. Proven 2026-07-10: the queue
      # collections-tree.shopify-events.skirmshop sat at ~957 ready messages
      # with 0 consumers since 2026-06-26 and RabbitmqFunctionalQueueNoConsumer
      # died in the warning blackhole below, so nobody was ever notified.
      # Grouped per queue so distinct queues become distinct cards.
      - matchers:
          - 'alertname =~ "RabbitmqFunctionalQueueNoConsumer|RabbitmqQueueBacklogHigh"'
        receiver: synapse-alertmanager
        group_by:
          - alertname
          - vhost
          - queue
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
      # Generic warning alerts stay queryable in Alertmanager/Grafana but do
      # not become Telegram work items. Only the curated warning routes above
      # (SynapseWorkflowFailed and K8sCronJobFailed) page the monitor group.
      - matchers:
          - "severity = warning"
        receiver: blackhole
  receivers:
    - name: blackhole
    - name: synapse-alertmanager
      webhook_configs:
        - url: https://synapse.e-dani.com/webhooks/alertmanager
          send_resolved: true
    - name: emergency-telegram
      telegram_configs:
        - bot_token:
            name: alertmanager-telegram-backup
            key: bot_token
          chat_id: -1003785136626
          parse_mode: HTML
          send_resolved: true
          message: |-
            {{ if eq .Status "firing" }}🔴 ALERTA{{ else }}✅ RECUPERADO{{ end }} <b>{{ .CommonLabels.alertname }}</b>
            {{ range .Alerts }}- {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }} [{{ .Labels.severity }}{{ if .Labels.namespace }} · {{ .Labels.namespace }}{{ end }}]
            {{ end }}
    - name: cron-alert-analyzer-webhook
      webhook_configs:
        - url: http://cron-alert-analyzer.monitoring.svc.cluster.local:8080/alert
          send_resolved: false
