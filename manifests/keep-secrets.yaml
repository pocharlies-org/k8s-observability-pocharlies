# Secretos de Keep. Tres piezas, todas desde Vault vía ESO:
#
#  1. keepsvc-database     — DSN de postgres-shared, compuesto por plantilla.
#  2. keepsvc-provisioning  — KEEP_DEFAULT_API_KEYS (la que usa Alertmanager) y
#                          KEEP_PROVIDERS (incluye el bot_token de Telegram, que
#                          por eso NO puede ir en values.yaml).
#  3. keepsvc-frontend-auth — NEXTAUTH_SECRET.
#
# Rutas en Vault que hay que sembrar antes del primer sync:
#   secret/keep                        -> DB_USER, DB_PASSWORD, API_KEY_ALERTMANAGER,
#                                         API_KEY_AURORA, API_KEY_PROVISIONER,
#                                         NEXTAUTH_SECRET
#   observability/prod/telegram        -> synapse_bot_token   (ya existe)
#
# NO renombrar el prefijo `keepsvc-` a `keep-`. El chart trae un hook pre-delete
# (Job delete-keep-secrets) que ejecuta:
#     kubectl get secrets -n monitoring -o name | grep '^secret/keep-' | xargs kubectl delete
# Su propósito es limpiar los Secrets que Keep crea para los providers
# (SECRET_MANAGER_TYPE=k8s), pero el patrón se llevaría también estos cuatro.
# ArgoCD sólo lanza ese hook al borrar el Application, y ESO los recrearía en
# ≤1h — pero ese hueco dejaría a Alertmanager sin poder autenticarse justo
# mientras alguien opera sobre Keep. El guion de `keep-` es parte del grep, así
# que `keepsvc-` queda fuera y sigue siendo greppable por "keep".
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keepsvc-database
  namespace: monitoring
  labels:
    app.kubernetes.io/name: keep
    app.kubernetes.io/component: database
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keepsvc-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        dsn: "postgresql+psycopg2://{{ .db_user }}:{{ .db_password }}@postgres-shared-rw.databases.svc.cluster.local:5432/keep"
  data:
    - secretKey: db_user
      remoteRef:
        key: secret/keep
        property: DB_USER
    - secretKey: db_password
      remoteRef:
        key: secret/keep
        property: DB_PASSWORD
---
# KEEP_PROVIDERS es un JSON con la configuración de providers. Se compone aquí
# para que el bot_token de Telegram nunca aparezca en el repo.
#
# telegram_ops   -> notificación (reemplaza a ops-explainer y a la lane de emergencia)
# vm             -> consultar VictoriaMetrics para dar contexto a un incidente
# aurora         -> webhook de investigación (Fase 4)
# cron_analyzer  -> lane preservada de K8sCronJobFailed
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keepsvc-provisioning
  namespace: monitoring
  labels:
    app.kubernetes.io/name: keep
    app.kubernetes.io/component: provisioning
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keepsvc-provisioning
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Formato: name:role:secret,name:role:secret
        # `provisioner` necesita rol admin, no webhook: el Job que reconcilia las
        # reglas de correlación usa los scopes read/write/update:rules, que el
        # rol webhook no tiene.
        KEEP_DEFAULT_API_KEYS: "alertmanager:webhook:{{ .api_key_alertmanager }},aurora:webhook:{{ .api_key_aurora }},provisioner:admin:{{ .api_key_provisioner }}"
        # La consume keep/rules/apply-job.yaml.
        API_KEY_PROVISIONER: "{{ .api_key_provisioner }}"
        # La IA NATIVA de Keep (chat de incidente, informe) usa el SDK de OpenAI,
        # que cae a OPENAI_BASE_URL/OPENAI_API_KEY del entorno — la propia doc de
        # Keep la describe como "useful for LiteLLM proxy". Esto NO llena
        # generated_summary (eso es EE y está borrado del repo); sólo enciende
        # features de UI que hoy estaban muertas. El chart sólo sabe mapear
        # OPENAI_API_KEY y además la pondría en claro en el Deployment, así que
        # openAiApi.enabled se queda en false y la key entra por aquí.
        OPENAI_API_KEY: "{{ .litellm_virtual_key }}"
        KEEP_PROVIDERS: |
          {
            "telegram_ops": {
              "type": "telegram",
              "authentication": {
                "bot_token": "{{ .telegram_bot_token }}"
              }
            },
            "vm": {
              "type": "victoriametrics",
              "authentication": {
                "VMAlertHost": "http://vmalert-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local",
                "VMAlertPort": 8080
              }
            },
            "cron_analyzer": {
              "type": "webhook",
              "authentication": {
                "url": "http://cron-alert-analyzer.monitoring.svc.cluster.local:8080/alert"
              }
            },
            "llm": {
              "type": "litellm",
              "authentication": {
                "api_url": "http://litellm.litellm.svc.cluster.local:4000",
                "api_key": "{{ .litellm_virtual_key }}"
              }
            },
            "aurora": {
              "type": "webhook",
              "authentication": {
                "url": "http://aurora-server.aurora.svc.cluster.local:5080/grafana/alerts/webhook/{{ .aurora_user_id }}"
              }
            }
          }
  data:
    - secretKey: api_key_alertmanager
      remoteRef:
        key: secret/keep
        property: API_KEY_ALERTMANAGER
    - secretKey: api_key_aurora
      remoteRef:
        key: secret/keep
        property: API_KEY_AURORA
    - secretKey: api_key_provisioner
      remoteRef:
        key: secret/keep
        property: API_KEY_PROVISIONER
    - secretKey: telegram_bot_token
      remoteRef:
        key: observability/prod/telegram
        property: synapse_bot_token
    # El user_id de Aurora va embebido en la URL del webhook: su endpoint lo
    # lleva en la ruta y valida que exista.
    #
    # Está sembrado con un placeholder A PROPÓSITO. Si faltara la propiedad, ESO
    # dejaría NotReady TODO este ExternalSecret — incluida KEEP_DEFAULT_API_KEYS,
    # que es con lo que Alertmanager se autentica. O sea: un paso pendiente de
    # Aurora tumbaría la ingesta de alertas. Con el placeholder el fallo queda
    # acotado al workflow aurora-investigate, que es donde debe estar.
    #
    # Al registrar el primer usuario en la UI de Aurora (el primero es admin):
    #   vault kv patch secret/aurora AURORA_USER_ID=<uuid>
    - secretKey: aurora_user_id
      remoteRef:
        key: secret/aurora
        property: AURORA_USER_ID
    # Virtual key de LiteLLM con alias `keep-hub`, NO la master: así el gasto se
    # atribuye y se puede limitar sin tocar al resto de consumidores del router.
    - secretKey: litellm_virtual_key
      remoteRef:
        key: secret/keep
        property: LITELLM_VIRTUAL_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keepsvc-frontend-auth
  namespace: monitoring
  labels:
    app.kubernetes.io/name: keep
    app.kubernetes.io/component: frontend
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keepsvc-frontend-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        NEXTAUTH_SECRET: "{{ .nextauth_secret }}"
        # OJO con los dos nombres: el backend y los gates de UI leen
        # OPENAI_API_KEY, pero keep-ui/app/api/copilotkit/route.ts lee
        # OPEN_AI_API_KEY (con guion bajo). Hacen falta las dos variantes o el
        # chat de incidente queda deshabilitado en la UI.
        OPENAI_API_KEY: "{{ .litellm_virtual_key }}"
        OPEN_AI_API_KEY: "{{ .litellm_virtual_key }}"
  data:
    - secretKey: nextauth_secret
      remoteRef:
        key: secret/keep
        property: NEXTAUTH_SECRET
    - secretKey: litellm_virtual_key
      remoteRef:
        key: secret/keep
        property: LITELLM_VIRTUAL_KEY
---
# Credenciales del basic auth que Alertmanager usa contra Keep. Mismo valor que
# API_KEY_ALERTMANAGER de arriba, proyectado con las claves que espera el
# webhook_config del VMAlertmanagerConfig (Fase 3).
#
# El `username` va en el secreto a propósito: en el operador de VictoriaMetrics
# BasicAuth.Username es un SecretKeySelector, no un string (vmextra_types.go:360),
# así que no se puede poner `username: api_key` literal como dice la doc de Keep.
# El valor `api_key` no es un nombre de usuario real: es la convención de Keep
# para señalar que el password es una API key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keepsvc-alertmanager-apikey
  namespace: monitoring
  labels:
    app.kubernetes.io/name: keep
    app.kubernetes.io/component: ingestion
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keepsvc-alertmanager-apikey
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        username: "api_key"
        apikey: "{{ .api_key_alertmanager }}"
  data:
    - secretKey: api_key_alertmanager
      remoteRef:
        key: secret/keep
        property: API_KEY_ALERTMANAGER
