---
# GPU memory/process exporter as a k8s DaemonSet on the GPU nodes.
# DCGM does NOT expose framebuffer/VRAM on the GB10 (Grace-Blackwell unified
# memory) — only the RTX 3080 reports DCGM_FI_DEV_FB_*. nvidia-smi DOES report
# memory on all of them, so we run the (host-retired) dgx-node-metrics exporter
# here in GPU-only mode: runtimeClassName nvidia + NVIDIA_VISIBLE_DEVICES=all
# gives read-only NVML/nvidia-smi access WITHOUT requesting nvidia.com/gpu (so it
# never steals a GPU from vLLM). The dashboard reads VRAM from dgx_gpu_memory_*
# (all 3 incl GB10) and temp/util/power from DCGM.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dgx-gpu-mem-exporter
  namespace: monitoring
  labels:
    app: dgx-gpu-mem-exporter
    app.kubernetes.io/part-of: dgx-dashboard-metrics
spec:
  selector:
    matchLabels:
      app: dgx-gpu-mem-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dgx-gpu-mem-exporter
        metrics-of: dgx-node
    spec:
      # nvidia-smi --query-compute-apps can't resolve GPU-process PIDs (running in
      # other containers) without the host PID namespace. On GB10 (memory.used is
      # N/A) the exporter falls back to summing per-process VRAM, which returned 0
      # on gx10-ec3d until hostPID let it see those processes.
      hostPID: true
      # gx10-ec3d's containerd lacks harbor creds in registries.yaml (unlike the
      # other nodes); pull via this secret instead of restarting k3s-agent there.
      imagePullSecrets:
        - name: harbor-pull
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        - { key: dedicated, operator: Equal, value: llm, effect: NoSchedule }
        - { key: pool, operator: Equal, value: dev, effect: PreferNoSchedule }
      containers:
        - name: exporter
          image: harbor.e-dani.com/homelab/dgx-node-metrics:20260611-2
          ports:
            - { containerPort: 9108, name: metrics }
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "utility" }
            - { name: PORT, value: "9108" }
            - { name: DOCKER_SOCKET, value: "/host-run/docker.sock" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 192Mi }
          # privileged: nsenter into PID 1 for live host systemd state needs
          # it — caps+seccomp+apparmor unconfined are NOT enough for setns into
          # the host mount ns (standard node-agent reality). Decision 2026-06-11,
          # scoped to this read-only observability DS; the dashboard pod stays
          # clean (it only HTTP-GETs the exporter). journal/crontab/docker are
          # privilege-independent; this only unlocks /inventory + /unitfile.
          securityContext:
            privileged: true
          # host /proc so the exporter reads node mem/cpu (HOST_PROC=/host/proc);
          # containerd CRI socket so crictl resolves GPU-process container names;
          # /var/run (ro) gives the host D-Bus socket (systemctl queries for
          # /inventory + /unitfile) and docker.sock where docker still exists;
          # /var/log/journal (ro) feeds journalctl --directory for /journal;
          # cron mounts feed the read-only /crontab endpoint. All without
          # nsenter / CAP_SYS_ADMIN; root uid suffices for the root-owned
          # sockets with every capability dropped.
          volumeMounts:
            - { name: host-proc, mountPath: /host/proc, readOnly: true }
            - name: containerd-sock
              mountPath: /run/k3s/containerd
              readOnly: true
            - { name: host-run, mountPath: /host-run, readOnly: true }
            - { name: host-journal, mountPath: /host/journal, readOnly: true }
            - { name: host-crontabs, mountPath: /host/crontabs, readOnly: true }
            - { name: host-etc-crontab, mountPath: /host/etc-crontab, readOnly: true }
            - { name: host-cron-d, mountPath: /host/cron.d, readOnly: true }
      volumes:
        - name: host-proc
          hostPath: { path: /proc }
        - name: containerd-sock
          # Mount the containerd run DIRECTORY, not the socket file. A single-file
          # hostPath (type: Socket) pins the socket inode at pod-create time; when
          # k3s/containerd restarts it mints a NEW socket inode and the bind-mount
          # goes stale -> crictl "connection refused" -> empty container map -> GPU
          # cards render container-<hash> instead of workload names. A directory
          # mount resolves the socket path lazily per call, surviving restarts.
          hostPath:
            path: /run/k3s/containerd
            type: Directory
        - name: host-run
          hostPath: { path: /var/run }
        - name: host-journal
          hostPath: { path: /var/log/journal, type: DirectoryOrCreate }
        - name: host-crontabs
          hostPath: { path: /var/spool/cron/crontabs, type: DirectoryOrCreate }
        - name: host-etc-crontab
          hostPath: { path: /etc/crontab, type: FileOrCreate }
        - name: host-cron-d
          hostPath: { path: /etc/cron.d, type: DirectoryOrCreate }
---
# Same exporter on the NON-GPU nodes (ks5-cp-*, sauvage): host mem/cpu metrics
# + /inventory /journal /unitfile /crontab for the dashboard cluster panel —
# the SSH/docker-probe path is retired (F3e e1/e2). Shares the `app` label so
# the headless Service and VMServiceScrape pick these pods up too. No GPU
# runtime, no hostPID — strictly read-only host views.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dgx-node-exporter-cpu
  namespace: monitoring
  labels:
    app: dgx-gpu-mem-exporter
    app.kubernetes.io/part-of: dgx-dashboard-metrics
spec:
  selector:
    matchLabels:
      app: dgx-node-exporter-cpu
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dgx-node-exporter-cpu
        metrics-of: dgx-node
    spec:
      # hostPID so nsenter -t 1 can reach the host init's namespaces.
      hostPID: true
      imagePullSecrets:
        - name: harbor-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: nvidia.com/gpu.present, operator: DoesNotExist }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
        - { key: pool, operator: Equal, value: dev, effect: PreferNoSchedule }
      containers:
        - name: exporter
          image: harbor.e-dani.com/homelab/dgx-node-metrics:20260611-2
          ports:
            - { containerPort: 9108, name: metrics }
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: PORT, value: "9108" }
            - { name: DOCKER_SOCKET, value: "/host-run/docker.sock" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 192Mi }
          securityContext:
            privileged: true   # nsenter into host PID 1 (see GPU DS note)
          volumeMounts:
            - { name: host-proc, mountPath: /host/proc, readOnly: true }
            - { name: host-run, mountPath: /host-run, readOnly: true }
            - { name: host-journal, mountPath: /host/journal, readOnly: true }
            - { name: host-crontabs, mountPath: /host/crontabs, readOnly: true }
            - { name: host-etc-crontab, mountPath: /host/etc-crontab, readOnly: true }
            - { name: host-cron-d, mountPath: /host/cron.d, readOnly: true }
      volumes:
        - name: host-proc
          hostPath: { path: /proc }
        - name: host-run
          hostPath: { path: /var/run }
        - name: host-journal
          hostPath: { path: /var/log/journal, type: DirectoryOrCreate }
        - name: host-crontabs
          hostPath: { path: /var/spool/cron/crontabs, type: DirectoryOrCreate }
        - name: host-etc-crontab
          hostPath: { path: /etc/crontab, type: FileOrCreate }
        - name: host-cron-d
          hostPath: { path: /etc/cron.d, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: dgx-gpu-mem-exporter
  namespace: monitoring
  labels:
    app: dgx-gpu-mem-exporter
spec:
  clusterIP: None
  selector:
    metrics-of: dgx-node
  ports:
    - { name: metrics, port: 9108, targetPort: 9108 }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: dgx-gpu-mem-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: dgx-dashboard-metrics
spec:
  selector:
    matchLabels:
      app: dgx-gpu-mem-exporter
  endpoints:
    - port: metrics
      path: /metrics
      # The hybrid DGX2 arbiter admits and cuts off co-resident workloads from
      # this metric. Five-second samples bound its reaction time.
      interval: 5s
      scrapeTimeout: 4s
      # keep the exporter's own labels (node, index, container=GPU-proc) instead of
      # the scrape's target labels overwriting them (e.g. container=exporter).
      honorLabels: true
