---
# Keep — UI del hub de alertas. Mismo patrón que grafana/alertmanager/vmsingle:
# CIDRs de confianza directo (prioridad 300), resto por SSO (prioridad 100).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keep
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keep.lan.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`))
      priority: 300
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-frontend
          port: 3000
    - kind: Rule
      match: Host(`keep.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-frontend
          port: 3000
  tls:
    secretName: wildcard-lan-tls
---
# API de Keep. El navegador la llama directamente (API_URL_CLIENT), así que
# necesita la misma sesión SSO: Keep resuelve la identidad de los headers
# X-Auth-Request-* y devuelve 401 si el de grupos llega vacío.
#
# Alertmanager y Aurora NO pasan por aquí: usan el Service in-cluster con API
# key, que es el camino que debe sobrevivir a una caída del ingress.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keep-api
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keep-api.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-backend
          port: 8080
  tls:
    secretName: wildcard-lan-tls
---
# Certificado propio del namespace. El `wildcard-lan-tls` que usan las rutas de
# monitoring está copiado a mano en 8 namespaces (su Certificate sólo existe en
# traefik-lan), así que para uno nuevo es más limpio pedir el suyo: es el patrón
# que ya siguen jarvis-tls y ha-dashboard-tls. Traefik exige que el secreto TLS
# esté en el mismo namespace que el IngressRoute.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aurora-tls
  namespace: aurora
spec:
  secretName: aurora-tls
  dnsNames:
    - aurora.lan.e-dani.com
    - aurora-api.lan.e-dani.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
---
# Aurora — UI de investigación de incidentes. Mismo patrón: CIDRs de confianza y
# SSO, ambos detrás de sso-chain (la UI muestra output de kubectl del clúster:
# no va sin autenticar ni desde la LAN).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aurora
  namespace: aurora
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`aurora.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: aurora-frontend
          port: 3000
  tls:
    secretName: aurora-tls
---
# API de Aurora. El navegador la llama directamente
# (NEXT_PUBLIC_BACKEND_URL), así que necesita la misma sesión SSO.
# Keep NO pasa por aquí: usa el Service in-cluster.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aurora-api
  namespace: aurora
spec:
  entryPoints:
    - websecure
  routes:
    # El preflight de CORS va SIN la cadena SSO, y no es una excepción
    # cosmética: el navegador manda `OPTIONS` sin credenciales por diseño (es
    # parte del protocolo), así que oauth2-proxy lo veía sin cookie y lo
    # redirigía a Keycloak con un 302. El navegador exige que el preflight
    # responda 2xx con `Access-Control-Allow-Origin`; un 302 hacia otro origen
    # lo invalida, de modo que la petición REAL nunca se enviaba. Efecto: toda
    # llamada cliente→API de la UI fallaba con un error de red genérico — el
    # registro de la primera organización incluido — mientras la página cargaba
    # bien, porque Next.js la renderiza en servidor contra el Service
    # in-cluster, sin CORS ni SSO de por medio.
    #
    # Dejar pasar OPTIONS sin autenticar no abre nada: la respuesta sólo
    # publica qué métodos y cabeceras admite el endpoint, no datos, y la
    # petición real sigue pasando por `sso-chain`. La app ya responde el
    # preflight correctamente por su cuenta (`CORS(app, origins=FRONTEND_URL,
    # supports_credentials=True)` en main_compute.py, que además salta la
    # verificación de token en OPTIONS): sólo hacía falta que le llegase.
    #
    # `priority` por encima de la ruta general para que gane el match.
    - kind: Rule
      match: Host(`aurora-api.lan.e-dani.com`) && Method(`OPTIONS`)
      priority: 200
      services:
        - name: aurora-server
          port: 5080
    - kind: Rule
      match: Host(`aurora-api.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: aurora-server
          port: 5080
  tls:
    secretName: aurora-tls
