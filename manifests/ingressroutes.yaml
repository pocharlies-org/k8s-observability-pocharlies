---
# Keep — UI del hub de alertas. Mismo patrón que grafana/alertmanager/vmsingle:
# CIDRs de confianza directo (prioridad 300), resto por SSO (prioridad 100).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keep
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keep.lan.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`))
      priority: 300
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-frontend
          port: 3000
    - kind: Rule
      match: Host(`keep.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-frontend
          port: 3000
  tls:
    secretName: wildcard-lan-tls
---
# API de Keep. El navegador la llama directamente (API_URL_CLIENT), así que
# necesita la misma sesión SSO: Keep resuelve la identidad de los headers
# X-Auth-Request-* y devuelve 401 si el de grupos llega vacío.
#
# Alertmanager y Aurora NO pasan por aquí: usan el Service in-cluster con API
# key, que es el camino que debe sobrevivir a una caída del ingress.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keep-api
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keep-api.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-backend
          port: 8080
  tls:
    secretName: wildcard-lan-tls
