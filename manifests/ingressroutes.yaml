# Keep — UI del hub de alertas. Mismo patrón que grafana/alertmanager/vmsingle:
# CIDRs de confianza directo (prioridad 300), resto por SSO (prioridad 100).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keep
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    # LA API, EN EL MISMO ORIGEN QUE LA UI. Prioridad 400 para ganar a las dos
    # reglas del frontend (300 y 100), que si no se tragarían /backend.
    #
    # El navegador llama con `credentials: "same-origin"` y cabecera
    # Authorization. Con la API en otro host el navegador no manda la cookie de
    # SSO (cross-origin) y encima el preflight OPTIONS va sin credenciales por
    # especificación: oauth2-proxy respondía 302 a Keycloak a las dos y la UI
    # pintaba "API server is not available". Ver keep/values.yaml, API_URL_CLIENT.
    - kind: Rule
      match: Host(`keep.lan.e-dani.com`) && PathPrefix(`/backend`)
      priority: 400
      middlewares:
        - name: sso-chain
          namespace: keycloak
        - name: keep-backend-stripprefix
      services:
        - name: keep-backend
          port: 8080
    - kind: Rule
      match: Host(`keep.lan.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`))
      priority: 300
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-frontend
          port: 3000
    - kind: Rule
      match: Host(`keep.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-frontend
          port: 3000
  tls:
    secretName: wildcard-lan-tls
---
# stripPrefix de /backend: Keep sirve su API en la raíz (/incidents,
# /alerts, /healthcheck), así que el prefijo tiene que desaparecer antes de
# llegar al backend. Mismo mecanismo que usa Aurora para su /backend.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keep-backend-stripprefix
  namespace: monitoring
spec:
  stripPrefix:
    prefixes:
      - /backend
---
# Host aparte de la API. YA NO lo usa el navegador — ver el bloque /backend de
# arriba — pero se mantiene para llamadas manuales con API key desde la LAN.
#
# Alertmanager y Aurora NO pasan por aquí: usan el Service in-cluster con API
# key, que es el camino que debe sobrevivir a una caída del ingress.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keep-api
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keep-api.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: keep-backend
          port: 8080
  tls:
    secretName: wildcard-lan-tls
---
# Certificado propio del namespace. El `wildcard-lan-tls` que usan las rutas de
# monitoring está copiado a mano en 8 namespaces (su Certificate sólo existe en
# traefik-lan), así que para uno nuevo es más limpio pedir el suyo: es el patrón
# que ya siguen jarvis-tls y ha-dashboard-tls. Traefik exige que el secreto TLS
# esté en el mismo namespace que el IngressRoute.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aurora-tls
  namespace: aurora
spec:
  secretName: aurora-tls
  dnsNames:
    - aurora.lan.e-dani.com
    - aurora-api.lan.e-dani.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
---
# Aurora — UI de investigación de incidentes. Mismo patrón: CIDRs de confianza y
# SSO, ambos detrás de sso-chain (la UI muestra output de kubectl del clúster:
# no va sin autenticar ni desde la LAN).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aurora
  namespace: aurora
spec:
  entryPoints:
    - websecure
  routes:
    # La API en el MISMO origen que la UI. El cliente de Aurora llama a
    # `fetch()` SIN `credentials: "include"` en los endpoints de arranque
    # (`/api/auth/register`, `/api/auth/login`, `/api/auth/setup-org`), y el
    # valor por defecto `same-origin` no manda cookies en una petición
    # cross-origin: con la API en otro host, oauth2-proxy las veía sin sesión y
    # devolvía un 302 a Keycloak, así que registrarse o entrar era imposible.
    # Mismo origen ⇒ la cookie de SSO viaja por defecto y no hay preflight.
    #
    # `sso-chain` va PRIMERO y `stripPrefix` después: se autentica sobre la ruta
    # tal cual llega y sólo entonces se recorta el prefijo para el backend.
    - kind: Rule
      match: Host(`aurora.lan.e-dani.com`) && PathPrefix(`/backend`)
      priority: 200
      middlewares:
        - name: sso-chain
          namespace: keycloak
        - name: aurora-strip-backend
      services:
        - name: aurora-server
          port: 5080
    # El WebSocket del chat, que NO vive en aurora-server sino en
    # aurora-chatbot:5006 (main_chatbot.py, WS_PORT=5006). Sin esta ruta el
    # navegador abría el socket contra `/backend` — es decir, contra el Flask de
    # aurora-server, que no habla ese protocolo — y el chat se quedaba en
    # "Connection not ready. Please wait a moment and try again." con CUALQUIER
    # modelo: no era un problema de LLM, era que el socket nunca llegaba a
    # levantarse. El pod del chatbot no estaba expuesto en ninguna ruta.
    #
    # El handler no enruta por path (handle_connection despacha por la cabecera
    # Authorization para los agentes kubectl, y por el JWT del query string para
    # los navegadores), así que el prefijo se recorta y da igual con qué path
    # llegue. El query string —donde viaja el token— sobrevive al stripPrefix.
    #
    # Va detrás de sso-chain como todo lo demás: Traefik hace el upgrade a
    # WebSocket después de que forwardAuth valide la cookie.
    #
    # `aurora-ws-drop-authorization` NO es opcional. `sso-forward-auth` declara
    # `Authorization` en sus authResponseHeaders, así que Traefik copia el
    # Bearer de Keycloak a la petición que llega al chatbot. Y handle_connection
    # despacha por esa cabecera: si empieza por "Bearer " asume que quien llama
    # es un agente kubectl, busca el token en kubectl_agent_tokens, no lo
    # encuentra y cierra con 1008 "Invalid token" (agent_ws_handler.py:105).
    # Resultado: el socket se abría y moría a los 200 ms, y la UI mostraba
    # "Connection not ready" en bucle. El usuario del navegador se autentica con
    # el JWT del query string, no con esa cabecera, así que quitarla es seguro;
    # los agentes kubectl de verdad van in-cluster y no pasan por aquí.
    - kind: Rule
      match: Host(`aurora.lan.e-dani.com`) && PathPrefix(`/ws`)
      priority: 200
      middlewares:
        - name: sso-chain
          namespace: keycloak
        - name: aurora-ws-drop-authorization
        - name: aurora-strip-ws
      services:
        - name: aurora-chatbot
          port: 5006
    - kind: Rule
      match: Host(`aurora.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: aurora-frontend
          port: 3000
  tls:
    secretName: aurora-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aurora-strip-backend
  namespace: aurora
spec:
  stripPrefix:
    prefixes:
      - /backend
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aurora-strip-ws
  namespace: aurora
spec:
  stripPrefix:
    prefixes:
      - /ws
---
# Borra la cabecera Authorization que el SSO inyecta, sólo en la ruta del
# WebSocket. En Traefik, un customRequestHeader con valor vacío ELIMINA la
# cabecera; va después de sso-chain para que la autenticación siga ocurriendo y
# lo único que cambie sea lo que ve el backend.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aurora-ws-drop-authorization
  namespace: aurora
spec:
  headers:
    customRequestHeaders:
      Authorization: ""
---
# API de Aurora en su propio host. YA NO la usa la UI: el navegador la llama en
# el mismo origen, bajo `aurora.lan.e-dani.com/backend` (ver arriba el motivo).
# Keep tampoco pasa por aquí — usa el Service in-cluster — ni el kubectl-agent,
# que conecta saliente. Se conserva sólo como superficie de depuración manual
# con sesión de navegador, entera detrás de sso-chain y sin ninguna excepción:
# la exención de `Method(OPTIONS)` que hubo aquí sobra desde que no hay
# peticiones cross-origin, y con ella se va la única ruta sin autenticar.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aurora-api
  namespace: aurora
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`aurora-api.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: aurora-server
          port: 5080
  tls:
    secretName: aurora-tls
