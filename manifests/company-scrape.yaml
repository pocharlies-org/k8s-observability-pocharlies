# La compañía: el supervisor `jira-epic-trigger` corre en el pod paseo/company-0 (SC-3961) tras el
# Service paseo/company :19911. El /metrics lo sirve libexec/jira-epic-trigger.py (x86-host-runtime):
# unidades activas, tope dinámico, peticiones del residente y contadores de eventos.
#
# VMStaticScrape al nombre del Service (SC-5091): conserva el job y las etiquetas de las alertas.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: company-supervisor
  namespace: monitoring
spec:
  jobName: company-supervisor
  targetEndpoints:
    - targets:
        - company.paseo.svc.cluster.local:19911
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      labels:
        job: company-supervisor
        app: company-supervisor
