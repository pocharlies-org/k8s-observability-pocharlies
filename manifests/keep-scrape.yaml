# NO hay scrape de Keep, y es deliberado.
#
# Aquí vivía un VMServiceScrape contra keep-backend:8080/metrics. Llevaba desde su
# creación en health=down: ese endpoint exige la API key, así que devolvía 401 en cada
# intento — un target permanentemente caído y un "Failed to validate API Key" en el
# log de Keep cada 30 segundos, durante días, sin traer ni una serie.
#
# Y añadirle la credencial no lo arregla: con API key válida devuelve 500. El 500
# tampoco es el error real — el manejador de excepciones de Keep (api.py:346) revienta
# con `AttributeError: 'State' object has no attribute 'tenant_id'` al formatear el
# mensaje, y enmascara la causa. Está roto upstream en la v0.52.1.
#
# La visibilidad se resuelve mejor por otro lado: manifests/grafana-keep.yaml monta un
# datasource Postgres contra la propia BBDD de Keep y un dashboard con los hechos que
# importan — ejecuciones de workflow por estado, alertas sin incidente, reglas que no
# agrupan nada. Son mejores señales que unas métricas HTTP: el fallo que estuvo 9 días
# oculto (tres workflows registrados con 0 ejecuciones) se ve de un vistazo ahí y no
# habría aparecido en /metrics de ninguna forma.
#
# Si algún día upstream arregla /metrics, el scrape vuelve con `bearerTokenSecret`
# apuntando a keepsvc-provisioning.
