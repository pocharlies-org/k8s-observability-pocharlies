# atlassian-mcp-probe — sonda funcional del MCP de Atlassian (SC-1834, H4 de SC-1728).
# Un exporter con bucle (patrón dgx-cluster-health-watcher: script stdlib en ConfigMap):
# cada 60 s hace un round-trip MCP REAL (initialize + notifications/initialized +
# tools/call jira_get_issue) contra la ruta dedicada /atlassian-probe del AgentGateway,
# con timeout 10 s por petición. No es blackbox: tools/call exige sesión MCP (initialize
# previo) y /readyz seguía verde con el PoolTimeout de INFRA-483 — solo un tools/call
# real detecta la caída. Vive en el clúster (no en el x86) y sobrevive a la caída del
# supervisor: es la detección complementaria al contador del trigger (§2 de SC-1728).
#
# Identidad (veredicto security SC-1863, condiciones 1b y 3): client Keycloak dedicado
# `atlassian-mcp-probe` (client-credentials) con rol de realm agentgateway-read:atlassian;
# la ruta /atlassian-probe solo permite jira_get_issue y el identity-shim resuelve su sub
# a la cuenta Jira de servicio `sonda` (Browse Projects solo en SC). La sonda NO lleva
# credencial Jira: habla con Keycloak y el shim autentica Jira en su sitio.
#
# PRE-ENTREGA (PARA IT de SC-1834 — sin esto la sonda corre y reporta up=0, no peta):
#   - client Keycloak `atlassian-mcp-probe` + su client_secret en el ítem 1Password
#     `atlassian-mcp-probe` (campo client_secret) → lo baja el ExternalSecret de abajo;
#   - Task fija de SC («sonda — no tocar»): su clave va en PROBE_ISSUE_KEY (vacía = el
#     tools/call devuelve isError y up=0, en claro: la sonda no sabe a qué pregunta).
# Mientras falte algo de eso, la alerta VMRule de H5 no debe estar desplegada (o paginará
# en rojo); el orden lo marca el tech-lead de SC-1728.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlassian-mcp-probe-script
  namespace: monitoring
  labels: { app: atlassian-mcp-probe }
data:
  probe.py: |
    #!/usr/bin/env python3
    """atlassian-mcp-probe (SC-1834): round-trip MCP real al /atlassian-probe del gateway.

    Stdlib y un proceso: un hilo hace el ciclo cada PROBE_INTERVAL_S y un HTTP server
    expone /metrics. Kinds de error (contrato de la métrica, spec SC-1834):
    http (token o HTTP != 2xx), timeout (socket), isError (result.isError),
    jsonrpc (cuerpo no parseable o objeto error)."""
    import json
    import os
    import socket
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MCP_URL = os.environ.get("PROBE_MCP_URL",
        "http://agentgateway-mcp.agentgateway.svc.cluster.local:3000/atlassian-probe/mcp")
    TOKEN_URL = os.environ.get("PROBE_TOKEN_URL",
        "https://auth-next.e-dani.com/realms/edani/protocol/openid-connect/token")
    CLIENT_ID = os.environ.get("PROBE_CLIENT_ID", "atlassian-mcp-probe")
    CLIENT_SECRET = os.environ.get("PROBE_CLIENT_SECRET", "")
    ISSUE_KEY = os.environ.get("PROBE_ISSUE_KEY", "")
    INTERVAL = float(os.environ.get("PROBE_INTERVAL_S", "60"))
    TIMEOUT = float(os.environ.get("PROBE_TIMEOUT_S", "10"))
    PORT = int(os.environ.get("PROBE_PORT", "9114"))
    PROTOCOL_VERSION = "2025-06-18"

    KINDS = ("http", "timeout", "isError", "jsonrpc")
    _lock = threading.Lock()
    _state = {"up": 0, "latency": 0.0, "last_success": 0.0,
              "errors": {k: 0 for k in KINDS}}

    class ProbeError(Exception):
        def __init__(self, kind):
            self.kind = kind

    def _post(url, payload, token=None, session=None):
        headers = {"Content-Type": "application/json",
                   "Accept": "application/json, text/event-stream"}
        if token:
            headers["Authorization"] = "Bearer " + token
        if session:
            headers["Mcp-Session-Id"] = session
        req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers)
        try:
            with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                return resp.headers.get("Mcp-Session-Id"), resp.read().decode("utf-8", "replace")
        except (socket.timeout, TimeoutError):
            raise ProbeError("timeout")
        except urllib.error.HTTPError:
            raise ProbeError("http")
        except urllib.error.URLError as exc:
            if isinstance(getattr(exc, "reason", None), (socket.timeout, TimeoutError)):
                raise ProbeError("timeout")
            raise ProbeError("http")

    def _message(raw):
        # El gateway puede responder JSON o SSE: quédate con el último `data:` si lo hay.
        for line in raw.splitlines():
            if line.startswith("data:"):
                raw = line[5:].strip()
        try:
            return json.loads(raw)
        except ValueError:
            raise ProbeError("jsonrpc")

    def _call(url, payload, token, session, want_result):
        sid, raw = _post(url, payload, token=token, session=session)
        if not want_result:
            return sid
        if not raw.strip():
            raise ProbeError("jsonrpc")
        msg = _message(raw)
        if "error" in msg:
            raise ProbeError("jsonrpc")
        if want_result == "result" and "result" not in msg:
            raise ProbeError("jsonrpc")
        if want_result == "tool" and msg.get("result", {}).get("isError") is True:
            raise ProbeError("isError")
        return sid

    def cycle():
        started = time.monotonic()
        try:
            form = urllib.parse.urlencode({
                "grant_type": "client_credentials",
                "client_id": CLIENT_ID,
                "client_secret": CLIENT_SECRET,
            }).encode()
            req = urllib.request.Request(TOKEN_URL, data=form,
                                         headers={"Content-Type": "application/x-www-form-urlencoded"})
            try:
                with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                    token = json.loads(resp.read())["access_token"]
            except (socket.timeout, TimeoutError):
                raise ProbeError("timeout")
            except (urllib.error.URLError, urllib.error.HTTPError, ValueError, KeyError):
                raise ProbeError("http")
            sid = _call(MCP_URL, {
                "jsonrpc": "2.0", "id": 1, "method": "initialize",
                "params": {"protocolVersion": PROTOCOL_VERSION, "capabilities": {},
                           "clientInfo": {"name": "atlassian-mcp-probe", "version": "1"}},
            }, token, None, "result")
            _call(MCP_URL, {"jsonrpc": "2.0", "method": "notifications/initialized"},
                  token, sid, False)
            _call(MCP_URL, {
                "jsonrpc": "2.0", "id": 2, "method": "tools/call",
                "params": {"name": "jira_get_issue", "arguments": {"issue_key": ISSUE_KEY}},
            }, token, sid, "tool")
        except ProbeError as exc:
            kind = exc.kind
        except Exception:
            kind = "http"
        else:
            kind = None
        with _lock:
            if kind is None:
                _state["up"] = 1
                _state["latency"] = time.monotonic() - started
                _state["last_success"] = time.time()
            else:
                _state["up"] = 0
                _state["errors"][kind] = _state["errors"].get(kind, 0) + 1

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/readyz"):
                body = b"ok\n"  # proceso vivo: up=0 es métrica, no enfermedad del pod
            elif self.path.startswith("/metrics"):
                with _lock:
                    lines = [
                        "atlassian_mcp_tool_up %d" % _state["up"],
                        "atlassian_mcp_tool_latency_seconds %g" % _state["latency"],
                        "atlassian_mcp_tool_last_success_timestamp_seconds %g" % _state["last_success"],
                    ]
                    lines += ['atlassian_mcp_probe_errors_total{kind="%s"} %d' % (k, n)
                              for k, n in sorted(_state["errors"].items())]
                body = ("\n".join(lines) + "\n").encode()
            else:
                self.send_response(404)
                self.end_headers()
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    def loop():
        while True:
            cycle()
            time.sleep(INTERVAL)

    def main():
        threading.Thread(target=loop, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()

    if __name__ == "__main__":
        main()
---
# Secreto SOLO del client Keycloak de la sonda (forma Connect medida en SC-1742: el
# proveedor parsea remoteRef.key como <item>/<field>; Kyverno admite el store viejo y lo
# reescribe a onepassword-connect, como en jira-agent-secretaria). Secret PROPIO (SKIRM-72):
# nunca uno compartido. Ningún valor en git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlassian-mcp-probe
  namespace: monitoring
  labels: { app: atlassian-mcp-probe }
spec:
  refreshInterval: 24h
  secretStoreRef: { kind: ClusterSecretStore, name: onepassword }
  target: { name: atlassian-mcp-probe, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: client_secret, remoteRef: { key: atlassian-mcp-probe/client_secret } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlassian-mcp-probe
  namespace: monitoring
  labels: { app: atlassian-mcp-probe, app.kubernetes.io/part-of: company-observability }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: atlassian-mcp-probe } }
  template:
    metadata:
      labels: { app: atlassian-mcp-probe }
      annotations:
        # sha256 del data.probe.py del ConfigMap de arriba (patrón checksum/config del
        # gateway): el ConfigMap se monta plano (sin generator), así que sin esta anotación
        # editar probe.py NO reiniciaría el pod. tests/test_atlassian_mcp_probe.py la compara
        # con el hash real: cambiar el script sin refrescarla rompe CI.
        checksum/script: "sha256:c6f1c1e792c2fad8a3211ec9345ea228789aa7382bc61c88cb0dd8a3143f0728"
    spec:
      containers:
        - name: probe
          # python:3.12-slim — mismo precedente de imagen stdlib-del-repo (aurora-brain-kb-sync).
          image: python:3.12-slim
          command: ["python", "/probe/probe.py"]
          ports: [{ name: metrics, containerPort: 9114 }]
          env:
            # PROBE_ISSUE_KEY: la Task fija «sonda — no tocar» de SC la entregó IT (SC-1927,
            # entregada en SC-1918). Vacía = tools/call isError = up=0, sin fingir salud.
            - { name: PROBE_ISSUE_KEY, value: "SC-1927" }
            - name: PROBE_CLIENT_SECRET
              valueFrom:
                # optional: el Secret no existe hasta que IT cree el ítem; el pod arranca
                # igualmente y la sonda reporta up=0 (kind=http por el 401 del token).
                secretKeyRef: { name: atlassian-mcp-probe, key: client_secret, optional: true }
          volumeMounts:
            # ConfigMap plano: lo que rueda el pod al editar el script es la anotación
            # checksum/script del template, no un hash del generator.
            - { name: script, mountPath: /probe, readOnly: true }
          readinessProbe: { httpGet: { path: /readyz, port: metrics }, initialDelaySeconds: 3, periodSeconds: 15 }
          livenessProbe: { httpGet: { path: /readyz, port: metrics }, initialDelaySeconds: 15, periodSeconds: 30 }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
      volumes:
        - name: script
          configMap: { name: atlassian-mcp-probe-script }
---
apiVersion: v1
kind: Service
metadata:
  name: atlassian-mcp-probe
  namespace: monitoring
  labels: { app: atlassian-mcp-probe }
spec:
  selector: { app: atlassian-mcp-probe }
  ports: [{ name: metrics, port: 9114, targetPort: metrics }]
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: atlassian-mcp-probe
  namespace: monitoring
  labels: { app.kubernetes.io/part-of: company-observability }
spec:
  selector: { matchLabels: { app: atlassian-mcp-probe } }
  endpoints:
    - port: metrics
      path: /metrics
      # La sonda sondea cada 60 s; scrapear a 30 s mantiene la serie fresca para el
      # `for: 5m` de la VMRule (H5) sin duplicar trabajo.
      interval: 30s
      scrapeTimeout: 10s
---
# monitoring no tiene default-deny, así que esta política SOLO aplica sobre el pod de la
# sonda: el /metrics lo lee vmagent y nadie más (patrón opencode-node-ops en este repo).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlassian-mcp-probe
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app: atlassian-mcp-probe } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: vmagent } }
      ports: [{ protocol: TCP, port: 9114 }]
