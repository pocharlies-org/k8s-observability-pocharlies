apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: whatsapp-mcp-telegram
  namespace: monitoring
  annotations:
    note: |
      Direct Telegram alerts for whatsapp-mcp messaging health (added 2026-06-02,
      moved to GitOps 2026-06-03). The synapse-webhook path routes alerts to the
      ops-explainer, which only renders SynapseWorkflowFailed — infra alerts for
      whatsapp-mcp (KubernetesDeploymentUnavailable, KubePodCrashLooping, ...) die
      there silently. This config gives those a NATIVE Alertmanager Telegram leg:
      namespace=whatsapp-mcp + severity=critical -> the Synapse monitor group
      (General topic, chat -1003785136626). Bot token in secret
      monitoring/alertmanager-telegram-backup (see alertmanager-secrets.yaml).
spec:
  receivers:
    - name: messaging-telegram
      telegram_configs:
        - bot_token:
            name: alertmanager-telegram-backup
            key: bot_token
          chat_id: -1003785136626
          parse_mode: HTML
          send_resolved: true
          message: |-
            {{ if eq .Status "firing" }}🔴 CAÍDA{{ else }}✅ RECUPERADO{{ end }} <b>mensajería (whatsapp-mcp)</b> ({{ .Alerts | len }})
            {{ range .Alerts }}- {{ .Labels.alertname }}: {{ .Labels.namespace }}/{{ if .Labels.deployment }}{{ .Labels.deployment }}{{ else }}{{ .Labels.pod }}{{ end }} [{{ .Labels.severity }}]
            {{ end }}
  route:
    receiver: messaging-telegram
    group_by:
      - alertname
      - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 6h
    matchers:
      - namespace = whatsapp-mcp
      - severity = critical
