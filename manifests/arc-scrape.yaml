# INFRA-550 (P4 de INFRA-400) — scrape de ARC y del exporter de cola.
#
# Las métricas `gha_*` del listener/controller de Actions Runner Controller
# (chart 0.14.1) están habilitadas desde hace tiempo en el repo gitops
# (`infra/arc.yaml`: metrics.controllerManagerAddr/listenerAddr :8080) pero
# NADIE las raspaba: el pool era invisible hasta que una épica no mergeaba.
# Nombres y presencia verificados en vivo el 2026-10-06 contra el endpoint
# /metrics del listener `arc-k8s-…` (proxy de API): gha_assigned_jobs,
# gha_running_jobs, gha_registered/busy/idle/desired/min/max_runners,
# gha_started/completed_jobs_total, gha_job_startup/execution_duration_seconds
# (histogramas), y en el controller gha_controller_pending/running/failed_
# ephemeral_runners y gha_controller_running_listeners.
#
# El listener es un Pod sin Service (patrón company/dcgm: VMPodScrape); el
# controller tampoco tiene Service de métricas instalado (verificado:
# `kubectl get svc -n arc-systems` vacío), así que ambos van por VMPodScrape.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: arc
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["arc-systems"]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["controller-manager", "runner-scale-set-listener"]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
---
# El exporter de cola (ci_queue_*): su Deployment y Service viven en
# k8s-gitops-pocharlies (Application `ci-queue-exporter`, path `ci-queue/`);
# el scrape va aquí, como el resto de scrapes de plataforma (patrón
# cert-manager-scrape.yaml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: ci-queue-exporter
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["monitoring"]
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-queue-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
