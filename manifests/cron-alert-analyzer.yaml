# cron-alert-analyzer — receives Alertmanager webhooks for K8sCronJobFailed alerts,
# fetches the failed pod's logs via the k8s API (Loki misses short-lived CronJob
# pods), runs an LLM root-cause analysis via LiteLLM, and posts an
# HTML report to the Telegram "Crons" topic in the synapse group with a
# deep-link to dgx.e-dani.com/crontab.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cron-alert-analyzer
  namespace: monitoring
---
# RBAC: read pods + pod logs + jobs across the whole cluster (since CronJobs
# live in many namespaces). No write permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cron-alert-analyzer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cron-alert-analyzer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cron-alert-analyzer
subjects:
  - kind: ServiceAccount
    name: cron-alert-analyzer
    namespace: monitoring
---
# Non-secret config (chat/thread ids, URLs, tunables).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cron-alert-analyzer
  namespace: monitoring
data:
  TELEGRAM_CHAT_ID: "-1003785136626"        # synapse Telegram group
  TELEGRAM_THREAD_ID: "34494"               # "Crons" topic vigente, verificado por smoke 2026-07-21
  LITELLM_URL: "http://litellm.litellm.svc.cluster.local:4000"
  LITELLM_MODEL: "qwen36-35b"
  DASHBOARD_BASE: "https://dgx.e-dani.com/crontab"
  LOG_TAIL_LINES: "200"
  LLM_MAX_LOG_CHARS: "12000"
  LLM_TIMEOUT_S: "120"
  ENABLE_FIX_BUTTON: "true"
  TELEGRAM_MAX_ATTEMPTS: "3"
  TELEGRAM_RETRY_BASE_S: "1"
  APP_VERSION: "v0.1.4"
  LOG_LEVEL: "INFO"
---
# LiteLLM master key, pulled from the same Vault path that litellm itself uses
# (secret/litellm). Mirrors litellm/litellm-secrets but in the monitoring ns so
# the analyzer can mount it without cross-ns secret access.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cron-alert-analyzer-llm
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cron-alert-analyzer-llm
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: secret/litellm
        property: LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron-alert-analyzer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cron-alert-analyzer
    app.kubernetes.io/component: alert-webhook
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: cron-alert-analyzer }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cron-alert-analyzer
        app.kubernetes.io/component: alert-webhook
    spec:
      serviceAccountName: cron-alert-analyzer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      nodeSelector:
        kubernetes.io/arch: amd64
      # Use the public Harbor endpoint so the webhook can run outside the LAN.
      # This keeps Alertmanager notification delivery available when the single
      # LAN amd64 node is NotReady.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cron-alert-analyzer
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cron-alert-analyzer
      containers:
        - name: analyzer
          image: harbor.e-dani.com/homelab/cron-alert-analyzer:v0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: cron-alert-analyzer }
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: alertmanager-telegram-backup, key: bot_token }
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef: { name: cron-alert-analyzer-llm, key: LITELLM_API_KEY }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cron-alert-analyzer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cron-alert-analyzer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cron-alert-analyzer
---
apiVersion: v1
kind: Service
metadata:
  name: cron-alert-analyzer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cron-alert-analyzer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cron-alert-analyzer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# AgentGateway exemption: /metrics is a cluster-only Prometheus exposition
# endpoint, not an agent-facing API capability. It is read-only, contains only
# aggregate counters/timestamps (no logs, credentials or PII), the Service is
# ClusterIP, and no Ingress/IngressRoute/HTTPRoute publishes it. Exposing it as
# a normal MCP tool would broaden access without an operational use case.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cron-alert-analyzer
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cron-alert-analyzer
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cron-alert-analyzer-delivery
  namespace: monitoring
spec:
  groups:
    - name: cron-alert-analyzer-delivery
      rules:
        - alert: CronAlertAnalyzerTelegramDeliveryFailed
          expr: |
            (
              sum(increase(cron_alert_analyzer_telegram_delivery_attempts_total{result="failure"}[10m])) > 0
            )
            or
            (
              sum(
                (cron_alert_analyzer_telegram_delivery_last_attempt_timestamp_seconds
                  > cron_alert_analyzer_telegram_delivery_last_success_timestamp_seconds)
                and
                (time() - cron_alert_analyzer_telegram_delivery_last_attempt_timestamp_seconds < 10 * 60)
              ) > 0
            )
          for: 1m
          labels:
            severity: warning
            domain: crons
          annotations:
            summary: "cron-alert-analyzer no pudo entregar un aviso a Telegram"
            description: "El analyzer agotó o rechazó una entrega en los últimos 10 minutos. Revisar sus métricas y logs saneados; la alerta usa el receiver de emergencia sin topic."
        - alert: CronAlertAnalyzerLlmFailed
          expr: sum(increase(cron_alert_analyzer_llm_calls_total{result="failure"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
            domain: crons
          annotations:
            summary: "cron-alert-analyzer no pudo generar el análisis LLM"
            description: "Al menos un análisis LLM falló en los últimos 10 minutos. El aviso Telegram conserva un fallback sin análisis; revisar LiteLLM/modelo."
        - alert: CronAlertAnalyzerMetricsMissing
          expr: absent(cron_alert_analyzer_build_info)
          for: 5m
          labels:
            severity: warning
            domain: crons
          annotations:
            summary: "Métricas de cron-alert-analyzer ausentes"
            description: "VictoriaMetrics no ve ninguna réplica de cron-alert-analyzer desde hace 5 minutos."
        - alert: AlertmanagerTelegramDeliveryFailed
          expr: sum by (reason) (increase(alertmanager_notifications_failed_total{integration="telegram"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
            domain: alerting
          annotations:
            summary: "Alertmanager no pudo entregar por Telegram"
            description: "Alertmanager registró fallos Telegram en los últimos 10 minutos. Esta alerta se entrega por el webhook Synapse, no por Telegram."
        - alert: AlertmanagerWebhookDeliveryFailed
          expr: sum by (reason) (increase(alertmanager_notifications_failed_total{integration="webhook"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
            domain: alerting
          annotations:
            summary: "Alertmanager no pudo entregar un webhook"
            description: "Alertmanager registró fallos de webhook en los últimos 10 minutos. Esta alerta usa Telegram directo como ruta cruzada."
