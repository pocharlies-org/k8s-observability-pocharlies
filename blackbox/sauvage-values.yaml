# Segundo prober blackbox, colocado en sauvage (INFRA-1556, SC-5617).
#
# Por qué existe: el blackbox-exporter principal vive en ks5 (node-pool ks5-nvme),
# así que la sonda shared-datastores-tcp mide el path desde ks5. La ruta que quedó
# intermitente el 27-10 (INFRA-1004) es sauvage↔ks5: pérdida de paquetes en el túnel
# k3s + VXLAN hacia 141.94.73.0/24 con el primario en ks5-cp-2. Una sonda desde ks5
# no la ve. Esta instancia mide el path REAL sauvage→primario.
#
# Sustituye al CronJob postgres-rw-connectivity-probe (*/1, nc -z) de k8s-infra:
# mismo camino (DNS del servicio → ClusterIP → DNAT al primario → VXLAN al nodo del
# primario), misma toleración role=edge, pero como VMProbe continua en vez de un Job
# por minuto. El cron muere en el PR compañero de k8s-infra.
#
# SIN hostNetwork a propósito: el cron nc corría con CNI normal, y lo que se quiere
# medir es exactamente ese path de overlay (ClusterIP→DNAT→VXLAN), no el netns del
# nodo. dnsPolicy ClusterFirst resuelve el nombre del servicio como cualquier pod.
fullnameOverride: blackbox-exporter-sauvage

# sauvage es el nodo del edge (OVH, amd64). Fijado por hostname, no por topology,
# para que el scheduler no lo pose en otro nodo y se pierda la ruta que se vigila.
nodeSelector:
  kubernetes.io/hostname: sauvage

# sauvage se registró con --node-taint role=edge:NoSchedule; sin esta toleración el
# pod queda Pending. Es la misma que llevan los deployments de skirmshop del nodo.
tolerations:
  - key: role
    operator: Equal
    value: edge
    effect: NoSchedule

config:
  modules:
    # Sonda TCP al puerto del servicio rw. Sin validación TLS: importa si el TCP
    # abre (la app conecta igual), no el certificado. Mismo timeout que el nc -w 5.
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
