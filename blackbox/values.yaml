fullnameOverride: blackbox-exporter

config:
  modules:
    # Timeout 8s (SC-2977): a 5s timeout equals the resolver's 5s retry window, so every
    # DNS stall (CoreDNS conntrack race) failed the probe outright — bursts of false
    # AffiliateAppPublicDown/CRIT from stalls, not outages. 8s absorbs the retry and still
    # fits the 10s scrapeTimeout of every VMProbe; a real failure fails at 8s and the >3m
    # alert rules are unchanged.
    http_alive:
      prober: http
      timeout: 8s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 204, 301, 302, 401, 403]
        follow_redirects: true
        preferred_ip_protocol: ip4
    http_alive_tls:
      prober: http
      timeout: 8s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 204, 301, 302, 401, 403]
        follow_redirects: true
        fail_if_not_ssl: true
        preferred_ip_protocol: ip4
    http_alive_tls_no_redirect:
      prober: http
      timeout: 8s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 204, 301, 302, 401, 403]
        follow_redirects: false
        fail_if_not_ssl: true
        preferred_ip_protocol: ip4
    # Edge check for the Synapse business webhooks (INFRA-1536). A GET to
    # the POST-only /webhooks/stripe answers 405 when the gateway is up —
    # that is the success signal. The probe targets sauvage's tailnet IP
    # (see manifests/probes.yaml), so Host and SNI must carry the real
    # hostname for traefik-edge to route and for the cert to validate.
    http_synapse_edge:
      prober: http
      timeout: 5s
      http:
        method: GET
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 204, 405]
        fail_if_not_ssl: true
        preferred_ip_protocol: ip4
        headers:
          Host: synapse.e-dani.com
        tls_config:
          server_name: synapse.e-dani.com
    # Service-level reachability for the shared datastores. Pod metrics lied
    # during the 2026-07-20 node freeze (kubelet dead => stale ready=1); a TCP
    # connect through the Service VIP is the signal consumers actually see.
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4

nodeSelector:
  node-pool: ks5-nvme

tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi
