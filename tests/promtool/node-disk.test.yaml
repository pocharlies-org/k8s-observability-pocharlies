# Casos de NodeRootDiskLowOrFilling (promtool test rules, INFRA-623). `rules` la genera
# tests/test_infra623_node_disk_promtool.py desde la VMRule pocharlies-node-disk.
# Disco de 1000 GB (1e12 bytes) para que los porcentajes se lean a ojo.
# El matcher `node` de la regla cubre ubuntu y sauvage (SC-2986): los dos casos que
# saltan son uno de cada nodo; el Spark (dgx3) comprueba que sigue fuera.
rule_files:
  - node-disk.rules.yaml
evaluation_interval: 5m
tests:
  - interval: 5m
    name: ubuntu, menos del 20 % libre (15 %) estable -> salta pasados los 30 min
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/mapper/ubuntu--vg-ubuntu--lv",instance="10.42.0.147:9100",pod="vm-prometheus-node-exporter-aaaaa"}'
        values: '150000000000x20'
      - series: 'node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/mapper/ubuntu--vg-ubuntu--lv",instance="10.42.0.147:9100",pod="vm-prometheus-node-exporter-aaaaa"}'
        values: '1000000000000x20'
      - series: 'kube_pod_info{namespace="monitoring",pod="vm-prometheus-node-exporter-aaaaa",node="ubuntu"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeRootDiskLowOrFilling
        exp_alerts: []
      - eval_time: 40m
        alertname: NodeRootDiskLowOrFilling
        exp_alerts:
          - exp_labels: {severity: critical, area: capacity, job: node-exporter, mountpoint: "/", fstype: ext4, device: /dev/mapper/ubuntu--vg-ubuntu--lv, instance: "10.42.0.147:9100", pod: vm-prometheus-node-exporter-aaaaa}
            exp_annotations:
              summary: "Disco raíz del nodo (vm-prometheus-node-exporter-aaaaa): poco espacio libre o se llena en menos de 3 días"
              description: "A / de 10.42.0.147:9100 (/dev/mapper/ubuntu--vg-ubuntu--lv) le queda el 15.0 % libre. El nodo: `kubectl get pod -n monitoring vm-prometheus-node-exporter-aaaaa -o jsonpath='{.spec.nodeName}'`. Salta con menos del 20 % libre o si al ritmo de las últimas 6 h se llena en menos de 3 días. Por debajo del 5 % el kubelet entra en disk-pressure y desaloja pods (el 07-10: AdGuard, el DNS de la LAN). Mirar qué crece (du por directorio: /var/lib/longhorn, /home, /srv, /tmp) y liberar caché. En sauvage lo que crece es /srv/minio/data (velero-backups, harbor-blobs, cnpg-backups)."
  - interval: 5m
    name: sauvage (hub de backups), menos del 20 % libre (15 %) -> salta; es el caso del 25-10
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/md3",instance="10.42.4.114:9100",pod="vm-prometheus-node-exporter-ccccc"}'
        values: '150000000000x20'
      - series: 'node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/md3",instance="10.42.4.114:9100",pod="vm-prometheus-node-exporter-ccccc"}'
        values: '1000000000000x20'
      - series: 'kube_pod_info{namespace="monitoring",pod="vm-prometheus-node-exporter-ccccc",node="sauvage"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeRootDiskLowOrFilling
        exp_alerts: []
      - eval_time: 40m
        alertname: NodeRootDiskLowOrFilling
        exp_alerts:
          - exp_labels: {severity: critical, area: capacity, job: node-exporter, mountpoint: "/", fstype: ext4, device: /dev/md3, instance: "10.42.4.114:9100", pod: vm-prometheus-node-exporter-ccccc}
            exp_annotations:
              summary: "Disco raíz del nodo (vm-prometheus-node-exporter-ccccc): poco espacio libre o se llena en menos de 3 días"
              description: "A / de 10.42.4.114:9100 (/dev/md3) le queda el 15.0 % libre. El nodo: `kubectl get pod -n monitoring vm-prometheus-node-exporter-ccccc -o jsonpath='{.spec.nodeName}'`. Salta con menos del 20 % libre o si al ritmo de las últimas 6 h se llena en menos de 3 días. Por debajo del 5 % el kubelet entra en disk-pressure y desaloja pods (el 07-10: AdGuard, el DNS de la LAN). Mirar qué crece (du por directorio: /var/lib/longhorn, /home, /srv, /tmp) y liberar caché. En sauvage lo que crece es /srv/minio/data (velero-backups, harbor-blobs, cnpg-backups)."
  - interval: 5m
    name: ubuntu, 50 % libre pero bajando 400 GB/día (se llena en ~1,3 días; a las 9 h quedan 350 GB) -> salta por la predicción
    input_series:
      # 500 GB libres bajando 1,39 GB por paso de 5 min (400 GB/día) durante 10 h
      - series: 'node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/mapper/ubuntu--vg-ubuntu--lv",instance="10.42.0.147:9100",pod="vm-prometheus-node-exporter-aaaaa"}'
        values: '500000000000-1388888889x120'
      - series: 'node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/mapper/ubuntu--vg-ubuntu--lv",instance="10.42.0.147:9100",pod="vm-prometheus-node-exporter-aaaaa"}'
        values: '1000000000000x120'
      - series: 'kube_pod_info{namespace="monitoring",pod="vm-prometheus-node-exporter-aaaaa",node="ubuntu"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 9h
        alertname: NodeRootDiskLowOrFilling
        exp_alerts:
          - exp_labels: {severity: critical, area: capacity, job: node-exporter, mountpoint: "/", fstype: ext4, device: /dev/mapper/ubuntu--vg-ubuntu--lv, instance: "10.42.0.147:9100", pod: vm-prometheus-node-exporter-aaaaa}
            exp_annotations:
              summary: "Disco raíz del nodo (vm-prometheus-node-exporter-aaaaa): poco espacio libre o se llena en menos de 3 días"
              description: "A / de 10.42.0.147:9100 (/dev/mapper/ubuntu--vg-ubuntu--lv) le queda el 35.0 % libre. El nodo: `kubectl get pod -n monitoring vm-prometheus-node-exporter-aaaaa -o jsonpath='{.spec.nodeName}'`. Salta con menos del 20 % libre o si al ritmo de las últimas 6 h se llena en menos de 3 días. Por debajo del 5 % el kubelet entra en disk-pressure y desaloja pods (el 07-10: AdGuard, el DNS de la LAN). Mirar qué crece (du por directorio: /var/lib/longhorn, /home, /srv, /tmp) y liberar caché. En sauvage lo que crece es /srv/minio/data (velero-backups, harbor-blobs, cnpg-backups)."
  - interval: 5m
    name: ubuntu, 30 % libre goteando 30 GB/día (se llenaría en ~10 días) -> no salta
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/mapper/ubuntu--vg-ubuntu--lv",instance="10.42.0.147:9100",pod="vm-prometheus-node-exporter-aaaaa"}'
        values: '300000000000-104166667x120'
      - series: 'node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/mapper/ubuntu--vg-ubuntu--lv",instance="10.42.0.147:9100",pod="vm-prometheus-node-exporter-aaaaa"}'
        values: '1000000000000x120'
      - series: 'kube_pod_info{namespace="monitoring",pod="vm-prometheus-node-exporter-aaaaa",node="ubuntu"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 9h
        alertname: NodeRootDiskLowOrFilling
        exp_alerts: []
  - interval: 5m
    name: Spark (dgx3), fuera del matcher, con el 5 % libre -> no salta
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/nvme0n1p2",instance="10.42.1.173:9100",pod="vm-prometheus-node-exporter-bbbbb"}'
        values: '50000000000x20'
      - series: 'node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype="ext4",device="/dev/nvme0n1p2",instance="10.42.1.173:9100",pod="vm-prometheus-node-exporter-bbbbb"}'
        values: '1000000000000x20'
      - series: 'kube_pod_info{namespace="monitoring",pod="vm-prometheus-node-exporter-bbbbb",node="dgx3"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 50m
        alertname: NodeRootDiskLowOrFilling
        exp_alerts: []
