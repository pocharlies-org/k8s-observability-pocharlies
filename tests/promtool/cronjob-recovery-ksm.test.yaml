# SC-6885 (SC-6877, CRON-21322): la supresion por recuperacion de
# K8sCronJobFailed se lee del status del CronJob
# (kube_cronjob_status_last_successful_time), no de la supervivencia del objeto
# Job de exito. Caso real del 27-11: el dump se reejecuto con exito, la alerta
# se calmo; al borrar el Job de repro el ultimo Job del CronJob volvia a ser el
# fallido (dejado como evidencia, sin TTL) y el unless viejo —que pedia
# kube_job_status_succeeded del Job de exito— reabria la alerta (incidente
# fantasma, misma keep-causa cron-job-failed:a045103c96).
rule_files:
  - cronjob-recovery-ksm.rules.yaml
evaluation_interval: 10m
tests:
  # Criterio 1: Job fallido presente + exito posterior BORRADO del cluster
  # (sin series kube_job_* del Job de exito) => NO firing.
  - interval: 10m
    name: exito posterior borrado del cluster — el status del CronJob suprime (SC-6877)
    input_series:
      - series: 'kube_job_failed{namespace="keycloak", job_name="logical-dump-keycloak-postgres-29929210", condition="true"}'
        values: '1x61'
      - series: 'kube_job_owner{namespace="keycloak", job_name="logical-dump-keycloak-postgres-29929210", owner_name="logical-dump-keycloak-postgres", owner_kind="CronJob"}'
        values: '1x61'
      - series: 'kube_job_status_start_time{namespace="keycloak", job_name="logical-dump-keycloak-postgres-29929210"}'
        values: '1000000x61'
      - series: 'kube_cronjob_status_last_successful_time{namespace="keycloak", cronjob="logical-dump-keycloak-postgres"}'
        values: '1003600x61'
    alert_rule_test:
      - eval_time: 10h
        alertname: K8sCronJobFailed
        exp_alerts: []
  # Criterio 2: fallo real del ultimo ciclo (el ultimo exito del CronJob es
  # anterior al arranque del Job fallido) => sigue firing.
  - interval: 10m
    name: ultimo exito anterior al fallo — firing (no se pierde cobertura)
    input_series:
      - series: 'kube_job_failed{namespace="keycloak", job_name="logical-dump-keycloak-postgres-29929900", condition="true"}'
        values: '1x61'
      - series: 'kube_job_owner{namespace="keycloak", job_name="logical-dump-keycloak-postgres-29929900", owner_name="logical-dump-keycloak-postgres", owner_kind="CronJob"}'
        values: '1x61'
      - series: 'kube_job_status_start_time{namespace="keycloak", job_name="logical-dump-keycloak-postgres-29929900"}'
        values: '1000000x61'
      - series: 'kube_cronjob_status_last_successful_time{namespace="keycloak", cronjob="logical-dump-keycloak-postgres"}'
        values: '900000x61'
    alert_rule_test:
      - eval_time: 10h
        alertname: K8sCronJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, area: kubernetes, domain: crons, namespace: keycloak, owner_name: logical-dump-keycloak-postgres}
            exp_annotations:
              summary: "CronJob keycloak/logical-dump-keycloak-postgres failed"
              description: "The latest Job of CronJob keycloak/logical-dump-keycloak-postgres has failed (kubectl -n keycloak get jobs). Keep groups the alert into a CRON incident and notifies the Infra topic (1248) of Pocharlies Operations, with root-cause analysis via Aurora."
  # CronJob que nunca tuvo exito (sin metrica de status): el fallo del primer
  # ciclo dispara — la ausencia del metrico no suprime.
  - interval: 10m
    name: CronJob sin ningun exito previo — el fallo dispara
    input_series:
      - series: 'kube_job_failed{namespace="litellm", job_name="litellm-fork-update-1762000000", condition="true"}'
        values: '1x61'
      - series: 'kube_job_owner{namespace="litellm", job_name="litellm-fork-update-1762000000", owner_name="litellm-fork-update", owner_kind="CronJob"}'
        values: '1x61'
      - series: 'kube_job_status_start_time{namespace="litellm", job_name="litellm-fork-update-1762000000"}'
        values: '1000000x61'
    alert_rule_test:
      - eval_time: 10h
        alertname: K8sCronJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, area: kubernetes, domain: crons, namespace: litellm, owner_name: litellm-fork-update}
            exp_annotations:
              summary: "CronJob litellm/litellm-fork-update failed"
              description: "The latest Job of CronJob litellm/litellm-fork-update has failed (kubectl -n litellm get jobs). Keep groups the alert into a CRON incident and notifies the Infra topic (1248) of Pocharlies Operations, with root-cause analysis via Aurora."
