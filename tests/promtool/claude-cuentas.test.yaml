# Casos de la VMRule pocharlies-claude-cuentas (promtool test rules, SC-5262): el hombre muerto
# del monitor de cuentas de Claude. El VALOR de la serie es el epoch de la pasada (en promtool el
# tiempo empieza en 0, así que una pasada a las 24 h vale 86400). Las anotaciones esperadas salen
# de la VMRule: si cambia su texto, se regenera este fichero desde el manifiesto.
rule_files:
- claude-cuentas.rules.yaml
evaluation_interval: 15m
tests:
- interval: 1h
  name: los dos sitios pasan a su ritmo (x86 diario, pod cada 6 h) -> no salta nada
  input_series:
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="x86"}
    values: 0 _x23 86400 _x23 172800 _x23
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="pod"}
    values: 0 _x5 21600 _x5 43200 _x5 64800 _x5 86400 _x5 108000 _x5 129600 _x5 151200 _x5 172800 _x5 194400
  alert_rule_test:
  - eval_time: 50h
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts: []
- interval: 1h
  name: 'el x86 deja de pasar (el 07-11: 203/EXEC cada mañana) -> salta pasadas 48 h, el pod sigue callado'
  input_series:
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="x86"}
    values: '0'
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="pod"}
    values: 0 _x5 21600 _x5 43200 _x5 64800 _x5 86400 _x5 108000 _x5 129600 _x5 151200 _x5 172800 _x5 194400
  alert_rule_test:
  - eval_time: 47h
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts: []
  - eval_time: 49h
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts:
    - &id001
      exp_labels:
        severity: warning
        cuenta: monitor-x86
        sitio: x86
        causa: sin-pasada
      exp_annotations:
        summary: 'El monitor de cuentas de Claude del x86 lleva más de 48 h sin completar una pasada: nadie renueva sus logins'
        description: 'claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="x86"} no se ha actualizado en más de dos intervalos del timer diario. En el x86: `systemctl --user status claude-cuentas-monitor.service claude-cuentas-monitor.timer` y `journalctl --user -u claude-cuentas-monitor.service -n 50` (el 07-11 fue un 203/EXEC por un python que ya no existía). Una pasada a mano: `systemctl --user start claude-cuentas-monitor.service`.'
- interval: 1h
  name: el bucle del pod deja de pasar -> salta pasadas 12 h
  input_series:
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="x86"}
    values: 0 _x23 86400 _x23 172800 _x23
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="pod"}
    values: '0'
  alert_rule_test:
  - eval_time: 11h
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts: []
  - eval_time: 13h
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts:
    - &id002
      exp_labels:
        severity: warning
        cuenta: monitor-pod
        sitio: pod
        causa: sin-pasada
      exp_annotations:
        summary: 'El monitor de cuentas de Claude del pod company-0 lleva más de 12 h sin completar una pasada: nadie renueva los logins de la compañía'
        description: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="pod"} no se ha actualizado en más de dos vueltas de la línea `cada 21600 cuentas-renovar` del bucle company-cron (k8s-paseo-pocharlies, k8s/company.yaml). Mirar `kubectl -n paseo logs company-0 -c company-cron | grep cuentas-renovar` y que la línea esté en el bucle en marcha (se lee al arrancar el contenedor).
- interval: 1h
  name: el x86 vuelve a pasar -> se resuelve con el primer latido nuevo
  input_series:
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="x86"}
    values: 0 _x49 180000
  - series: claude_cuentas_monitor_ultima_pasada_timestamp_seconds{sitio="pod"}
    values: 0 _x5 21600 _x5 43200 _x5 64800 _x5 86400 _x5 108000 _x5 129600 _x5 151200 _x5 172800 _x5 194400
  alert_rule_test:
  - eval_time: 49h
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts:
    - *id001
  - eval_time: 51h
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts: []
- interval: 15m
  name: ningún latido nunca (monitor sin desplegar o muerto antes de su primera pasada) -> absent dispara en los dos
  input_series: []
  alert_rule_test:
  - eval_time: 10m
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts: []
  - eval_time: 30m
    alertname: ClaudeCuentasRenovarFallo
    exp_alerts:
    - *id001
    - *id002
