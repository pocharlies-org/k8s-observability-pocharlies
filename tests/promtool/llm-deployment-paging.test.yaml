# Casos de KubernetesDeploymentUnavailable y LlmResidentDeploymentUnavailable
# (promtool test rules, SC-2641 / DEPL-15279). `rules` la genera
# tests/test_sc2641_llm_deployment_paging_promtool.py desde la VMRule
# pocharlies-service-visibility.
# Escenario real: cada cambio de variante del qwen38 recrea el pod del head y el
# modelo tarda 1-3 h en cargar (spec=1, available=0). Antes de SC-2641 eso montaba
# el incidente DEPL con la crítica de 15 min; los nombres muertos del regex
# (vllm-.*, .*-bench) además dejaban a los actuales sin la cobertura de 2 h.
rule_files:
  - llm-deployment-paging.rules.yaml
evaluation_interval: 10m
tests:
  - interval: 10m
    name: cambio de variante del qwen38 (head sin réplica 3 h) -> no salta la de 15 min; a las 2 h salta la de LLM
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="llm",deployment="qwen38-flash-next-head"}'
        values: '1x40'
      - series: 'kube_deployment_status_replicas_available{namespace="llm",deployment="qwen38-flash-next-head"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts: []
      - eval_time: 90m
        alertname: LlmResidentDeploymentUnavailable
        exp_alerts: []
      - eval_time: 190m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts: []
      - eval_time: 190m
        alertname: LlmResidentDeploymentUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, area: kubernetes, workload_class: gpu-llm, namespace: llm, deployment: qwen38-flash-next-head}
            exp_annotations:
              summary: "LLM resident deployment unavailable"
              description: "llm/qwen38-flash-next-head is still unavailable after 2 hours; inspect GPU scheduling, model startup and the compute profile (gpu-arbiter-state)."
  - interval: 10m
    name: el worker de dgx3 (ventana creativa) tampoco dispara la genérica
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="llm",deployment="qwen38-flash-next-worker-dgx3"}'
        values: '1x40'
      - series: 'kube_deployment_status_replicas_available{namespace="llm",deployment="qwen38-flash-next-worker-dgx3"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 190m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts: []
  - interval: 10m
    name: un deployment normal (skirmshop/picker) sin réplica sigue disparando a los 15 min
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="skirmshop",deployment="picker"}'
        values: '1x10'
      - series: 'kube_deployment_status_replicas_available{namespace="skirmshop",deployment="picker"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, area: kubernetes, namespace: skirmshop, deployment: picker, workload: picker}
            exp_annotations:
              summary: "Deployment unavailable"
              description: "skirmshop/picker has fewer available replicas than desired."
  # SC-4763 (DEPL-18565): la ventana creative de dgx3 sube el aprovisionador y la
  # caché de imágenes a 1 y no quedan Ready hasta tener los pesos en sitio
  # (dgx3_mode.py: OPEN_TIMEOUT_S 2 h). Medido 06-11: spec=1 desde 07:26Z, Ready
  # 07:47Z → la genérica de 15 min montaba un incidente DEPL en cada apertura.
  - interval: 10m
    name: aprovisionador de la ventana dgx3 (pesos bajando 30 min) no dispara la genérica
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="comfyui",deployment="dgx3-provision"}'
        values: '1x40'
      - series: 'kube_deployment_status_replicas_available{namespace="comfyui",deployment="dgx3-provision"}'
        values: '0x40'
      - series: 'kube_deployment_spec_replicas{namespace="comfyui",deployment="comfyui-image-cache"}'
        values: '1x40'
      - series: 'kube_deployment_status_replicas_available{namespace="comfyui",deployment="comfyui-image-cache"}'
        values: '0x40'
      - series: 'kube_deployment_labels{namespace="comfyui",deployment="dgx3-provision",label_dgx_infra_dgx3_window="true"}'
        values: '1x40'
      - series: 'kube_deployment_labels{namespace="comfyui",deployment="comfyui-image-cache",label_dgx_infra_dgx3_window="true"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts: []
      - eval_time: 190m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts: []
  # SC-6138 (DEPL-20132): la lista por nombre dejó fuera las cachés de imagen de la
  # ventana en otros namespaces. Medido 20-11: partcrafter-image-cache spec=1 a las
  # 14:48Z, 29m45s bajando 12 GB, Available 15:17Z → crítica a las 15:03Z.
  - interval: 1m
    name: caché de imagen de la ventana dgx3 en otro namespace (partcrafter) no dispara la genérica
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="partcrafter",deployment="partcrafter-image-cache"}'
        values: '1x40'
      - series: 'kube_deployment_status_replicas_available{namespace="partcrafter",deployment="partcrafter-image-cache"}'
        values: '0x29 1x10'
      - series: 'kube_deployment_labels{namespace="partcrafter",deployment="partcrafter-image-cache",label_dgx_infra_dgx3_window="true"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts: []
  - interval: 1m
    name: un Deployment sin la etiqueta de la ventana en el mismo namespace SÍ dispara
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="partcrafter",deployment="partcrafter"}'
        values: '1x40'
      - series: 'kube_deployment_status_replicas_available{namespace="partcrafter",deployment="partcrafter"}'
        values: '0x40'
      - series: 'kube_deployment_labels{namespace="partcrafter",deployment="partcrafter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, area: kubernetes, namespace: partcrafter, deployment: partcrafter, workload: partcrafter}
            exp_annotations:
              summary: "Deployment unavailable"
              description: "partcrafter/partcrafter has fewer available replicas than desired."
