# DGX-1581: el fallo persistente sigue siendo visible pasado el arranque del
# Job (promtool test rules). Antes la ventana `start_time > time() - 14400` lo
# ocultaba a las 4 h; ahora manda el `unless` de succeeded-más-reciente.
rule_files:
  - cronjob-window.rules.yaml
evaluation_interval: 10m
tests:
  - interval: 10m
    name: fallo del Job arrancado hace >4 h sigue firing (era invisible con la ventana)
    input_series:
      - series: 'kube_job_failed{namespace="litellm", job_name="litellm-fork-update-1762000000", condition="true"}'
        values: '1x61'
      - series: 'kube_job_owner{namespace="litellm", job_name="litellm-fork-update-1762000000", owner_name="litellm-fork-update", owner_kind="CronJob"}'
        values: '1x61'
      - series: 'kube_job_status_start_time{namespace="litellm", job_name="litellm-fork-update-1762000000"}'
        values: '14400x61'
    alert_rule_test:
      - eval_time: 10h
        alertname: K8sCronJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, area: kubernetes, domain: crons, namespace: litellm, owner_name: litellm-fork-update}
            exp_annotations:
              summary: "CronJob litellm/litellm-fork-update failed"
              description: "The latest Job of CronJob litellm/litellm-fork-update has failed (kubectl -n litellm get jobs). Keep groups the alert into a CRON incident and notifies the Infra topic (1248) of Pocharlies Operations, with root-cause analysis via Aurora."
  - interval: 10m
    name: un Job succeeded mas reciente apaga la alerta (el unless sigue mandando)
    input_series:
      - series: 'kube_job_failed{namespace="litellm", job_name="litellm-fork-update-1762000000", condition="true"}'
        values: '1x61'
      - series: 'kube_job_owner{namespace="litellm", job_name="litellm-fork-update-1762000000", owner_name="litellm-fork-update", owner_kind="CronJob"}'
        values: '1x61'
      - series: 'kube_job_status_start_time{namespace="litellm", job_name="litellm-fork-update-1762000000"}'
        values: '14400x61'
      - series: 'kube_job_owner{namespace="litellm", job_name="litellm-fork-update-1762000900", owner_name="litellm-fork-update", owner_kind="CronJob"}'
        values: '1x61'
      - series: 'kube_job_status_start_time{namespace="litellm", job_name="litellm-fork-update-1762000900"}'
        values: '20000x61'
      - series: 'kube_job_status_succeeded{namespace="litellm", job_name="litellm-fork-update-1762000900"}'
        values: '1x61'
    alert_rule_test:
      - eval_time: 10h
        alertname: K8sCronJobFailed
        exp_alerts: []
