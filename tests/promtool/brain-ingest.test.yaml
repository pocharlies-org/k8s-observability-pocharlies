# INFRA-376: casos de BrainIngestConsecutiveFailures (promtool test rules).
# `rules` la genera tests/test_infra376_brain_ingest_promtool.py desde la VMRule.
# SC-1438: el regex se ancla a sufijo numérico (Jobs que genera el CronJob),
# así que los Jobs de prueba brain-ingest-t287*-fail* NO deben disparar.
rule_files:
  - brain-ingest.rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    name: brain-windows x2 (sufijo numérico) dispara y nombra ambos Jobs
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-windows-2958000", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-windows-2958005", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts:
          - exp_labels: {severity: warning, area: kubernetes, domain: crons, namespace: whatsapp-mcp}
            exp_annotations:
              summary: "brain-ingest/brain-windows acumula fallos consecutivos (2 jobs fallidos en 15 min: brain-windows-2958000 brain-windows-2958005 )"
              description: "Two or more distinct brain-ingest / brain-windows Jobs in namespace whatsapp-mcp have had kube_job_failed condition=true within the last 15 minutes (names in the summary). A single failure does not fire this alert; consecutive failures of the 5-minute CronJob do."
  - interval: 1m
    name: SC-1438 brain-ingest-29847000 + 29847005 (Jobs reales del CronJob) SI dispara
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-29847000", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-29847005", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts:
          - exp_labels: {severity: warning, area: kubernetes, domain: crons, namespace: whatsapp-mcp}
            exp_annotations:
              summary: "brain-ingest/brain-windows acumula fallos consecutivos (2 jobs fallidos en 15 min: brain-ingest-29847000 brain-ingest-29847005 )"
              description: "Two or more distinct brain-ingest / brain-windows Jobs in namespace whatsapp-mcp have had kube_job_failed condition=true within the last 15 minutes (names in the summary). A single failure does not fire this alert; consecutive failures of the 5-minute CronJob do."
  - interval: 1m
    name: SC-1438 Jobs de prueba t287-fail1 + t287c-fail2 NO disparan
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287-fail1", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287c-fail2", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts: []
  - interval: 1m
    name: SC-1438 la tanda completa t287/t287b/t287c fail1+fail2 NO dispara
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287-fail1", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287-fail2", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287b-fail1", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287b-fail2", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287c-fail1", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287c-fail2", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts: []
  - interval: 1m
    name: SC-1438 un Job de prueba + uno real fallando NO disparan (solo 1 cuenta)
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-t287-fail1", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-29847000", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts: []
  - interval: 1m
    name: un Complete (skip) + 1 fallido NO dispara
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-29847000", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-29847005", condition="true"}'
        values: '0x12'
      - series: 'kube_job_complete{namespace="whatsapp-mcp", job_name="brain-ingest-29847005", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts: []
  - interval: 1m
    name: otro-job fallido x2 NO dispara
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="otro-job-a", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="otro-job-b", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts: []
  - interval: 1m
    name: un fallido en cada namespace NO dispara (agrega por namespace)
    input_series:
      - series: 'kube_job_failed{namespace="whatsapp-mcp", job_name="brain-ingest-29847000", condition="true"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="otro-ns", job_name="brain-ingest-29847005", condition="true"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: BrainIngestConsecutiveFailures
        exp_alerts: []
  - interval: 5m
    name: INFRA-364 BrainWindowsMassDeleteRefused dispara con un rechazo en la ultima hora
    input_series:
      - series: 'brain_windows_refused_deletes{account="personal"}'
        values: '0 0 60 0 0'
      - series: 'brain_windows_refused_deletes{account="professional"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 15m
        alertname: BrainWindowsMassDeleteRefused
        exp_alerts:
          - exp_labels: {severity: warning, area: kubernetes, domain: crons, namespace: whatsapp-mcp, account: personal}
            exp_annotations:
              summary: "brain-windows rechazó un borrado masivo en la cuenta personal (60 ventanas en una pasada)"
              description: "The brain-windows CronJob (namespace whatsapp-mcp) refused to delete more than BRAIN_WINDOWS_MAX_DELETES_PER_CHAT windows of one chat in a single pass and kept them all. Find the chat in the pass log (\"refusing mass delete\") and check why its rebuilt range lost so many windows before allowing deletes again."
  - interval: 5m
    name: INFRA-364 BrainWindowsMassDeleteRefused calla con pasadas sin rechazo
    input_series:
      - series: 'brain_windows_refused_deletes{account="personal"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 15m
        alertname: BrainWindowsMassDeleteRefused
        exp_alerts: []
  - interval: 10m
    name: INFRA-364 BrainWindowsPassStale dispara si la ultima pasada tiene mas de 90 min
    input_series:
      # una pasada a t=0 (valor 0 s) y luego nada: a t=120m lleva 7200 s
      - series: 'brain_windows_pass_finished_timestamp_seconds{job="brain_windows"}'
        values: '0 _x12'
    alert_rule_test:
      - eval_time: 120m
        alertname: BrainWindowsPassStale
        exp_alerts:
          - exp_labels: {severity: warning, area: kubernetes, domain: crons, namespace: whatsapp-mcp}
            exp_annotations:
              summary: "brain-windows lleva 2h 0m 0s sin terminar una pasada (o sin poder publicar sus métricas)"
              description: "No brain-windows pass has reported brain_windows_pass_finished_timestamp_seconds for over 90 minutes (CronJob every 30 min in namespace whatsapp-mcp). Either the passes are failing or their metrics push to vmsingle stopped; in both cases BrainWindowsMassDeleteRefused cannot be trusted until it is fixed."
  - interval: 10m
    name: INFRA-364 BrainWindowsPassStale calla con pasadas al dia y sin serie
    input_series:
      # el valor sigue al reloj (pasada recien terminada en cada muestra)
      - series: 'brain_windows_pass_finished_timestamp_seconds{job="brain_windows"}'
        values: '0+600x12'
    alert_rule_test:
      - eval_time: 120m
        alertname: BrainWindowsPassStale
        exp_alerts: []

