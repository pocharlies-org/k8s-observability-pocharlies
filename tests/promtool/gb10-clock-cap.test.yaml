# INFRA-1186: casos de SparkGpuClockOverCap (promtool test rules). `rules` la genera
# tests/test_infra1186_gb10_clock_cap_promtool.py desde manifests/gb10-clock-cap-rules.yaml.
# Cubren: reloj bajo el cap (sano), reloj sobre el cap sostenido (dispara tras el for),
# y la exclusión de `ubuntu` (la RTX 3080 Ti de x86 no tiene cap de 2200).
rule_files:
  - gb10-clock-cap.rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    name: reloj 2190 MHz con el cap puesto no dispara
    input_series:
      - series: 'DCGM_FI_DEV_SM_CLOCK{Hostname="dgx3"}'
        values: '2190x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: SparkGpuClockOverCap
        exp_alerts: []

  - interval: 1m
    name: reloj 2457 MHz sostenido dispara pasados los 10 min del for
    input_series:
      - series: 'DCGM_FI_DEV_SM_CLOCK{Hostname="dgx3"}'
        values: '2457x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: SparkGpuClockOverCap
        exp_alerts: []
      - eval_time: 11m
        alertname: SparkGpuClockOverCap
        exp_alerts:
          - exp_labels:
              severity: critical
              area: gpu
              component: gb10-gpu-clock-cap
              Hostname: dgx3
            exp_annotations:
              summary: "Spark con el reloj GPU por encima del cap de 2200 MHz"
              description: >-
                El SM clock raspado por DCGM supera 2200 MHz sostenido 10 min en el
                nodo afectado: el cap térmico del GB10 no está sujetando (timer
                gb10-gpu-clock-cap parado, o el driver pierde el lock más rápido de
                lo que se repone). Es la firma medida antes del hard-halt de dgx3
                del 04-11 (2457 MHz, 97 °C). Comprobar en el host: `systemctl
                list-timers <host>-gpu-clock-cap.timer`, `journalctl -t
                <host>-gpu-clock-cap -n 20` y `nvidia-smi -lgc 0,2200` a mano; si el
                reloj no baja, bajar la carga del nodo antes de que halte.

  - interval: 1m
    name: la RTX de ubuntu queda fuera del filtro aunque pase del umbral
    input_series:
      - series: 'DCGM_FI_DEV_SM_CLOCK{Hostname="ubuntu"}'
        values: '2457x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: SparkGpuClockOverCap
        exp_alerts: []
