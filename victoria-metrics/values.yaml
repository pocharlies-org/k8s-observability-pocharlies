# VictoriaMetrics k8s-stack — drop-in for kube-prometheus-stack, lighter
victoria-metrics-operator:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

defaultRules:
  rules:
    KubeJobFailed:
      create: false
    KubeHpaMaxedOut:
      create: false
    NodeDiskIOSaturation:
      create: false
  groups:
    etcd:
      create: false
    kubernetesSystemControllerManager:
      create: false
    kubeScheduler:
      create: false
    kubernetesSystemScheduler:
      create: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

vmsingle:
  enabled: true
  spec:
    useDefaultResources: false
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 12Gi
    extraArgs:
      maxLabelsPerTimeseries: "200"
    # Keep metrics for 48 hours. This is intentionally expressed in hours so
    # the live CR and the requested policy are unambiguous.
    retentionPeriod: "48h"
    storage:
      accessModes: [ReadWriteOnce]
      storageClassName: longhorn
      resources:
        requests:
          storage: 50Gi
    nodeSelector:
      node-pool: ks5-nvme
      kubernetes.io/arch: amd64

vmcluster:
  enabled: false   # single-node mode

vmagent:
  enabled: true
  spec:
    useDefaultResources: false
    resources:
      requests:
        cpu: 200m
        memory: 300Mi
      limits:
        cpu: "1"
        memory: 750Mi
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi
    extraArgs:
      promscrape.maxScrapeSize: "67108864"
      promscrape.streamParse: "true"
    selectAllByDefault: true
    nodeSelector:
      node-pool: ks5-nvme

vmalert:
  enabled: true
  spec:
    nodeSelector:
      node-pool: ks5-nvme
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi
  remoteWriteVMAgent: false

alertmanager:
  enabled: true
  spec:
    # Drop the per-config `namespace="monitoring"` entry matcher the
    # operator otherwise injects into the synapse-webhook route. Without
    # this, infra alerts (kube-state/node-exporter carry the AFFECTED
    # object's namespace, not "monitoring") never enter the route and are
    # dropped to the blackhole receiver. With it, the route captures ALL
    # alerts regardless of namespace.
    disableNamespaceMatcher: true
    # El hostAliases de synapse.e-dani.com (100.109.183.9) se retiró con el
    # cutover a Keep: la ingesta es ahora in-cluster contra keep-backend, así que
    # Alertmanager ya no resuelve ningún nombre externo. Ver
    # manifests/alertmanager-config.yaml.
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi
    nodeSelector:
      node-pool: ks5-nvme
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true
  adminPassword: "ChangeMe-Grafana-Bootstrap-2026!"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oauth
        key: client-secret
  grafana.ini:
    server:
      domain: grafana.lan.e-dani.com
      root_url: https://grafana.lan.e-dani.com/
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      icon: signin
      allow_sign_up: true
      auto_login: false
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      empty_scopes: false
      auth_url: https://auth-next.e-dani.com/realms/edani/protocol/openid-connect/auth
      token_url: http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/token
      api_url: http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/userinfo
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      role_attribute_path: "contains(groups, `/edani-admins`) && `GrafanaAdmin` || contains(groups, `/edani-operators`) && `Editor` || `Viewer`"
      role_attribute_strict: true
      skip_org_role_sync: false
      allow_assign_grafana_admin: true
      auth_style: InHeader
      use_pkce: true
      validate_id_token: true
      jwk_set_url: http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/certs
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  nodeSelector:
    node-pool: ks5-nvme
  service:
    type: ClusterIP
  # disable ingress here, use Traefik IngressRoute
  ingress:
    enabled: false
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    dashboards:
      enabled: true
      defaultFolderName: General
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      searchNamespace: ALL
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Madrid

# Standard exporters
kubeStateMetrics:
  enabled: true
  nodeSelector:
    node-pool: ks5-nvme

nodeExporter:
  enabled: true

prometheus-node-exporter:
  hostNetwork: false
  nodeSelector: {}
  tolerations:
    - operator: Exists   # let it run on tainted nodes too
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  # NOTE: this list REPLACES the chart's default extraArgs, so we must
  # repeat the upstream filesystem exclude flags in addition to enabling
  # the textfile collector.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
    - --collector.textfile.directory=/host/root/var/lib/ovh-pvc-hub

# Override cadvisor scrape to drop the high-cardinality `id` cgroup label
# (every container restart creates new series). Keep only container_* metrics
# (cadvisor is container-only anyway), then drop the `id` label.
kubelet:
  vmScrapes:
    cadvisor:
      spec:
        metricRelabelConfigs:
          - source_labels: [__name__]
            regex: "container_.+"
            action: keep
          - regex: "id"
            action: labeldrop

# Don't enable the kube-state-metrics subchart on edge (sauvage)
kube-state-metrics:
  metricLabelsAllowlist:
    - services=[infra]
    - namespaces=[infra]
    - persistentvolumeclaims=[excluded_from_alerts]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector:
    node-pool: ks5-nvme
