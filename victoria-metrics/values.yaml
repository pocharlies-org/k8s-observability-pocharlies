# VictoriaMetrics k8s-stack — drop-in for kube-prometheus-stack, lighter
victoria-metrics-operator:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

defaultRules:
  rules:
    KubeJobFailed:
      create: false
    KubeHpaMaxedOut:
      create: false
    NodeDiskIOSaturation:
      create: false
    # Reemplazada por pocharlies-node-memory (manifests/rules.yaml): la copia
    # del chart no puede excluir los Sparks, y con el perfil llm-tp residente
    # nvidia-dgx/gx10-ec3d viven >90 % por diseño (vLLM preasigna el KV cache;
    # gx10-ec3d memoria unificada ~115/119 GB según ~/k8s/CLAUDE.md); dgx3
    # (INFRA-690) también queda fuera: ningún Spark tiene alerta de memoria.
    NodeMemoryHighUtilization:
      create: false
    # SC-5400 (NODE-19133/NODE-18886): misma clase que la de arriba y mismo
    # patrón INFRA-690 — reemplazada por la copia de pocharlies-node-memory
    # (manifests/rules.yaml) con los Sparks excluidos. Disparaba en dgx3 desde
    # el 02-10: con dgx3_mode=llm su vLLM tp1 (KV cache de 18 GiB + pesos en
    # memoria unificada) deja ~3 GiB disponibles y el pgmajfault sostenido es
    # el precio del diseño, no degradación (medido 12-11: idle 89 %, PSI
    # memory avg10 0.46, sin OOM, nodo sirviendo).
    NodeMemoryMajorPagesFaults:
      create: false
    # SC-6015 (problema SC-5976, keep-causa node-degraded:80563cc44e): reemplazada
    # por pocharlies-node-saturation (manifests/rules.yaml), mismo patrón que
    # NodeMemoryHighUtilization arriba. Dos motivos:
    #   1. su PromQL no hace el join con kube_pod_info, así que la alerta no lleva
    #      label `node` y dos saturaciones en nodos DISTINTOS comparten la firma
    #      keep-causa de ops-watch: SC-5941 (atlantic) y SC-5975 (dgx3) montaron
    #      el mismo keep-causa y detectar_problemas abrió un [PROBLEMA] falso;
    #   2. dispara de forma legítima bajo carga normal en los nodos de cómputo
    #      (atlantic: sesiones de la compañía; los Sparks: worker vLLM / lanes
    #      creative). La copia mantiene el warning >2/core en los nodos que no
    #      son de cómputo y desdobla los de cómputo en NodeSystemSaturationCompute
    #      (info → blackhole, sin Request): el umbral global no baja y una
    #      saturación real fuera de cómputo sigue abriendo incidente.
    NodeSystemSaturation:
      create: false
    # SC-6015: reemplazada por la copia de pocharlies-node-saturation con el join
    # `* on(pod) group_left(node)`. Ya era info (→ blackhole, no abre Request),
    # pero sin `node` compartía firma keep-causa entre nodos dentro del
    # incidente node-degraded (evidencia SC-5941: NodeCPUHighUsage en atlantic).
    NodeCPUHighUsage:
      create: false
    # INFRA-1418 (causa del problema SC-5644, keep-causa critical-safety-net:
    # 43d45ddd35): reemplazada por el par calibrado pocharlies.vmsingle-memory
    # (manifests/rules.yaml). La regla del operador (anon/available > 0.8, for
    # 5m) mide contra el LÍMITE del contenedor, pero VictoriaMetrics dimensiona
    # sus caches hasta el límite por diseño: con el working set creciendo con
    # las series activas la relación cruza 0.8 en ciclos sin fuga ni OOM — 4
    # incidentes critical el 15-11 (SC-5634/SC-5643), 0 reinicios y 0 OOMKill
    # en 17 días. La rotación de límite (12Gi→16Gi SC-2907, 16Gi→24Gi PR #213)
    # habría vuelto a dispararla en ~45-60 días. Mismo patrón que
    # NodeMemoryHighUtilization arriba: el chart permite reescribir la regla,
    # no desdoblarla en dos alertas con umbral y `for` distintos.
    TooHighMemoryUsage:
      create: false
    # SC-2641 (DEPL-15279): duplicado de la casa. La condición de esta regla del
    # chart (spec > available, 15 min) es un subconjunto de KubernetesDeploymentUnavailable
    # (manifests/rules.yaml, critical), que además SÍ puede excluir las identidades
    # del perfil llm-tp — el chart no admite exclusión por deployment y cada cambio
    # de variante del qwen38 (carga de 1-3 h) montaba el incidente DEPL con esta
    # warning. Cobertura: KubernetesDeploymentUnavailable (resto) +
    # LlmResidentDeploymentUnavailable (llm, 2 h).
    KubeDeploymentReplicasMismatch:
      create: false
    # INFRA-1187: reemplazadas por pocharlies-pod-workload
    # (manifests/pod-workload-rules.yaml). La copia del chart agrega
    # by(namespace, pod) y no sabe quién es el owner del pod, así que no puede
    # llevar `workload`; la regla `deployment-degraded` agrupa por
    # [namespace, workload] y Keep da huella «none» a la alerta a la que le
    # falte cualquier criterio (rulesengine._calc_rule_fingerprint), así que
    # sin reemplazo los síntomas de pod volverían a un incidente genérico. Las
    # copias nuevas conservan expr/for/severity y mapean el workload con
    # kube_pod_owner → kube_replicaset_owner.
    KubePodNotReady:
      create: false
    KubeContainerWaiting:
      create: false
    # INFRA-1187: `workload` para que deployment-degraded agrupe por workload.
    # El valor es plantilla de vmalert (se evalúa por serie al disparar la
    # alerta), no de Helm: values.yaml no se renderiza como template.
    KubeStatefulSetReplicasMismatch:
      spec:
        labels:
          workload: "{{ $labels.statefulset }}"
    KubePdbNotEnoughHealthyPods:
      spec:
        labels:
          workload: "{{ $labels.poddisruptionbudget }}"
    # INFRA-1264: `workload` para que workload-degraded agrupe por workload
    # (patrón INFRA-1187). Con [namespace], el dgx3 NotReady del 08-11 y una
    # causa distinta del mismo ns compartían keep-causa y la recurrencia no era
    # medible (SC-5033).
    KubeDeploymentRolloutStuck:
      spec:
        labels:
          workload: "{{ $labels.deployment }}"
    KubeDaemonSetRolloutStuck:
      spec:
        labels:
          workload: "{{ $labels.daemonset }}"
    # La plantilla del chart indexa por nombre de alerta y el CRITICAL (for 1m)
    # y el WARNING (for 1h) comparten nombre, así que `spec` cae en las dos
    # ramas (templates/victoria-metrics-operator/vmalert/rule.yaml). El PVC es
    # el identificador de la causa, como el PDB arriba.
    KubePersistentVolumeFillingUp:
      spec:
        labels:
          workload: "{{ $labels.persistentvolumeclaim }}"
    # INFRA-1264: reemplazada por pocharlies-pod-workload
    # (manifests/pod-workload-rules.yaml) con `workload`, por el mismo motivo
    # que KubePodNotReady/KubeContainerWaiting arriba: la copia del chart
    # agrega por pod y no sabe quién es el owner.
    KubePodCrashLooping:
      create: false
    # Reemplazada por pocharlies-vmagent-scrape-pools (manifests/rules.yaml): la
    # copia del chart dispara también con pools de Deployments parados a mano
    # (spec.replicas 0), que no son una mala configuración — MON-18508 abrió con
    # frigate (parado el 05-11 para librar la GPU al reranker/embedder, anotación
    # `e-dani.com/parado-por`) y libreplay-web (dormido). La copia de la casa
    # guarda por kube_deployment_spec_replicas (patrón SC-4712) y falla hacia
    # avisar si kube-state-metrics no responde.
    ScrapePoolHasNoTargets:
      create: false
  groups:
    etcd:
      create: false
    kubernetesSystemControllerManager:
      create: false
    kubeScheduler:
      create: false
    kubernetesSystemScheduler:
      create: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

vmsingle:
  enabled: true
  spec:
    useDefaultResources: false
    resources:
      requests:
        # 2026-08-15: 300m -> 450m. Pedia 300m consumiendo 416-457m sostenidos,
        # asi que el scheduler no veia su peso en un nodo al 97% de requests.
        # 2026-09-13 (INFRA-42/INFRA-82): 450m -> 700m. p95 14d = 645m con
        # throttling real (es la TSDB). Sin sidecar: request del pod = request
        # del contenedor.
        cpu: 700m
        # 2026-10-28 (SC-2985): 1Gi -> 12Gi. El pod consumia 11.7Gi sostenidos
        # con request de 1Gi: el scheduler no veia su peso y el limite de 12Gi
        # se quedo sin margen. OOMKilled (exit 137) el 27-10; con vmsingle caido
        # las reglas absent() disparan en bloque (incidente Keep CRIT-17464,
        # 4 criticos a la vez). Request = consumo real, doctrina INFRA-42/82.
        memory: 12Gi
      limits:
        cpu: "2"
        # 2026-10-28 (SC-2907): 12Gi -> 16Gi. OOMKilled el 27-10 con el working
        # set tocando el limite (meseta 9-11 GiB de cache, pico medido 11.9 GiB
        # en consultas pesadas de vmalert/Keep). El OOM de vmsingle abre hueco de
        # ingesta -> absent() de LlmPoolCapabilityUnavailable dispara un critico
        # con el pool sano (CRIT-16462).
        # 2026-11-16 (SC-5643): 16Gi -> 24Gi. El working set ha crecido con las
        # series activas: anon RSS 12.3 GiB sostenido, pico 7d 13.9 GiB = 0.87 del
        # limite de 16Gi. VictoriaMetrics dimensiona sus caches a la memoria
        # disponible (por diseno ocupa hasta el limite y suelta bajo presion),
        # asi que la regla del operador TooHighMemoryUsage (anon/available > 0.8
        # durante 5m) disparaba en ciclos: 4 incidentes Keep critical del 15-11
        # (keep-causa critical-safety-net:43d45ddd35). No era fuga: 0 reinicios y
        # 0 OOM en 17 dias. Con 24Gi el pico queda en ~0.58 del limite. Nodo con
        # margen: ks5-cp-3 tenia 22 GiB MemAvailable (medido 16-11).
        # 2026-11-25 (SC-6652): 24Gi -> 32Gi. OOMKilled 25-11 23:27 UTC con el
        # working set otra vez en el limite: 30 min tras el reinicio, anon RSS
        # 23.0 GiB sobre vm_available_memory_bytes 25.8 GiB = ratio 0.95 (medido
        # en /metrics del propio vmsingle). El hueco de ingesta (vmagent acumulo
        # ~350 MB de cola) enrancio absent(image_studio_worker_loop_last_tick...)
        # y Keep abrio IMG-21009 «Image Studio degradado» con los workers sanos:
        # mismo patron documentado que CRIT-17464/CRIT-16462 (SC-2907). El par
        # calibrado pocharlies.vmsingle-memory mide anon/available del proceso,
        # asi que se autoajusta al limite nuevo (runbook infra-alert-ops: nada
        # que recalcular en la expr). Nodo actual atlantic: 79/128 GiB usados
        # (61%), margen de sobra para 32Gi. Causa de fondo = cardinalidad
        # creciente (indexdb 75 GiB, SC-6637): va al problema SC-5644, no aqui.
        memory: 32Gi
    extraArgs:
      maxLabelsPerTimeseries: "200"
      # 2026-11-26 (SC-6682): concurrencia de SELECT 4 (default = 2*CPU limite) -> 8,
      # y cola de espera 10 s -> 30 s. Medido: vm_concurrent_select_limit_reached
      # sostenido ~3/s incluso tras el subidón de memoria de SC-6652; vmalert se
      # llevava 429 y i/o timeouts (~2800 ejecuciones fallidas/hora) y su grupo
      # synapse.reloj enclavó SynapseRelojParado (23:15:40-00:10:40Z) con el reloj
      # sano (latido con lag 5-10 s en la ventana, medido en la serie). El cap 4
      # lo saturan sobre todo las propias reglas de vmalert con ventanas [24h].
      # Con 8 ranuras + cola de 30 s una regla lenta ya no convierte el resto del
      # plano de alertas en falsos positivos.
      search.maxConcurrentRequests: "8"
      search.maxQueueDuration: "30s"
    # Keep metrics for 48 hours. This is intentionally expressed in hours so
    # the live CR and the requested policy are unambiguous.
    retentionPeriod: "48h"
    storage:
      accessModes: [ReadWriteOnce]
      storageClassName: longhorn
      resources:
        requests:
          # 2026-11-25 (SC-6637): 100Gi -> 150Gi. DiskRunsOutOfSpace critico (Keep
          # CRIT-20980): el PVC estaba al 81 % (79,2 Gi usados de 98,1) y la regla es
          # vm_data_size/(vm_data_size+free) > 0,8. El desglose medido: data/small +
          # data/big = 3,2 Gi (lo que corresponde a 48 h de retencion) frente a
          # data/indexdb = 75,1 Gi en 66 partes, algunas de 22 dias atras que la
          # rotacion de retencion no elimino. El indexdb crece con el total de series
          # registradas (/api/v1/status/tsdb: 5.001.233 series, 421.853.426 pares
          # etiqueta-valor; los mayores son container_tasks_state,
          # container_memory_failures_total, apiserver_request_duration_seconds_bucket,
          # container_blkio_device_usage_total y prober_probe_duration_seconds_bucket),
          # no con los datos retenidos: bajar la retencion no lo arregla y subir caches
          # tampoco, porque no son caches sino indice. Es la segunda vez que este PVC
          # se llena (primera: 50Gi -> 100Gi, rama sc-disk-vm); la cardinalidad va en
          # el ticket de problema correspondiente. Margen del disco Longhorn medido en
          # el nodo del replica (ks5-cp-3): 357 Gi disponibles de 942.
          # 2026-11-25 (SC-6637, mismo turno): 150Gi -> 200Gi. Con 150Gi medido, la
          # tasa se acelero: de 80,1 Gi usados (22:50) a 89,4 Gi (23:25), unos
          # 16 Gi/h, sin ficheros borrados-aun-abiertos (0 en /proc/1/fd) y con las
          # partes de data/indexdb pasando de 67 a 61: se crean y se descartan
          # mientras se escribe. Con esa pendiente, el 0,8 de la regla se cruzaba de
          # nuevo en ~2 h (118 Gi). Con 200Gi el margen medido es 106 Gi libres
          # (46% de uso), ~4 h a esa tasa. Es colchon, no arreglo: el arreglo esta en
          # SC-6644 (cardinalidad registrada y partes de indice que la rotacion de
          # 48h no elimina).
          storage: 200Gi
    # SC-6096 (mitigacion SC-6094): sale de ks5-cp-3. El plano de control va a llevar
    # taint control-plane:NoSchedule y aqui solo debe quedar lo que no pueda vivir en
    # otro sitio; la PVC es longhorn (RWO) -> el volumen se re-adjunta en atlantic sin
    # perdida de series. atlantic (128 GiB, 36 % de requests de memoria) tiene el margen
    # de los 24 GiB de limite; ubuntu estaba al 74 % y recibe las rafagas de runners.
    nodeSelector:
      kubernetes.io/hostname: atlantic

vmcluster:
  enabled: false   # single-node mode

vmagent:
  enabled: true
  spec:
    useDefaultResources: false
    resources:
      requests:
        # 2026-09-13 (INFRA-42/INFRA-82): 200m -> 390m. p95 14d = 603m. SRE
        # mide el pod entero (210m = 200m + 10m config-reloader); objetivo
        # 400m/pod => 390m aqui + 10m del reloader de abajo.
        cpu: 390m
        memory: 300Mi
      limits:
        cpu: "1"
        memory: 750Mi
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi
    extraArgs:
      promscrape.maxScrapeSize: "67108864"
      promscrape.streamParse: "true"
    selectAllByDefault: true
    # 2026-08-15: 20s -> 30s. Un tercio menos de scrapes e ingesta, medido en
    # ~1 core entre vmagent y vmsingle. No se baja a 60s porque 10 de las 401
    # reglas usan ventanas [1m]/[2m] y se quedarian sin muestras suficientes;
    # a 30s siguen teniendo 2-4. Esas reglas las genera el chart, asi que
    # ensancharlas seria pelearse con el operador en cada upgrade.
    scrapeInterval: 30s
    # SC-6096: con vmsingle (arriba). Sin PVC propia: el buffer en memoria se pierde en
    # el reinicio (segundos de scrapes), las series almacenadas no. Scrapea por red de
    # pods, le da igual el nodo.
    nodeSelector:
      kubernetes.io/hostname: atlantic

vmalert:
  enabled: true
  spec:
    nodeSelector:
      node-pool: ks5-nvme
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi
  remoteWriteVMAgent: false

alertmanager:
  enabled: true
  spec:
    # SC-3711 (30-10): el estado de notificacion de Alertmanager (grupos firing
    # y cola de reintentos a Keep) solo vive en memoria: prom/alertmanager
    # v0.32.1 no tiene --data.snapshot/--data.restore (verificado sobre el
    # binario vivo; el PVC guarda silences y notification logs, no ese estado)
    # y con una replica cada recreacion del pod perdia el resolved de las
    # alertas ya firing -> Keep dejaba la incidencia acknowledged (SC-3588).
    # Con 2 replicas el operador habilita el cluster gossip y el estado
    # sobrevive a la recreacion de un pod; el chart anade ademas el notifier de
    # la 2a replica a vmalert, asi que la ingesta no depende del pod-0. El caso
    # "ambas replicas caen a la vez" sigue perdiendo estado: el guard durable
    # es la reconciliacion Keep<->Alertmanager (decidido en SC-3711).
    replicaCount: 2
    # Drop the per-config `namespace="monitoring"` entry matcher the
    # operator otherwise injects into the synapse-webhook route. Without
    # this, infra alerts (kube-state/node-exporter carry the AFFECTED
    # object's namespace, not "monitoring") never enter the route and are
    # dropped to the blackhole receiver. With it, the route captures ALL
    # alerts regardless of namespace.
    disableNamespaceMatcher: true
    # El hostAliases de synapse.e-dani.com (100.109.183.9) se retiró con el
    # cutover a Keep: la ingesta es ahora in-cluster contra keep-backend, así que
    # Alertmanager ya no resuelve ningún nombre externo. Ver
    # manifests/alertmanager-config.yaml.
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi
    # SC-5389 (13-11): con el default del operador (limits 256Mi) el contenedor
    # alertmanager OOMKilled de forma recurrente — working set medido en pico
    # ~268 MB (container_memory_working_set_bytes, 6 h). Cada OOM corta el
    # webhook a Keep y abre el incidente keep-hub-degraded (HUB-19110/19114,
    # 5 y 3 reinicios en las dos réplicas). 512Mi deja ~2x de margen.
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 200m
        memory: 512Mi
    nodeSelector:
      node-pool: ks5-nvme
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true
  adminPassword: "ChangeMe-Grafana-Bootstrap-2026!"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oauth
        key: client-secret
  grafana.ini:
    server:
      domain: grafana.e-dani.com
      root_url: https://grafana.e-dani.com/
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      icon: signin
      allow_sign_up: true
      auto_login: false
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      empty_scopes: false
      auth_url: https://auth-next.e-dani.com/realms/edani/protocol/openid-connect/auth
      token_url: http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/token
      api_url: http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/userinfo
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      role_attribute_path: "contains(groups, `/edani-admins`) && `GrafanaAdmin` || contains(groups, `/edani-operators`) && `Editor` || `Viewer`"
      role_attribute_strict: true
      skip_org_role_sync: false
      allow_assign_grafana_admin: true
      auth_style: InHeader
      use_pkce: true
      validate_id_token: true
      jwk_set_url: http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/certs
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  nodeSelector:
    node-pool: ks5-nvme
  service:
    type: ClusterIP
  # disable ingress here, use Traefik IngressRoute
  ingress:
    enabled: false
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    dashboards:
      enabled: true
      defaultFolderName: General
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      searchNamespace: ALL
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Madrid

# Standard exporters
kubeStateMetrics:
  enabled: true
  nodeSelector:
    node-pool: ks5-nvme

nodeExporter:
  enabled: true

prometheus-node-exporter:
  hostNetwork: false
  nodeSelector: {}
  tolerations:
    - operator: Exists   # let it run on tainted nodes too
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  # NOTE: this list REPLACES the chart's default extraArgs, so we must
  # repeat the upstream filesystem exclude flags in addition to enabling
  # the textfile collector.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
    - --collector.textfile.directory=/host/root/var/lib/ovh-pvc-hub

# Override cadvisor scrape to drop the high-cardinality `id` cgroup label
# (every container restart creates new series). Keep only container_* metrics
# (cadvisor is container-only anyway), then drop the `id` label.
kubelet:
  vmScrapes:
    cadvisor:
      spec:
        # SC-6648 (26-11-2026, incidente Keep MON-21004 monitoring-degraded): el
        # timeout por defecto del chart (5 s) no da para el cuerpo de cadvisor de
        # `ubuntu`: 6,4 MB y ~18.000 samples por scrape (medido en vmagent:
        # scrape_duration 962 ms en régimen normal, scrapes_failed 9 de 68 en la
        # ventana = 13 % reventando los 5 s en los picos del nodo — docker
        # LibreChat + runners). Cada pico es un «cannot read data ... Client.Timeout»
        # que, sumado al resto del goteo, sostenía TooManyScrapeErrors (for 15m)
        # y rearmaba monitoring-degraded. 25 s deja margen sobre el intervalo de
        # 30 s sin solapar scrapes. No es un problema del nodo: es el default del
        # chart dimensionado para cadvisor sin pila docker encima.
        scrapeTimeout: 25s
        metricRelabelConfigs:
          # SC-6640 (25-11-2026, incidente Keep MON-20992 monitoring-degraded):
          # container_tasks_state lleva `name` = ID crudo de contenedor, y los
          # runners de ARC los crean/destruyen sin parar. Cada ID nuevo es una
          # serie nueva: vmsingle llegaba a resetear el rollup-result-cache
          # (>190 avisos «too high cardinality of label values» en un día, la
          # línea citada era esta métrica) — eso disparó TooManyLogs sobre
          # vmsingle (tercer miembro del incidente) y mantuvo el índice tsid
          # (~5,7 GiB de caché) y las inserciones saturadas (retraso de ingesta
          # de ~10-15 min y ~450 MB de cola remotewrite en vmagent). Nadie
          # consume esta métrica: 0 coincidencias de «container_tasks_state» en
          # k8s-observability, dgx-infra (dashboards) y el resto de la granja.
          # Retirarla del scrape no pierde ninguna serie consultada.
          - source_labels: [__name__]
            regex: "container_tasks_state"
            action: drop
          - source_labels: [__name__]
            regex: "container_.+"
            action: keep
          - regex: "id"
            action: labeldrop

# Don't enable the kube-state-metrics subchart on edge (sauvage)
kube-state-metrics:
  metricLabelsAllowlist:
    - services=[infra]
    - namespaces=[infra]
    - persistentvolumeclaims=[excluded_from_alerts]
    # SC-6138: la ventana creative de dgx3 se reconoce por su etiqueta (la misma que usa
    # el eje, dgx3_mode.py WINDOW_LABEL), no por una lista de nombres en las reglas.
    - deployments=[dgx-infra/dgx3-window]
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      # SC-2654 (27-10): con 256Mi el contenedor entraba en bucle de OOMKills
      # (57 reinicios en 9 h; estable ~120 Mi, el pico va en el sync inicial de
      # los stores, secrets/configmaps incluidos). Cada OOM deja obsoletas las
      # series kube_daemonset_* y vmalert dispara KubeDaemonSetRolloutStuck /
      # KubernetesDaemonSetUnavailable sobre alloy y los node-exporters → el
      # incidente de Keep «Workloads degradados en monitoring» (WORK, regla
      # workload-degraded) llevaba recociéndose desde el 17-10. 512Mi = 4x el
      # steady-state.
      memory: 512Mi
  nodeSelector:
    node-pool: ks5-nvme
  # DGX-128 — telemetría del sync 1Password -> Vault (external-secrets).
  # ESO no expone una métrica de "última sincronización con éxito":
  # .status.refreshTime vive solo en el CR (veredicto del tech lead en
  # DGX-125). El mecanismo estándar para exponerlo es la CustomResourceState
  # de kube-state-metrics (docs v2.18.0,
  # docs/metrics/extend/customresourcestate-metrics.md): "RFC3339 times are
  # parsed to float timestamp", de ahí que el gauge sobre [status,
  # refreshTime] dé un unixtime y las alertas de "sync viejo" sean
  # time() - metric > umbral. Con metricNamePrefix "eso" las familias salen
  # como eso_externalsecret_status_refresh_time /
  # eso_pushsecret_status_refresh_time. Si un objeto nunca sincronizó, la
  # serie no existe para ese objeto: lo cubren las alertas Missing/Absent de
  # manifests/external-secrets-rules.yaml, no nilIsZero (una serie en 0
  # fingiría un sync que no ha pasado).
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: external-secrets.io
              version: v1
              kind: ExternalSecret
            metricNamePrefix: eso
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: externalsecret_status_refresh_time
                help: "Unix timestamp of the last successful refresh of the ExternalSecret (.status.refreshTime), per name/namespace."
                each:
                  type: Gauge
                  gauge:
                    path: [status, refreshTime]
          - groupVersionKind:
              group: external-secrets.io
              version: v1alpha1
              kind: PushSecret
            metricNamePrefix: eso
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: pushsecret_status_refresh_time
                help: "Unix timestamp of the last successful refresh of the PushSecret (.status.refreshTime), per name/namespace."
                each:
                  type: Gauge
                  gauge:
                    path: [status, refreshTime]
  # El ClusterRole del subchart (vm-kube-state-metrics) no trae
  # external-secrets.io; sin list/watch aquí la CRS falla en silencio (el
  # docs de KSM: "needs list and watch permissions ... as well as to the
  # resources you want to gather metrics from").
  rbac:
    extraRules:
      - apiGroups: [external-secrets.io]
        resources: [externalsecrets, pushsecrets]
        verbs: [list, watch]
